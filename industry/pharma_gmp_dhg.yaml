  - name: "Cleanroom HVAC, e-BPR Deviation & Cold Chain Live Surveillance Dashboard"
    icon: "medication"
    color: "#00897B"
    note: "[L3 • DHG] Real-time cleanroom differential pressure cascade monitoring, cold-chain temperatures, and electronic BPR batch release tracking for DHG Pharma."
    panels:
      - name: "Right-First-Time Yield (%)"
        type: metric
        collection: dhg_plant_kpis
        options:
          field: right_first_time_yield_pct
          function: avg
          decimals: 1
          suffix: "%"
        position_x: 1
        position_y: 1
        width: 18
        height: 12
        icon: "verified"
        color: "#2E7D32"

      - name: "Finished Dosage Units Produced"
