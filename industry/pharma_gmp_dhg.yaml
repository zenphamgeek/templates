template_id: pharma_gmp_dhg
version: 1.0.0
industry_vertical: pharmaceutical_gxp
archetype: "DHG Pharma EU-GMP Manufacturing Archetype"

metadata:
  name: "DHG Pharma EU/WHO-GMP Life Sciences Resilience Template"
  description: "Operational resilience, cleanroom HVAC differential pressure cascade control, electronic batch production record (e-BPR) deviation workflows, and cold-chain quarantine for EU-GMP certified pharmaceutical facilities."
  status: VERIFIED
  author: "Industry Template Architect & GMP Specialist"
  approver: "Zen Phạm"
  created_at: "2026-10-04"
  tags:
    - pharmaceutical
    - gmp
    - cleanroom
    - hvac
    - differential_pressure
    - ebpr
    - cold_chain
    - sterility
  regulatory_frameworks:
    - "EudraLex Volume 4 EU Guidelines for Good Manufacturing Practice"
    - "WHO Technical Report Series No. 961 Annex 3 HVAC for Pharmaceuticals"
    - "FDA 21 CFR Part 11 Electronic Records and Electronic Signatures"
    - "ISO 14644-1 Cleanrooms and Associated Controlled Environments"

taxonomy_and_fields:
  collections:
    - collection: dhg_cleanroom_telemetry
      name: "Cleanroom HVAC Differential Pressure & Particles"
      description: "Continuous environmental monitoring of differential pressure cascades, airborne particles, temperature, and humidity across classified suites."
      fields:
        - field: id
          type: uuid
        - field: sensor_tag
          type: string
        - field: cleanroom_suite
          type: string
        - field: iso_grade
          type: string
        - field: differential_pressure_pa
          type: float
        - field: temperature_c
          type: float
        - field: relative_humidity_pct
          type: float
        - field: particle_count_05um
          type: integer
        - field: air_balance_status
          type: string
        - field: timestamp
          type: timestamp

    - collection: dhg_batch_production_records
      name: "Electronic Batch Production Records (e-BPR)"
      description: "Batch release documentation, critical process parameters (CPP), critical quality attributes (CQA), and Qualified Person (QP) sign-offs."
      fields:
        - field: id
          type: uuid
        - field: batch_no
          type: string
        - field: product_name
          type: string
        - field: line_code
          type: string
        - field: status
          type: string
        - field: critical_deviation_flag
          type: boolean
        - field: qp_release_authorized
          type: boolean
        - field: rejection_reason
          type: text

    - collection: dhg_cold_chain_telemetry
      name: "Cold-Chain & Stability Storage Telemetry"
      description: "Temperature and door-opening monitoring for 2°C - 8°C walk-in cold rooms and -80°C ultra-low freezers."
      fields:
        - field: id
          type: uuid
        - field: storage_unit_id
          type: string
        - field: chamber_type
          type: string
        - field: temperature_c
          type: float
        - field: excursion_duration_minutes
          type: integer
        - field: quarantine_status
          type: string
        - field: timestamp
          type: timestamp

    - collection: dhg_plant_kpis
      name: "Pharmaceutical Plant Quality & Yield KPIs"
      description: "Aggregated plant metrics for right-first-time quality, environmental compliance, and batch cycle times."
      fields:
        - field: id
          type: uuid
        - field: recorded_date
          type: date
        - field: finished_dosage_units
          type: integer
        - field: right_first_time_yield_pct
          type: float
        - field: environmental_excursions_count
          type: integer
        - field: ebpr_cycle_time_hours
          type: float

    - collection: dhg_gmp_deviations
      name: "EU-GMP Quality Deviations & Containment Records"
      description: "Critical, major, and minor production deviations, 5-Whys RCA, and sister batch containment holds."
      fields:
        - field: id
          type: uuid
        - field: deviation_no
          type: string
        - field: batch_id
          type: uuid
        - field: cleanroom_suite
          type: string
        - field: severity
          type: string
        - field: rca_completed
          type: boolean
        - field: root_cause_category
          type: string
        - field: sister_batches_hold_applied
          type: boolean
        - field: capa_assigned
          type: boolean
        - field: status
          type: string
        - field: rejection_reason
          type: text

    - collection: dhg_oos_investigations
      name: "Out-of-Specification (OOS) Laboratory Dossiers"
      description: "Phase I laboratory investigations, chromatography audit trail locks, and Phase II manufacturing escalation."
      fields:
        - field: id
          type: uuid
        - field: oos_no
          type: string
        - field: batch_no
          type: string
        - field: analytical_method
          type: string
        - field: lab_instrument_error_confirmed
          type: boolean
        - field: lab_retest_valid
          type: boolean
        - field: raw_chromatography_locked
          type: boolean
        - field: status
          type: string
        - field: qa_hold_placed
          type: boolean
        - field: rejection_reason
          type: text

    - collection: dhg_change_controls
      name: "GMP Change Control & Qualification Packages"
      description: "EU-GMP Annex 15 change controls, IQ/OQ/PQ validation protocol verification, and DAV variation gates."
      fields:
        - field: id
          type: uuid
        - field: change_control_no
          type: string
        - field: system_code
          type: string
        - field: classification
          type: string
        - field: risk_assessment_approved
          type: boolean
        - field: validation_protocol_complete
          type: boolean
        - field: dav_variation_approved_or_exempt
          type: boolean
        - field: qa_head_approved
          type: boolean
        - field: status
          type: string
        - field: rejection_reason
          type: text

    - collection: dhg_audit_trail_events
      name: "21 CFR Part 11 ALCOA+ Audit Trail Events"
      description: "Computerized system audit logs, NTP time synchronization, MFA signatures, and deletion protection."
      fields:
        - field: id
          type: uuid
        - field: system_id
          type: string
        - field: user_id
          type: uuid
        - field: action_type
          type: string
        - field: ntp_time_delta_sec
          type: float
        - field: signature_mfa_verified
          type: boolean
        - field: audit_trail_gaps_count
          type: integer
        - field: unauthorized_deletion_attempts
          type: integer
        - field: status
          type: string
        - field: alert_flag
          type: string
        - field: timestamp
          type: timestamp

    - collection: grc_actions
      name: "Pharmaceutical Quality System (PQS) CAPA & Regulatory Actions"
      description: "Corrective and Preventive Actions (CAPA), QP batch disposition holds, and ICH Q10 management review directives."
      fields:
        - field: id
          type: uuid
        - field: status
          type: string
        - field: title
          type: string
        - field: priority
          type: string
        - field: source_module
          type: string
        - field: action_category
          type: string
        - field: description
          type: string
        - field: assigned_to
          type: string

    - collection: hse_tasks
      name: "Cleanroom & Cold-Chain Operational Tasks"
      description: "Field intervention, Grade A environmental recovery, and Mean Kinetic Temperature (MKT) stability evaluation tasks."
      fields:
        - field: id
          type: uuid
        - field: status
          type: string
        - field: title
          type: string
        - field: priority
          type: string
        - field: task_title
          type: string
        - field: unit_tag
          type: string
        - field: description
          type: string
        - field: assigned_to
          type: string
        - field: deadline_hours
          type: integer

  relations:
    - collection: dhg_batch_production_records
      field: line_code
      related_collection: dhg_cleanroom_telemetry
      type: m2o

  equipment_taxonomy:
    plant_code: DHG_CANTHO_GMP
    areas:
      - code: "ASEPTIC_SUITE"
        name: "Aseptic Sterile Filling Complex (Grade A/B)"
        systems:
          - code: "ISOLATOR_1"
            name: "Restricted Access Barrier System (RABS) / Isolator"
          - code: "HVAC_AHU_A1"
            name: "HEPA 14 Recirculating Air Handling Unit A1"
          - code: "WFI_LOOP"
            name: "Water For Injection (WFI) Continuous 85°C Circulation"
      - code: "ORAL_SOLID_SUITE"
        name: "Solid Oral Dosage - Granulation & Tableting (Grade C/D)"
        systems:
          - code: "FLUID_BED"
            name: "High Shear Mixer & Fluid Bed Dryer 1"
          - code: "ROTARY_PRESS"
            name: "High-Speed Rotary Tablet Press 2"
      - code: "AUTOMATED_WH"
        name: "EU-GMP Automated High-Bay Cold Warehouse"
        systems:
          - code: "COLD_BAY_1"
            name: "Walk-in Cold Storage Chamber 1 (2°C - 8°C)"
          - code: "ULT_FREEZER_A"
            name: "Ultra-Low Temperature Freezer (-80°C)"

business_flows:
  - key: dhg-cleanroom-dp-interlock
    name: "Cleanroom Differential Pressure Cascade Interlock Flow"
    description: "Evaluates cleanroom differential pressure cascade across Grade A/B/C rooms. If differential pressure drops below 10 Pa, immediately halts aseptic line and escalates containment breach."
    status: active
    accountability: system
    trigger:
      type: event
      scope:
        - items.create
        - items.update
      collections:
        - dhg_cleanroom_telemetry
    nodes:
      - key: read_dp_telemetry
        name: "Read Differential Pressure & Particle Telemetry"
        type: item-read
        options:
          collection: dhg_cleanroom_telemetry
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - sensor_tag
              - cleanroom_suite
              - iso_grade
              - differential_pressure_pa
              - air_balance_status
        position_x: 1
        position_y: 1

      - key: verify_dp_cascade_limit
        name: "Verify Pressure Cascade Integrity (>= 10.0 Pa)"
        type: condition
        options:
          filter:
            read_dp_telemetry:
              differential_pressure_pa:
                _lt: 10.0
        position_x: 25
        position_y: 1

      - key: trigger_containment_breach
        name: "Escalate Status to PRESSURE_CASCADE_BREACH"
        type: item-update
        options:
          collection: dhg_cleanroom_telemetry
          key: "{{$trigger.key}}"
          data:
            air_balance_status: PRESSURE_CASCADE_BREACH
        position_x: 50
        position_y: 1

      - key: alert_qa_qualified_person
        name: "Alert Qualified Person & HVAC Lead of Pressure Loss"
        type: notification
        options:
          recipient: "{{$trigger.payload.qualified_person_id}}"
          subject: "EU-GMP BREACH: Cleanroom {{read_dp_telemetry.cleanroom_suite}} Differential Pressure Loss"
          message: "Critical differential pressure drop ({{read_dp_telemetry.differential_pressure_pa}} Pa < 10 Pa) at {{read_dp_telemetry.sensor_tag}}. Aseptic filling halted; initiate environmental deviation report."
        position_x: 75
        position_y: 1

      - key: confirm_pressure_cascade_nominal
        name: "Confirm Nominal Pressure Cascade"
        type: transform
        options:
          format: json
          expression: "Cleanroom differential pressure is compliant with EU-GMP Annex 1 (> 10 Pa)."
        position_x: 50
        position_y: 15

    edges:
      - ["$trigger", "read_dp_telemetry", "resolve"]
      - ["read_dp_telemetry", "verify_dp_cascade_limit", "resolve"]
      - ["verify_dp_cascade_limit", "trigger_containment_breach", "resolve"]
      - ["trigger_containment_breach", "alert_qa_qualified_person", "resolve"]
      - ["verify_dp_cascade_limit", "confirm_pressure_cascade_nominal", "reject"]

  - key: dhg-batch-release-review
    name: "Electronic BPR Qualified Person (QP) Batch Release Flow"
    description: "Evaluates production batch quality records, sterility checks, and critical deviations before releasing pharmaceutical batches for commercial distribution."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - dhg_batch_production_records
      filter:
        status:
          _eq: pending_qp_review
    nodes:
      - key: read_ebpr_record
        name: "Read e-BPR Batch Record"
        type: item-read
        options:
          collection: dhg_batch_production_records
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - batch_no
              - product_name
              - line_code
              - critical_deviation_flag
        position_x: 1
        position_y: 1

      - key: verify_batch_sterility_and_cqas
        name: "Verify Zero Critical Deviations on Batch"
        type: condition
        options:
          filter:
            read_ebpr_record:
              critical_deviation_flag:
                _eq: false
        position_x: 25
        position_y: 1

      - key: authorize_commercial_release
        name: "Authorize Commercial Batch Release"
        type: item-update
        options:
          collection: dhg_batch_production_records
          key: "{{$trigger.key}}"
          data:
            status: batch_released
            qp_release_authorized: true
        position_x: 50
        position_y: 1

      - key: notify_supply_chain
        name: "Notify Supply Chain of Released Batch"
        type: notification
        options:
          recipient: "{{$trigger.payload.supply_chain_head_id}}"
          subject: "EU-GMP Batch Released: {{read_ebpr_record.batch_no}} ({{read_ebpr_record.product_name}})"
          message: "Qualified Person has certified and released batch for commercial distribution."
        position_x: 75
        position_y: 1

      - key: quarantine_batch
        name: "Quarantine Batch Due to Critical Deviation"
        type: item-update
        options:
          collection: dhg_batch_production_records
          key: "{{$trigger.key}}"
          data:
            status: batch_quarantined_investigation
            qp_release_authorized: false
            rejection_reason: "Critical OOS/OOT process deviation flagged during manufacturing. Quarantined pending full QA investigation."
        position_x: 50
        position_y: 15

      - key: alert_qa_investigation_team
        name: "Alert QA Deviation Investigation Board"
        type: notification
        options:
          recipient: "{{$trigger.payload.qa_investigator_id}}"
          subject: "DEVIATION INVESTIGATION: Batch {{read_ebpr_record.batch_no}} Quarantined"
          message: "Batch {{read_ebpr_record.batch_no}} withheld from release due to open critical quality deviations."
        position_x: 75
        position_y: 15

    edges:
      - ["$trigger", "read_ebpr_record", "resolve"]
      - ["read_ebpr_record", "verify_batch_sterility_and_cqas", "resolve"]
      - ["verify_batch_sterility_and_cqas", "authorize_commercial_release", "resolve"]
      - ["authorize_commercial_release", "notify_supply_chain", "resolve"]
      - ["verify_batch_sterility_and_cqas", "quarantine_batch", "reject"]
      - ["quarantine_batch", "alert_qa_investigation_team", "resolve"]

  - key: dhg-gmp-deviation-rca-impact
    name: "EU-GMP Quality Deviation Investigation & Sister-Batch Containment Flow"
    description: "Evaluates production deviations. Enforces 5-Whys root cause analysis, CAPA assignment, and immediate containment hold on sister batches sharing identical raw materials."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - dhg_gmp_deviations
      filter:
        status:
          _eq: deviation_logged
    nodes:
      - key: read_deviation_dossier
        name: "Read Deviation Dossier & Impact Assessment"
        type: item-read
        options:
          collection: dhg_gmp_deviations
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - deviation_no
              - batch_id
              - cleanroom_suite
              - severity
              - rca_completed
              - sister_batches_hold_applied
              - capa_assigned
        position_x: 1
        position_y: 1

      - key: verify_rca_and_containment_safeguards
        name: "Verify RCA Completed, Sister Batches Quarantined, and CAPA Assigned"
        type: condition
        options:
          filter:
            _and:
              - read_deviation_dossier:
                  rca_completed:
                    _eq: true
              - read_deviation_dossier:
                  sister_batches_hold_applied:
                    _eq: true
              - read_deviation_dossier:
                  capa_assigned:
                    _eq: true
        position_x: 25
        position_y: 1

      - key: advance_to_qa_compliance_review
        name: "Advance Deviation to QA Compliance Board Review"
        type: item-update
        options:
          collection: dhg_gmp_deviations
          key: "{{$trigger.key}}"
          data:
            status: deviation_under_qa_review
        position_x: 50
        position_y: 1

      - key: notify_lead_qa_investigator
        name: "Notify Lead QA Investigator of Completed Investigation"
        type: notification
        options:
          recipient: "{{$trigger.payload.qa_investigator_id}}"
          subject: "Deviation Dossier Ready: {{read_deviation_dossier.deviation_no}}"
          message: "Root cause determined, sister batches locked, and CAPA formulated. Ready for formal QA sign-off."
        position_x: 75
        position_y: 1

      - key: reject_incomplete_investigation
        name: "Reject Dossier Due to Missing RCA or Uncontained Batches"
        type: item-update
        options:
          collection: dhg_gmp_deviations
          key: "{{$trigger.key}}"
          data:
            status: deviation_rejected_incomplete_rca
            rejection_reason: "Investigation rejected: 5-Whys root cause incomplete or sister batches not placed on containment hold."
        position_x: 50
        position_y: 15

      - key: alert_production_department_head
        name: "Alert Production Department Head to Enforce 24h Containment"
        type: notification
        options:
          recipient: "{{$trigger.payload.production_head_id}}"
          subject: "DEVIATION REJECTED: Containment Breach on {{read_deviation_dossier.deviation_no}}"
          message: "Immediate action required: place all potentially impacted sister lots on hold within 24 hours."
        position_x: 75
        position_y: 15
    edges:
      - ["$trigger", "read_deviation_dossier", "resolve"]
      - ["read_deviation_dossier", "verify_rca_and_containment_safeguards", "resolve"]
      - ["verify_rca_and_containment_safeguards", "advance_to_qa_compliance_review", "resolve"]
      - ["advance_to_qa_compliance_review", "notify_lead_qa_investigator", "resolve"]
      - ["verify_rca_and_containment_safeguards", "reject_incomplete_investigation", "reject"]
      - ["reject_incomplete_investigation", "alert_production_department_head", "resolve"]

  - key: dhg-oos-lab-manufacturing-investigation
    name: "Out-of-Specification (OOS) Phase I Lab to Phase II Manufacturing Investigation"
    description: "Governs laboratory OOS results. Locks raw chromatography audit trail to prevent testing into compliance, verifies lab error validity, or escalates to cross-functional Phase II manufacturing investigation."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - dhg_oos_investigations
      filter:
        status:
          _eq: oos_flagged
    nodes:
      - key: read_oos_record
        name: "Read OOS Investigation Dossier"
        type: item-read
        options:
          collection: dhg_oos_investigations
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - oos_no
              - batch_no
              - analytical_method
              - lab_instrument_error_confirmed
              - lab_retest_valid
              - raw_chromatography_locked
        position_x: 1
        position_y: 1

      - key: verify_phase1_lab_error_criteria
        name: "Verify Verified Lab Instrument Error and Raw Chromatography Locked"
        type: condition
        options:
          filter:
            _and:
              - read_oos_record:
                  lab_instrument_error_confirmed:
                    _eq: true
              - read_oos_record:
                  lab_retest_valid:
                    _eq: true
              - read_oos_record:
                  raw_chromatography_locked:
                    _eq: true
        position_x: 25
        position_y: 1

      - key: resolve_as_lab_anomaly
        name: "Resolve Phase I as Documented Laboratory Error"
        type: item-update
        options:
          collection: dhg_oos_investigations
          key: "{{$trigger.key}}"
          data:
            status: oos_phase1_lab_error_resolved
        position_x: 50
        position_y: 1

      - key: notify_qc_manager
        name: "Notify QC Manager of Authorized Retest"
        type: notification
        options:
          recipient: "{{$trigger.payload.qc_manager_id}}"
          subject: "OOS Phase I Resolved: Instrument Error on {{read_oos_record.oos_no}}"
          message: "Lab error confirmed with audit trail locked. Formal retest authorized per SOP."
        position_x: 75
        position_y: 1

      - key: escalate_to_manufacturing_investigation
        name: "Escalate to Phase II Manufacturing Root Cause Investigation"
        type: item-update
        options:
          collection: dhg_oos_investigations
          key: "{{$trigger.key}}"
          data:
            status: oos_escalated_to_phase2_manufacturing
            qa_hold_placed: true
            rejection_reason: "No lab error identified: genuine batch non-conformance suspected. Cross-functional manufacturing investigation initiated."
        position_x: 50
        position_y: 15

      - key: alert_quality_director_phase2
        name: "Alert Quality Director & Quarantine Affected Product Lots"
        type: notification
        options:
          recipient: "{{$trigger.payload.quality_director_id}}"
          subject: "OOS PHASE II ESCALATION: Batch {{read_oos_record.batch_no}} Quarantined"
          message: "OOS {{read_oos_record.oos_no}} escalated to Phase II. Lab error ruled out; manufacturing investigation active."
        position_x: 75
        position_y: 15
    edges:
      - ["$trigger", "read_oos_record", "resolve"]
      - ["read_oos_record", "verify_phase1_lab_error_criteria", "resolve"]
      - ["verify_phase1_lab_error_criteria", "resolve_as_lab_anomaly", "resolve"]
      - ["resolve_as_lab_anomaly", "notify_qc_manager", "resolve"]
      - ["verify_phase1_lab_error_criteria", "escalate_to_manufacturing_investigation", "reject"]
      - ["escalate_to_manufacturing_investigation", "alert_quality_director_phase2", "resolve"]

  - key: dhg-change-control-revalidation-gate
    name: "EU-GMP Change Control Qualification (IQ/OQ/PQ) & DAV Regulatory Gate"
    description: "Evaluates GMP modifications. Verifies risk assessment, validation protocols (IQ/OQ/PQ), and Drug Administration of Vietnam (DAV) regulatory variation approvals prior to release."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - dhg_change_controls
      filter:
        status:
          _eq: cc_submitted
    nodes:
      - key: read_change_control_record
        name: "Read Change Control Dossier"
        type: item-read
        options:
          collection: dhg_change_controls
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - change_control_no
              - system_code
              - classification
              - risk_assessment_approved
              - validation_protocol_complete
              - dav_variation_approved_or_exempt
              - qa_head_approved
        position_x: 1
        position_y: 1

      - key: verify_qualification_and_regulatory_clearance
        name: "Verify Risk Assessment, IQ/OQ/PQ Protocol, DAV Filing, and QA Approval"
        type: condition
        options:
          filter:
            _and:
              - read_change_control_record:
                  risk_assessment_approved:
                    _eq: true
              - read_change_control_record:
                  validation_protocol_complete:
                    _eq: true
              - read_change_control_record:
                  dav_variation_approved_or_exempt:
                    _eq: true
              - read_change_control_record:
                  qa_head_approved:
                    _eq: true
        position_x: 25
        position_y: 1

      - key: authorize_change_control_implementation
        name: "Authorize GMP Change Implementation"
        type: item-update
        options:
          collection: dhg_change_controls
          key: "{{$trigger.key}}"
          data:
            status: change_control_approved
        position_x: 50
        position_y: 1

      - key: notify_validation_and_engineering_lead
        name: "Notify Validation Lead of Final Implementation Clearance"
        type: notification
        options:
          recipient: "{{$trigger.payload.validation_lead_id}}"
          subject: "Change Control Authorized: {{read_change_control_record.change_control_no}} for {{read_change_control_record.system_code}}"
          message: "IQ/OQ/PQ verified and DAV regulatory status compliant. Implementation authorized."
        position_x: 75
        position_y: 1

      - key: hold_change_control_regulatory_gap
        name: "Hold Change Control Due to Incomplete Validation or DAV Gap"
        type: item-update
        options:
          collection: dhg_change_controls
          key: "{{$trigger.key}}"
          data:
            status: change_control_held_regulatory_gap
            rejection_reason: "Qualification incomplete: IQ/OQ/PQ protocols unverified or missing required DAV regulatory variation approval."
        position_x: 50
        position_y: 15

      - key: alert_regulatory_affairs_officer
        name: "Alert Regulatory Affairs Officer & Validation Head"
        type: notification
        options:
          recipient: "{{$trigger.payload.ra_officer_id}}"
          subject: "CHANGE CONTROL HELD: Regulatory Gap on {{read_change_control_record.change_control_no}}"
          message: "Change implementation locked: resolve pending validation protocols and DAV dossier."
        position_x: 75
        position_y: 15
    edges:
      - ["$trigger", "read_change_control_record", "resolve"]
      - ["read_change_control_record", "verify_qualification_and_regulatory_clearance", "resolve"]
      - ["verify_qualification_and_regulatory_clearance", "authorize_change_control_implementation", "resolve"]
      - ["authorize_change_control_implementation", "notify_validation_and_engineering_lead", "resolve"]
      - ["verify_qualification_and_regulatory_clearance", "hold_change_control_regulatory_gap", "reject"]
      - ["hold_change_control_regulatory_gap", "alert_regulatory_affairs_officer", "resolve"]

  - key: dhg-alcoa-audit-trail-review
    name: "21 CFR Part 11 & EU-GMP Annex 11 ALCOA+ Audit Trail Review Gate"
    description: "Evaluates computerized analytical and manufacturing execution system audit trails. Verifies NTP clock sync (<= 1.0s), authenticated MFA electronic signatures, and zero unauthorized record deletion attempts."
    status: active
    accountability: system
    trigger:
      type: event
      scope:
        - items.create
        - items.update
      collections:
        - dhg_audit_trail_events
    nodes:
      - key: read_audit_trail_entry
        name: "Read Computerized System Audit Trail Event"
        type: item-read
        options:
          collection: dhg_audit_trail_events
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - system_id
              - user_id
              - action_type
              - ntp_time_delta_sec
              - signature_mfa_verified
              - audit_trail_gaps_count
              - unauthorized_deletion_attempts
        position_x: 1
        position_y: 1

      - key: verify_alcoa_data_integrity
        name: "Verify NTP Delta <= 1.0s, MFA Signature, Zero Gaps, and Zero Deletions"
        type: condition
        options:
          filter:
            _and:
              - read_audit_trail_entry:
                  ntp_time_delta_sec:
                    _lte: 1.0
              - read_audit_trail_entry:
                  signature_mfa_verified:
                    _eq: true
              - read_audit_trail_entry:
                  audit_trail_gaps_count:
                    _eq: 0
              - read_audit_trail_entry:
                  unauthorized_deletion_attempts:
                    _eq: 0
        position_x: 25
        position_y: 1

      - key: attest_alcoa_compliance
        name: "Attest ALCOA+ Data Integrity Compliance"
        type: item-update
        options:
          collection: dhg_audit_trail_events
          key: "{{$trigger.key}}"
          data:
            status: alcoa_verified
        position_x: 50
        position_y: 1

      - key: log_verified_integrity_hash
        name: "Log Compliant Cryptographic Integrity State"
        type: transform
        options:
          format: json
          expression: "Audit trail record complies with 21 CFR Part 11 and EU-GMP Annex 11 ALCOA+ principles."
        position_x: 75
        position_y: 1

      - key: flag_data_integrity_violation
        name: "Flag Critical Data Integrity Violation & Lock System Connection"
        type: item-update
        options:
          collection: dhg_audit_trail_events
          key: "{{$trigger.key}}"
          data:
            status: DATA_INTEGRITY_VIOLATION_FLAGGED
            alert_flag: ALCOA_BREACH_SUSPECTED
        position_x: 50
        position_y: 15

      - key: broadcast_data_integrity_alarm
        name: "Broadcast Critical Data Integrity Breach Alert"
        type: notification
        options:
          recipient: "{{$trigger.payload.csv_lead_id}}"
          subject: "ALCOA+ BREACH: Data Integrity Violation on System {{read_audit_trail_entry.system_id}}"
          message: "Critical data integrity anomaly: NTP clock desynchronization, unverified electronic signature, or unauthorized record deletion attempt."
        position_x: 75
        position_y: 15
    edges:
      - ["$trigger", "read_audit_trail_entry", "resolve"]
      - ["read_audit_trail_entry", "verify_alcoa_data_integrity", "resolve"]
      - ["verify_alcoa_data_integrity", "attest_alcoa_compliance", "resolve"]
      - ["attest_alcoa_compliance", "log_verified_integrity_hash", "resolve"]
      - ["verify_alcoa_data_integrity", "flag_data_integrity_violation", "reject"]
      - ["flag_data_integrity_violation", "broadcast_data_integrity_alarm", "resolve"]

  - key: dhg-annex1-grade-a-particle-excursion-gate
    name: "EU-GMP Annex 1 Grade A Non-Viable Particle & Humidity Excursion Interlock Gate"
    description: "Monitors ISO 5 / Grade A aseptic filling suite airborne 0.5µm particle counts (<= 3,520 particles/m³) and relative humidity (<= 55.0%). On excursion, halts filling line and dispatches cleanroom decontamination task."
    status: active
    accountability: system
    trigger:
      type: event
      scope:
        - items.create
        - items.update
      collections:
        - dhg_cleanroom_telemetry
    nodes:
      - key: read_particle_telemetry
        name: "Read Cleanroom Airborne Particle & Humidity Telemetry"
        type: item-read
        options:
          collection: dhg_cleanroom_telemetry
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - sensor_tag
              - cleanroom_suite
              - iso_grade
              - particle_count_05um
              - relative_humidity_pct
              - air_balance_status
        position_x: 1
        position_y: 1

      - key: verify_annex1_grade_a_envelope
        name: "Verify 0.5µm Particle Count <= 3520 and Relative Humidity <= 55.0%"
        type: condition
        options:
          filter:
            _and:
              - read_particle_telemetry:
                  particle_count_05um:
                    _lte: 3520
              - read_particle_telemetry:
                  relative_humidity_pct:
                    _lte: 55.0
        position_x: 25
        position_y: 1

      - key: confirm_grade_a_particle_compliance
        name: "Confirm ISO 5 Grade A Particle & Humidity Compliance"
        type: transform
        options:
          format: json
          expression: "Grade A cleanroom 0.5um particle count and relative humidity comply with EU-GMP Annex 1 limits."
        position_x: 50
        position_y: 1

      - key: trigger_particle_excursion_line_stop
        name: "Update Air Balance Status to PARTICLE_EXCURSION_LINE_STOP"
        type: item-update
        options:
          collection: dhg_cleanroom_telemetry
          key: "{{$trigger.key}}"
          data:
            air_balance_status: PARTICLE_EXCURSION_LINE_STOP
        position_x: 50
        position_y: 15

      - key: create_cleanroom_recovery_hse_task
        name: "Create Aseptic Line Stop & HEPA Recovery Task"
        type: item-create
        options:
          collection: hse_tasks
          data:
            title: "EU-GMP Annex 1 Grade A Particle Excursion Line Stop & VHP Decontamination ({{read_particle_telemetry.cleanroom_suite}})"
            task_title: "Execute HEPA Filter Integrity Scan & VHP Sanitization on {{read_particle_telemetry.cleanroom_suite}}"
            unit_tag: "{{read_particle_telemetry.cleanroom_suite}}"
            priority: critical
            status: assigned
            description: "Airborne 0.5um particle count ({{read_particle_telemetry.particle_count_05um}}/m3) or RH ({{read_particle_telemetry.relative_humidity_pct}}%) exceeded EU-GMP Annex 1 limits at sensor {{read_particle_telemetry.sensor_tag}}."
            assigned_to: "Cleanroom_Microbiology_HSE_Team"
            deadline_hours: 4
        position_x: 75
        position_y: 15

      - key: notify_aseptic_production_lead
        name: "Alert Aseptic Production Lead of Particle Excursion"
        type: notification
        options:
          recipient: "{{$trigger.payload.qualified_person_id}}"
          subject: "ANNEX 1 EXCURSION: Line Stop in {{read_particle_telemetry.cleanroom_suite}}"
          message: "0.5um particle count ({{read_particle_telemetry.particle_count_05um}}) or RH ({{read_particle_telemetry.relative_humidity_pct}}%) breached Grade A threshold. Filling halted and HSE recovery task created."
        position_x: 100
        position_y: 15
    edges:
      - ["$trigger", "read_particle_telemetry", "resolve"]
      - ["read_particle_telemetry", "verify_annex1_grade_a_envelope", "resolve"]
      - ["verify_annex1_grade_a_envelope", "confirm_grade_a_particle_compliance", "resolve"]
      - ["verify_annex1_grade_a_envelope", "trigger_particle_excursion_line_stop", "reject"]
      - ["trigger_particle_excursion_line_stop", "create_cleanroom_recovery_hse_task", "resolve"]
      - ["create_cleanroom_recovery_hse_task", "notify_aseptic_production_lead", "resolve"]

  - key: dhg-ebpr-qp-batch-disposition-gate
    name: "EU-GMP Annex 16 Qualified Person (QP) Final Batch Disposition Gate"
    description: "Enforces final EU-GMP Annex 16 batch certification gate verifying zero critical deviations and explicit QP release authorization; places non-compliant batches on QP quarantine hold and raises a PQS CAPA."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - dhg_batch_production_records
      filter:
        status:
          _eq: awaiting_qp_disposition
    nodes:
      - key: read_batch_disposition_dossier
        name: "Read e-BPR Batch Disposition Dossier"
        type: item-read
        options:
          collection: dhg_batch_production_records
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - batch_no
              - product_name
              - line_code
              - status
              - critical_deviation_flag
              - qp_release_authorized
        position_x: 1
        position_y: 1

      - key: verify_qp_disposition_criteria
        name: "Verify Zero Critical Deviations and Explicit QP Authorization"
        type: condition
        options:
          filter:
            _and:
              - read_batch_disposition_dossier:
                  critical_deviation_flag:
                    _eq: false
              - read_batch_disposition_dossier:
                  qp_release_authorized:
                    _eq: true
        position_x: 25
        position_y: 1

      - key: certify_qp_batch_disposition
        name: "Certify Batch in EU-GMP Annex 16 Register"
        type: item-update
        options:
          collection: dhg_batch_production_records
          key: "{{$trigger.key}}"
          data:
            status: qp_disposition_certified
        position_x: 50
        position_y: 1

      - key: hold_batch_qp_quarantine
        name: "Update Batch Status to batch_quarantined_qp_hold"
        type: item-update
        options:
          collection: dhg_batch_production_records
          key: "{{$trigger.key}}"
          data:
            status: batch_quarantined_qp_hold
            rejection_reason: "EU-GMP Annex 16 QP Disposition rejected: unresolved critical deviation or missing Qualified Person certification."
        position_x: 50
        position_y: 15

      - key: create_qp_hold_capa_action
        name: "Create Mandatory Batch Quarantine CAPA in grc_actions"
        type: item-create
        options:
          collection: grc_actions
          data:
            title: "EU-GMP Annex 16 QP Batch Quarantine CAPA: Batch {{read_batch_disposition_dossier.batch_no}}"
            source_module: ebpr_qp_disposition
            action_category: batch_quarantine_capa
            priority: critical
            status: open
            description: "Batch {{read_batch_disposition_dossier.batch_no}} ({{read_batch_disposition_dossier.product_name}}) placed on batch_quarantined_qp_hold pending deviation closure and QP review."
            assigned_to: "QA_Qualified_Person_Board"
        position_x: 75
        position_y: 15

      - key: notify_qp_disposition_hold
        name: "Notify Qualified Person & Warehouse of Quarantine Hold"
        type: notification
        options:
          recipient: "{{$trigger.payload.qualified_person_id}}"
          subject: "QP HOLD: Batch {{read_batch_disposition_dossier.batch_no}} Quarantined"
          message: "Batch {{read_batch_disposition_dossier.batch_no}} locked under batch_quarantined_qp_hold and CAPA generated."
        position_x: 100
        position_y: 15
    edges:
      - ["$trigger", "read_batch_disposition_dossier", "resolve"]
      - ["read_batch_disposition_dossier", "verify_qp_disposition_criteria", "resolve"]
      - ["verify_qp_disposition_criteria", "certify_qp_batch_disposition", "resolve"]
      - ["verify_qp_disposition_criteria", "hold_batch_qp_quarantine", "reject"]
      - ["hold_batch_qp_quarantine", "create_qp_hold_capa_action", "resolve"]
      - ["create_qp_hold_capa_action", "notify_qp_disposition_hold", "resolve"]

  - key: dhg-cold-chain-mkt-excursion-stability-gate
    name: "Cold-Chain Mean Kinetic Temperature (MKT) Excursion & ICH Q1A Stability Gate"
    description: "Monitors cold-chain storage telemetry verifying excursion duration <= 15 minutes and chamber temperature <= 8.0°C. On excursion, locks inventory under MKT_STABILITY_HOLD and dispatches stability evaluation task."
    status: active
    accountability: system
    trigger:
      type: event
      scope:
        - items.create
        - items.update
      collections:
        - dhg_cold_chain_telemetry
    nodes:
      - key: read_cold_chain_telemetry
        name: "Read Cold-Chain Chamber Temperature & Excursion Telemetry"
        type: item-read
        options:
          collection: dhg_cold_chain_telemetry
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - storage_unit_id
              - chamber_type
              - temperature_c
              - excursion_duration_minutes
              - quarantine_status
        position_x: 1
        position_y: 1

      - key: verify_cold_chain_thermal_limits
        name: "Verify Excursion Duration <= 15 min and Temperature <= 8.0°C"
        type: condition
        options:
          filter:
            _and:
              - read_cold_chain_telemetry:
                  excursion_duration_minutes:
                    _lte: 15
              - read_cold_chain_telemetry:
                  temperature_c:
                    _lte: 8.0
        position_x: 25
        position_y: 1

      - key: confirm_cold_chain_nominal
        name: "Confirm Cold-Chain Thermal Envelope Compliant"
        type: transform
        options:
          format: json
          expression: "Cold-chain storage chamber within 2C-8C thermal envelope and <= 15 min excursion tolerance."
        position_x: 50
        position_y: 1

      - key: place_mkt_stability_hold
        name: "Update Quarantine Status to MKT_STABILITY_HOLD"
        type: item-update
        options:
          collection: dhg_cold_chain_telemetry
          key: "{{$trigger.key}}"
          data:
            quarantine_status: MKT_STABILITY_HOLD
        position_x: 50
        position_y: 15

      - key: create_mkt_stability_assessment_task
        name: "Create ICH Q1A MKT Stability Assessment Task in hse_tasks"
        type: item-create
        options:
          collection: hse_tasks
          data:
            title: "Cold-Chain MKT Stability Assessment for Chamber {{read_cold_chain_telemetry.storage_unit_id}}"
            task_title: "Calculate Mean Kinetic Temperature (MKT) & Inspect Quarantine Lots in {{read_cold_chain_telemetry.storage_unit_id}}"
            unit_tag: "{{read_cold_chain_telemetry.storage_unit_id}}"
            priority: high
            status: assigned
            description: "Thermal excursion detected ({{read_cold_chain_telemetry.temperature_c}}C for {{read_cold_chain_telemetry.excursion_duration_minutes}} min). Inventory placed on MKT_STABILITY_HOLD."
            assigned_to: "Cold_Chain_QA_Stability_Team"
            deadline_hours: 8
        position_x: 75
        position_y: 15

      - key: notify_cold_chain_custodian
        name: "Alert Cold-Chain Warehouse & QA Stability Officer"
        type: notification
        options:
          recipient: "{{$trigger.payload.qa_stability_officer_id}}"
          subject: "COLD-CHAIN HOLD: MKT Excursion on {{read_cold_chain_telemetry.storage_unit_id}}"
          message: "Chamber {{read_cold_chain_telemetry.storage_unit_id}} reached {{read_cold_chain_telemetry.temperature_c}}C for {{read_cold_chain_telemetry.excursion_duration_minutes}} minutes. Status set to MKT_STABILITY_HOLD."
        position_x: 100
        position_y: 15
    edges:
      - ["$trigger", "read_cold_chain_telemetry", "resolve"]
      - ["read_cold_chain_telemetry", "verify_cold_chain_thermal_limits", "resolve"]
      - ["verify_cold_chain_thermal_limits", "confirm_cold_chain_nominal", "resolve"]
      - ["verify_cold_chain_thermal_limits", "place_mkt_stability_hold", "reject"]
      - ["place_mkt_stability_hold", "create_mkt_stability_assessment_task", "resolve"]
      - ["create_mkt_stability_assessment_task", "notify_cold_chain_custodian", "resolve"]

  - key: dhg-rft-yield-environmental-trend-flow
    name: "ICH Q10 Pharmaceutical Quality System (PQS) RFT Yield & Environmental Trend Flow"
    description: "Evaluates daily plant KPIs verifying Right-First-Time (RFT) yield >= 98.5% and zero environmental excursions; triggers an ICH Q10 PQS management review CAPA action when thresholds are breached."
    status: active
    accountability: system
    trigger:
      type: event
      scope:
        - items.create
        - items.update
      collections:
        - dhg_plant_kpis
    nodes:
      - key: read_plant_kpi_snapshot
        name: "Read Plant RFT Yield & Environmental Excursion KPIs"
        type: item-read
        options:
          collection: dhg_plant_kpis
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - recorded_date
              - finished_dosage_units
              - right_first_time_yield_pct
              - environmental_excursions_count
              - ebpr_cycle_time_hours
        position_x: 1
        position_y: 1

      - key: verify_rft_and_zero_excursions
        name: "Verify RFT Yield >= 98.5% and Environmental Excursions == 0"
        type: condition
        options:
          filter:
            _and:
              - read_plant_kpi_snapshot:
                  right_first_time_yield_pct:
                    _gte: 98.5
              - read_plant_kpi_snapshot:
                  environmental_excursions_count:
                    _eq: 0
        position_x: 25
        position_y: 1

      - key: log_ich_q10_pqs_nominal
        name: "Record Compliant ICH Q10 PQS Performance"
        type: transform
        options:
          format: json
          expression: "Plant RFT yield and environmental excursion metrics meet ICH Q10 Pharmaceutical Quality System targets."
        position_x: 50
        position_y: 1

      - key: create_ich_q10_management_review_action
        name: "Create ICH Q10 PQS Management Review Action in grc_actions"
        type: item-create
        options:
          collection: grc_actions
          data:
            title: "ICH Q10 PQS Management Review & Yield Drift CAPA ({{read_plant_kpi_snapshot.recorded_date}})"
            source_module: ich_q10_pqs_kpi
            action_category: management_review_capa
            priority: high
            status: open
            description: "RFT Yield ({{read_plant_kpi_snapshot.right_first_time_yield_pct}}%) or environmental excursions ({{read_plant_kpi_snapshot.environmental_excursions_count}}) breached ICH Q10 target thresholds."
            assigned_to: "Site_Quality_Director"
        position_x: 50
        position_y: 15

      - key: notify_site_quality_director
        name: "Notify Site Quality Director of PQS Trend Excursion"
        type: notification
        options:
          recipient: "{{$trigger.payload.quality_director_id}}"
          subject: "ICH Q10 PQS REVIEW: RFT Yield / Environmental Trend Alert ({{read_plant_kpi_snapshot.recorded_date}})"
          message: "Plant RFT yield={{read_plant_kpi_snapshot.right_first_time_yield_pct}}%, environmental excursions={{read_plant_kpi_snapshot.environmental_excursions_count}}. Management review CAPA created."
        position_x: 75
        position_y: 15
    edges:
      - ["$trigger", "read_plant_kpi_snapshot", "resolve"]
      - ["read_plant_kpi_snapshot", "verify_rft_and_zero_excursions", "resolve"]
      - ["verify_rft_and_zero_excursions", "log_ich_q10_pqs_nominal", "resolve"]
      - ["verify_rft_and_zero_excursions", "create_ich_q10_management_review_action", "reject"]
      - ["create_ich_q10_management_review_action", "notify_site_quality_director", "resolve"]

rules:
  - rule_id: DHG-GMP-DP-001
    name: "Cleanroom Suite Differential Pressure Cascade Minimum"
    description: "Positive pressure difference between classified areas must be at least 10-15 Pa per EU-GMP Annex 1 to prevent ingress of non-viable particulates."
    severity: critical
    condition: "differential_pressure_pa >= 10.0"
    enforcement: strict_rejection
    action: "Automatically interlock airlocks, halt aseptic vial filling, and notify QA compliance officer."

  - rule_id: DHG-COLDCHAIN-TEMP-002
    name: "Cold-Chain Biologic Storage Temperature Limits"
    description: "Finished biologics and temperature-sensitive APIs must maintain storage temperature strictly between 2.0°C and 8.0°C."
    severity: high
    condition: "temperature_c >= 2.0 && temperature_c <= 8.0"
    enforcement: escalation
    action: "Trigger backup refrigeration chiller, quarantine affected inventory lots, and log temperature excursion."

  - rule_id: DHG-PARTICLE-003
    name: "EU-GMP Annex 1 Grade A Non-Viable Particle & Humidity Envelope"
    description: "Grade A / ISO 5 aseptic filling zone must maintain 0.5µm airborne particulates <= 3,520 particles/m³ and relative humidity <= 55.0%."
    severity: critical
    condition: "particle_count_05um <= 3520 && relative_humidity_pct <= 55.0"
    enforcement: strict_rejection
    action: "Trigger PARTICLE_EXCURSION_LINE_STOP, halt aseptic filling, and dispatch cleanroom HEPA/VHP recovery task."

  - rule_id: DHG-OOS-004
    name: "Out-of-Specification (OOS) Raw Chromatography Audit Lock & Retest Gate"
    description: "Phase I OOS laboratory investigations must lock raw chromatography data prior to any retest hypothesis and escalate to Phase II manufacturing investigation unless documented instrument error is confirmed."
    severity: critical
    condition: "raw_chromatography_locked == true && lab_retest_valid == true"
    enforcement: strict_rejection
    action: "Block unauthorized retesting into compliance, place batch on QA hold, and escalate to Phase II cross-functional investigation."

  - rule_id: DHG-ALCOA-005
    name: "21 CFR Part 11 & EU-GMP Annex 11 ALCOA+ Data Integrity Invariant"
    description: "Computerized manufacturing and QC systems must maintain NTP time synchronization within 1.0 second, verified MFA electronic signatures, zero audit trail gaps, and zero record deletion attempts."
    severity: critical
    condition: "ntp_time_delta_sec <= 1.0 && signature_mfa_verified == true && audit_trail_gaps_count == 0 && unauthorized_deletion_attempts == 0"
    enforcement: strict_rejection
    action: "Flag DATA_INTEGRITY_VIOLATION_FLAGGED, lock computerized batch release interface, and alert CSV & QA compliance leads."

  - rule_id: DHG-CC-006
    name: "EU-GMP Annex 15 Change Control IQ/OQ/PQ & DAV Regulatory Variation Gate"
    description: "Major/critical GMP change controls cannot be implemented without approved quality risk assessment, completed IQ/OQ/PQ validation protocols, DAV regulatory variation clearance, and QA Head sign-off."
    severity: high
    condition: "risk_assessment_approved == true && validation_protocol_complete == true && dav_variation_approved_or_exempt == true && qa_head_approved == true"
    enforcement: approval_gate
    action: "Hold change control under change_control_held_regulatory_gap and notify Regulatory Affairs & Validation Head."

