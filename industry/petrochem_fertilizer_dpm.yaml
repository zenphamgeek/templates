              status: healthy
            - name: "Emergency Depressurization to Flare Header"
              type: automated
              sil_rating: "SIL-3"
              status: healthy
            - name: "Unit Blast Wall & Shelter-in-Place"
              type: passive
              status: healthy
            - name: "Phu My Plant Emergency Response Plan"
