          sortDirection: desc
          displayTemplate: "PTW #{{permit_no}}: {{title}} ({{permit_type}}) — Gas Clearance: {{gas_clearance}}"
          limit: 6
        position_x: 1
        position_y: 29
        width: 72
        height: 16
        icon: "shield"

      - name: "Ammonia Synloop 103-J Loss of Containment Bow-Tie"
        type: grc-bowtie
        collection: hse_incidents
        options:
          scenario_id: "LOPC-103J-AMMONIA"
          top_event: "Loss of Primary Containment (103-J Syngas Release)"
          unit: "103-J Syngas Compressor Train"
          threats:
