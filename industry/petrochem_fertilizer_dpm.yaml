template_id: petrochem_fertilizer_dpm
version: 1.0.0
industry_vertical: petrochem_fertilizer
archetype: "Phu My Fertilizer Plant (DPM) Archetype"

metadata:
  name: "Phu My Fertilizer & Petrochem Resilience Template"
  description: "Comprehensive operational resilience, process safety, and plant management template for ammonia/urea production complexes based on the Phu My Fertilizer Plant archetype."
  status: VERIFIED
  author: "Industry Template Architect & Engine Specialist"
  approver: "Zen Phạm"
  created_at: "2026-10-04"
  tags:
    - petrochem
    - fertilizer
    - ammonia
    - urea
    - process_safety
    - ptw
    - moc
    - syngas
  regulatory_frameworks:
    - "OSHA 1910.119 Process Safety Management"
    - "TCVN 5334:2007 Safety in Petrochemical Production"
    - "CCPS Guidelines for Process Safety"
    - "TCVN 3288:1979 Ventilation and Air Purity in Chemical Facilities"

taxonomy_and_fields:
  collections:
    - collection: legal_documents
      name: "Sổ đăng ký Văn bản Pháp luật (Legal Documents Register)"
      description: "Quản lý danh mục văn bản quy phạm pháp luật, quy chuẩn, tiêu chuẩn kỹ thuật an toàn ngành hóa chất - dầu khí."
      fields:
        - field: id
          type: uuid
        - field: doc_number
          type: string
        - field: title
          type: string
        - field: document_type
          type: string
        - field: issuing_authority
          type: string
        - field: sign_date
          type: date
        - field: effective_date
          type: date
        - field: expiration_date
          type: date
        - field: status
          type: string
        - field: field_of_law
          type: string
        - field: summary
          type: text
        - field: attachment
          type: uuid

    - collection: legal_clauses
      name: "Điều khoản Văn bản Pháp luật (Legal Clauses)"
      description: "Chi tiết các điều, khoản, điểm quy định nghĩa vụ tuân thủ cụ thể áp dụng đối với nhà máy."
      fields:
        - field: id
          type: uuid
        - field: document_id
          type: uuid
        - field: clause_number
          type: string
        - field: title
          type: string
        - field: content
          type: text
        - field: applicability_status
          type: string

    - collection: legal_clause_impacts
      name: "Phân tích Đánh giá Ảnh hưởng Điều khoản (Clause Impact Assessments)"
      description: "Phân tích tác động chi tiết của từng điều khoản đến các xưởng công nghệ (Amoniac, Ure, Phụ trợ) và phòng ban liên quan."
      fields:
        - field: id
          type: uuid
        - field: clause_id
          type: uuid
        - field: plant_unit
          type: string
        - field: impact_level
          type: string
        - field: impact_analysis
          type: text
        - field: required_changes
          type: text
        - field: assessed_by
          type: uuid
        - field: assessed_at
          type: timestamp
        - field: review_status
          type: string

    - collection: legal_compliance_evaluations
      name: "Đánh giá Tuân thủ Pháp luật Định kỳ (Compliance Evaluations)"
      description: "Đánh giá mức độ tuân thủ thực tế, thu thập bằng chứng kiểm tra và kích hoạt hành động khắc phục CAPA khi phát hiện vi phạm."
      fields:
        - field: id
          type: uuid
        - field: clause_impact_id
          type: uuid
        - field: evaluation_date
          type: date
        - field: compliance_status
          type: string
        - field: audit_evidence
          type: text
        - field: findings_gap
          type: text
        - field: action_plan_required
          type: boolean
        - field: evaluator
          type: uuid

    - collection: grc_actions
      name: "Hành động Khắc phục & Phòng ngừa (CAPA Register)"
      description: "Sổ theo dõi hành động khắc phục đa nguồn (Sự cố, Đánh giá Pháp lý, Thanh kiểm tra, Mối nguy, Vi phạm PTW) và quy trình kiểm chứng độc lập."
      fields:
        - field: id
          type: uuid
        - field: identifier
          type: string
        - field: title
          type: string
        - field: description
          type: text
        - field: source_type
          type: string
        - field: source_reference_id
          type: string
        - field: source_title
          type: string
        - field: plant_unit
          type: string
        - field: priority
          type: string
        - field: status
          type: string
        - field: root_cause_analysis
          type: text
        - field: corrective_measure
          type: text
        - field: preventive_measure
          type: text
        - field: owner
          type: uuid
        - field: assignee
          type: uuid
        - field: verifier
          type: uuid
        - field: verification_evidence
          type: text
        - field: verification_status
          type: string
        - field: due_date
          type: date
        - field: completed_at
          type: timestamp
        - field: closed_at
          type: timestamp

    - collection: hse_tasks
      name: "Công việc An toàn Độc lập (HSE Standalone Tasks)"
      description: "Quản lý công việc phân công độc lập không bắt buộc gắn với dự án, hỗ trợ quy trình giao việc, đính kèm bằng chứng và hoàn thành."
      fields:
        - field: id
          type: uuid
        - field: title
          type: string
        - field: task_type
          type: string
        - field: plant_unit
          type: string
        - field: status
          type: string
        - field: priority
          type: string
        - field: description
          type: text
        - field: assignee
          type: uuid
        - field: supervisor
          type: uuid
        - field: due_date
          type: date
        - field: completed_at
          type: timestamp

    - collection: hse_jsas
      name: "Phân tích An toàn Công việc (Job Safety Analysis - JSA)"
      description: "Khởi tạo JSA độc lập không bắt buộc gắn với Work Request, tích hợp phân tách bước công việc, ma trận rủi ro 5x5 và cấp duyệt an toàn."
      fields:
        - field: id
          type: uuid
        - field: jsa_number
          type: string
        - field: title
          type: string
        - field: permit_request
          type: uuid
        - field: work_order_ref
          type: string
        - field: plant_unit
          type: string
        - field: work_location
          type: string
        - field: work_description
          type: text
        - field: status
          type: string
        - field: lead_assessor
          type: uuid
        - field: safety_reviewer
          type: uuid
        - field: overall_residual_risk_level
          type: string
        - field: expires_at
          type: timestamp

    - collection: hse_jsa_steps
      name: "Chi tiết Bước Công việc & Rủi ro (JSA Job Steps & 5x5 Risk Matrix)"
      description: "Phân rã từng bước thao tác, nhận diện mối nguy, tính điểm rủi ro ban đầu (L x S), biện pháp kiểm soát và rủi ro còn lại (ALARP <= 6)."
      fields:
        - field: id
          type: uuid
        - field: jsa_id
          type: uuid
        - field: step_number
          type: integer
        - field: step_description
          type: string
        - field: hazard_identification
          type: text
        - field: initial_likelihood
          type: integer
        - field: initial_severity
          type: integer
        - field: initial_risk_score
          type: integer
        - field: control_measures
          type: text
        - field: residual_likelihood
          type: integer
        - field: residual_severity
          type: integer
        - field: residual_risk_score
          type: integer
        - field: residual_risk_level
          type: string
        - field: alarp_demonstrated
          type: boolean

    - collection: hse_jsa_ppe
      name: "Trang bị Bảo hộ Lao động Bắt buộc (Mandatory PPE Checklist)"
      description: "Danh mục phương tiện bảo vệ cá nhân chuyên dụng (bình dưỡng khí SCBA, phin lọc khí NH3 K2, quần áo chống hóa chất)."
      fields:
        - field: id
          type: uuid
        - field: jsa_id
          type: uuid
        - field: ppe_type
          type: string
        - field: required
          type: boolean
        - field: specification
          type: string

    - collection: hse_permit_requests
      name: "Phiếu Đăng ký Làm việc (Work Permit Requests - WPR)"
      description: "Đăng ký kế hoạch công việc kèm quy trình kiểm tra hiện trường và ký duyệt đa tầng (Người yêu cầu -> Trưởng ca/Khu vực -> Cán bộ HSE -> Cấp phép)."
      fields:
        - field: id
          type: uuid
        - field: request_no
          type: string
        - field: title
          type: string
        - field: permit_type
          type: string
        - field: plant_unit
          type: string
        - field: work_area
          type: string
        - field: requester
          type: uuid
        - field: status
          type: string
        - field: applicant_signature
          type: string
        - field: area_custodian
          type: uuid
        - field: area_custodian_status
          type: string
        - field: area_inspection_notes
          type: text
        - field: safety_officer
          type: uuid
        - field: safety_officer_status
          type: string
        - field: issuing_authority
          type: uuid
        - field: issuing_decision
          type: string

    - collection: hse_permits
      name: "Giấy phép Làm việc Điện tử (e-PTW Register)"
      description: "Quản lý 8 loại hình giấy phép làm việc đặc thù nhà máy hóa chất (Lửa loại 1/2, Không gian hạn chế, LOTO, Làm việc trên cao, Đào đất, Phóng xạ, Nâng hạ)."
      fields:
        - field: id
          type: uuid
        - field: permit_no
          type: string
        - field: permit_type
          type: string
        - field: title
          type: string
        - field: status
          type: string
        - field: plant_unit
          type: string
        - field: specific_equipment_tag
          type: string
        - field: gas_test_required
          type: boolean
        - field: loto_required
          type: boolean
        - field: jsa_id
          type: uuid
        - field: permit_request
          type: uuid
        - field: gas_clearance
          type: string
        - field: work_authorized
          type: boolean
        - field: rejection_reason
          type: text

    - collection: hse_permit_attachments
      name: "Hồ sơ Đính kèm Giấy phép (PTW Required Dossiers)"
      description: "Quản lý danh mục hồ sơ tài liệu bắt buộc kèm theo giấy phép (Bản vẽ LOTO, Chứng chỉ thợ hàn, Biện pháp thi công, Kế hoạch ứng cứu)."
      fields:
        - field: id
          type: uuid
        - field: permit_id
          type: uuid
        - field: attachment_type
          type: string
        - field: file_ref
          type: string
        - field: verified_by
          type: uuid
        - field: verification_status
          type: string

    - collection: hse_gas_tests
      name: "Nhật ký Đo Khí Môi trường (Multi-Gas Atmospheric Tests)"
      description: "Kiểm tra nồng độ khí cháy CH4, Oxy O2, độc tính Amoniac NH3, H2S và CO với ngưỡng khóa liên động tự động trước khi cấp phép."
      fields:
        - field: id
          type: uuid
        - field: permit_id
          type: uuid
        - field: gas_ch4_lel_percent
          type: float
        - field: gas_o2_percent
          type: float
        - field: gas_nh3_ppm
          type: float
        - field: gas_h2s_ppm
          type: float
        - field: gas_co_ppm
          type: float
        - field: tester_id
          type: uuid
        - field: test_timestamp
          type: timestamp
        - field: atmospheric_status
          type: string

    - collection: hse_moc_changes
      name: "Quản lý Thay đổi (Management of Change - MOC)"
      description: "Technical, organizational, and operational change management."
      fields:
        - field: id
          type: uuid
        - field: moc_no
          type: string
        - field: title
          type: string
        - field: status
          type: string
        - field: change_category
          type: string
        - field: process_safety_status
          type: string
        - field: operations_status
          type: string
        - field: plant_manager_status
          type: string
        - field: ready_for_implementation
          type: boolean

    - collection: dpm_compressor_telemetry
      name: "103-J Syngas Compressor Telemetry"
      description: "Real-time mechanical and process telemetry of the multi-stage 103-J synthesis gas compressor."
      fields:
        - field: id
          type: uuid
        - field: tag_id
          type: string
        - field: stage_no
          type: integer
        - field: vibration_mm_s
          type: float
        - field: suction_pressure_bar
          type: float
        - field: discharge_pressure_bar
          type: float
        - field: bearing_temp_c
          type: float
        - field: timestamp
          type: timestamp

    - collection: dpm_plant_kpis
      name: "Phu My Plant Performance KPIs"
      description: "Aggregated plant KPIs for ammonia, urea, and utility trains."
      fields:
        - field: id
          type: uuid
        - field: recorded_date
          type: date
        - field: oee_rate
          type: float
        - field: ammonia_production_mt
          type: float
        - field: urea_production_mt
          type: float
        - field: energy_consumption_gj_mt
          type: float

    - collection: hse_incidents
      name: "Safety Incidents & Metrics"
      description: "HSE incident logging and rolling frequency rates."
      fields:
        - field: id
          type: uuid
        - field: trir_value
          type: float
        - field: ltir_value
          type: float
        - field: safe_manhours
          type: integer

  relations:
    - collection: legal_clauses
      field: document_id
      related_collection: legal_documents
      type: m2o
    - collection: legal_clause_impacts
      field: clause_id
      related_collection: legal_clauses
      type: m2o
    - collection: legal_compliance_evaluations
      field: clause_impact_id
      related_collection: legal_clause_impacts
      type: m2o
    - collection: hse_jsa_steps
      field: jsa_id
      related_collection: hse_jsas
      type: m2o
    - collection: hse_jsa_ppe
      field: jsa_id
      related_collection: hse_jsas
      type: m2o
    - collection: hse_permits
      field: permit_request
      related_collection: hse_permit_requests
      type: m2o
    - collection: hse_permits
      field: jsa_id
      related_collection: hse_jsas
      type: m2o
    - collection: hse_permit_attachments
      field: permit_id
      related_collection: hse_permits
      type: m2o
    - collection: hse_gas_tests
      field: permit_id
      related_collection: hse_permits
      type: m2o

  equipment_taxonomy:
    plant_code: DPM_PHUMY
    areas:
      - code: "100"
        name: "Ammonia Synthesis Area"
        systems:
          - code: "101"
            name: "Primary Steam Reformer (101-B)"
          - code: "103"
            name: "Syngas Compressor Train (103-J / 103-JT)"
          - code: "105"
            name: "Ammonia Synthesis Converter Loop (105-D)"
      - code: "200"
        name: "Urea Granulation Area"
      - code: "300"
        name: "Utilities & Power Cogeneration"

business_flows:
  - key: dpm-ptw-hot-work-gas-check
    name: "e-PTW Hot Work with Strict Gas Testing Check"
    description: "Evaluates atmospheric gas testing for Hot Work PTWs against stringent petrochemical safety limits: CH4 < 10% LEL, O2 between 19.5% and 23.5%, and H2S < 10 ppm. Automatically authorizes work or auto-rejects and issues safety notifications."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - hse_permits
      filter:
        status:
          _eq: gas_test_submitted
        permit_type:
          _eq: hot_work
    nodes:
      - key: read_gas_test
        name: "Read Latest Atmospheric Gas Test"
        type: item-read
        options:
          collection: hse_gas_tests
          query:
            filter:
              permit_id:
                _eq: "{{$trigger.key}}"
            sort:
              - "-test_timestamp"
            limit: 1
            fields:
              - id
              - permit_id
              - gas_ch4_lel_percent
              - gas_o2_percent
              - gas_h2s_ppm
              - gas_co_ppm
        position_x: 1
        position_y: 1

      - key: evaluate_gas_limits
        name: "Evaluate Strict Atmospheric Thresholds"
        type: condition
        options:
          filter:
            _and:
              - read_gas_test:
                  gas_ch4_lel_percent:
                    _lt: 10.0
              - read_gas_test:
                  gas_o2_percent:
                    _gte: 19.5
              - read_gas_test:
                  gas_o2_percent:
                    _lte: 23.5
              - read_gas_test:
                  gas_h2s_ppm:
                    _lt: 10.0
        position_x: 20
        position_y: 1

      - key: approve_ptw
        name: "Approve Hot Work PTW"
        type: item-update
        options:
          collection: hse_permits
          key: "{{$trigger.key}}"
          data:
            status: approved
            gas_clearance: passed
            work_authorized: true
        position_x: 40
        position_y: 1

      - key: notify_approval
        name: "Notify Field Supervisor of Safe Gas Clearance"
        type: notification
        options:
          recipient: "{{$trigger.payload.supervisor_id}}"
          subject: "PTW Approved: Atmosphere Safe for Hot Work (Permit #{{$trigger.key}})"
          message: "Gas testing confirmed CH4 < 10% LEL, O2 19.5-23.5%, and H2S < 10 ppm. Hot work authorized."
        position_x: 60
        position_y: 1

      - key: reject_ptw
        name: "Auto-Reject PTW Due to Hazardous Atmosphere"
        type: item-update
        options:
          collection: hse_permits
          key: "{{$trigger.key}}"
          data:
            status: auto_rejected
            gas_clearance: failed_hazardous_atmosphere
            work_authorized: false
            rejection_reason: "Violated strict atmospheric limits: CH4 must be <10% LEL, O2 19.5-23.5%, H2S <10 ppm."
        position_x: 40
        position_y: 15

      - key: notify_rejection
        name: "Alert Safety Officer of PTW Auto-Rejection"
        type: notification
        options:
          recipient: "{{$trigger.payload.hse_officer_id}}"
          subject: "CRITICAL: PTW Auto-Rejected for Hazardous Atmosphere (Permit #{{$trigger.key}})"
          message: "Hot Work PTW auto-rejected. Flammable or toxic gas limits breached. Immediate area ventilation required."
        position_x: 60
        position_y: 15

    edges:
      - ["$trigger", "read_gas_test", "resolve"]
      - ["read_gas_test", "evaluate_gas_limits", "resolve"]
      - ["evaluate_gas_limits", "approve_ptw", "resolve"]
      - ["approve_ptw", "notify_approval", "resolve"]
      - ["evaluate_gas_limits", "reject_ptw", "reject"]
      - ["reject_ptw", "notify_rejection", "resolve"]

  - key: dpm-moc-3stage-review
    name: "MOC 3-Stage Multi-discipline Review"
    description: "Sequential 3-Stage Multi-discipline Review (Process Safety -> Operations -> Plant Manager) enforcing strict Stage-Gate signoffs before plant modifications can proceed."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - hse_moc_changes
      filter:
        status:
          _eq: in_review
    nodes:
      - key: read_moc
        name: "Read MOC Technical Review State"
        type: item-read
        options:
          collection: hse_moc_changes
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - moc_no
              - process_safety_status
              - operations_status
              - plant_manager_status
        position_x: 1
        position_y: 1

      - key: check_process_safety
        name: "Gate 1: Check Process Safety Approval"
        type: condition
        options:
          filter:
            read_moc:
              process_safety_status:
                _eq: approved
        position_x: 15
        position_y: 1

      - key: advance_to_operations
        name: "Advance MOC to Operations Review"
        type: item-update
        options:
          collection: hse_moc_changes
          key: "{{$trigger.key}}"
          data:
            status: operations_review_pending
        position_x: 30
        position_y: 1

      - key: notify_operations_reviewer
        name: "Notify Operations Manager"
        type: notification
        options:
          recipient: "{{$trigger.payload.operations_manager_id}}"
          subject: "MOC Stage 2 Action Required: Operations Review for MOC #{{read_moc.moc_no}}"
          message: "Process Safety has approved MOC #{{read_moc.moc_no}}. Please perform operational feasibility review."
        position_x: 45
        position_y: 1

      - key: check_operations
        name: "Gate 2: Check Operations Approval"
        type: condition
        options:
          filter:
            read_moc:
              operations_status:
                _eq: approved
        position_x: 30
        position_y: 12

      - key: advance_to_plant_manager
        name: "Advance MOC to Plant Manager Sign-off"
        type: item-update
        options:
          collection: hse_moc_changes
          key: "{{$trigger.key}}"
          data:
            status: plant_manager_review_pending
        position_x: 45
        position_y: 12

      - key: notify_plant_manager
        name: "Notify Plant Director Zen Pham"
        type: notification
        options:
          recipient: "{{$trigger.payload.plant_manager_id}}"
          subject: "MOC Stage 3 Final Sign-off: MOC #{{read_moc.moc_no}}"
          message: "Process Safety and Operations have approved MOC #{{read_moc.moc_no}}. Plant Manager final authorization required."
        position_x: 60
        position_y: 12

      - key: check_plant_manager
        name: "Gate 3: Check Plant Manager Final Approval"
        type: condition
        options:
          filter:
            read_moc:
              plant_manager_status:
                _eq: approved
        position_x: 30
        position_y: 24

      - key: finalize_moc_approval
        name: "Finalize MOC Authorization"
        type: item-update
        options:
          collection: hse_moc_changes
          key: "{{$trigger.key}}"
          data:
            status: approved
            ready_for_implementation: true
        position_x: 45
        position_y: 24

      - key: notify_moc_authorized
        name: "Broadcast MOC Final Authorization"
        type: notification
        options:
          recipient: "{{$trigger.payload.requester_id}}"
          subject: "MOC Approved: Full Authorization Granted for MOC #{{read_moc.moc_no}}"
          message: "MOC has passed Process Safety, Operations, and Plant Manager approvals. Ready for implementation."
        position_x: 60
        position_y: 24

      - key: reject_moc
        name: "Reject MOC at Gate"
        type: item-update
        options:
          collection: hse_moc_changes
          key: "{{$trigger.key}}"
          data:
            status: rejected
            ready_for_implementation: false
        position_x: 45
        position_y: 36

      - key: notify_moc_rejection
        name: "Notify MOC Requester of Rejection"
        type: notification
        options:
          recipient: "{{$trigger.payload.requester_id}}"
          subject: "MOC Gate Rejection: MOC #{{read_moc.moc_no}}"
          message: "MOC #{{read_moc.moc_no}} did not satisfy stage-gate criteria and has been marked as rejected."
        position_x: 60
