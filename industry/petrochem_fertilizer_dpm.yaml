  - name: "Ammonia Synthesis Unit (103-J Syngas Compressor) Live KPI Dashboard"
    icon: "precision_manufacturing"
    color: "#1B5E20"
    note: "Real-time process safety, equipment health, and risk barrier surveillance for Phu My Ammonia Synthesis Unit 100-Area."
    panels:
      - name: "Ammonia Synloop OEE (%)"
        type: metric
        collection: dpm_plant_kpis
        options:
          field: oee_rate
          function: avg
          decimals: 1
          suffix: "%"
        position_x: 1
        position_y: 1
        width: 18
        height: 12
        icon: "trending_up"
        color: "#2E7D32"

      - name: "Plant 12-Month Rolling TRIR"
