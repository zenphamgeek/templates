  - key: dpm-legal-compliance-to-capa
    name: "Tự động Khởi tạo CAPA khi Đánh giá Không Tuân thủ Pháp lý"
    description: "Khi đánh giá tuân thủ điều khoản pháp lý phát hiện không tuân thủ hoặc tuân thủ một phần và yêu cầu biện pháp khắc phục, tự động khởi tạo hành động khắc phục CAPA và thông báo tới Trưởng đơn vị phụ trách."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.create
        - items.update
      collections:
        - legal_compliance_evaluations
      filter:
        action_plan_required:
          _eq: true
    nodes:
      - key: read_compliance_eval
        name: "Đọc Kết quả Đánh giá Tuân thủ"
        type: item-read
        options:
          collection: legal_compliance_evaluations
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - clause_impact_id
              - compliance_status
              - findings_gap
              - action_plan_required
              - evaluator
        position_x: 1
        position_y: 1

      - key: check_non_compliance_gate
        name: "Kiểm tra Mức độ Không Tuân thủ"
        type: condition
        options:
          filter:
            read_compliance_eval:
              compliance_status:
                _in:
                  - non_compliant
                  - partial_compliant
        position_x: 20
        position_y: 1

      - key: create_capa_from_compliance
        name: "Khởi tạo Hành động Khắc phục CAPA"
        type: item-create
        options:
          collection: grc_actions
          data:
            title: "CAPA Tuân thủ Pháp lý: Khắc phục điểm không phù hợp"
            description: "{{read_compliance_eval.findings_gap}}"
            source_type: "LEGAL_COMPLIANCE"
            source_reference_id: "{{read_compliance_eval.id}}"
            priority: "HIGH"
            status: "open"
            verification_status: "PENDING"
        position_x: 40
        position_y: 1

      - key: notify_unit_capa_lead
        name: "Thông báo Khởi tạo CAPA Pháp lý"
        type: notification
        options:
          recipient: "{{read_compliance_eval.evaluator}}"
          subject: "Hệ thống tự động khởi tạo CAPA Tuân thủ Pháp lý (Mã đánh giá #{{read_compliance_eval.id}})"
          message: "Phát hiện điểm không phù hợp pháp lý: {{read_compliance_eval.findings_gap}}. Đã tự động tạo hành động khắc phục CAPA."
        position_x: 60
        position_y: 1

      - key: log_compliant_evaluation
        name: "Ghi nhận Đánh giá Hợp lệ"
        type: transform
        options:
          note: "Kết quả đánh giá đạt chuẩn hoặc không yêu cầu lập hành động khắc phục."
        position_x: 40
        position_y: 14

    edges:
      - ["$trigger", "read_compliance_eval", "resolve"]
      - ["read_compliance_eval", "check_non_compliance_gate", "resolve"]
      - ["check_non_compliance_gate", "create_capa_from_compliance", "resolve"]
      - ["create_capa_from_compliance", "notify_unit_capa_lead", "resolve"]
      - ["check_non_compliance_gate", "log_compliant_evaluation", "reject"]

  - key: dpm-jsa-approval-flow
    name: "Quy trình Thẩm duyệt Phân tích An toàn Công việc (JSA ALARP Gate)"
    description: "Kiểm tra mức độ rủi ro còn lại của tất cả các bước công việc theo nguyên tắc ALARP (R <= 6) trước khi phê duyệt JSA; tự động từ chối và yêu cầu bổ sung biện pháp kỹ thuật nếu rủi ro còn lại ở mức cao."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - hse_jsas
      filter:
        status:
          _eq: submitted
    nodes:
      - key: read_jsa_record
        name: "Đọc Hồ sơ JSA Trình duyệt"
        type: item-read
        options:
          collection: hse_jsas
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - jsa_number
              - title
              - lead_assessor
              - safety_reviewer
              - overall_residual_risk_level
        position_x: 1
        position_y: 1

      - key: verify_alarp_residual_level
        name: "Kiểm tra Mức Rủi ro Dư ALARP"
        type: condition
        options:
          filter:
            read_jsa_record:
              overall_residual_risk_level:
                _eq: LOW
        position_x: 20
        position_y: 1

      - key: approve_jsa_status
        name: "Phê duyệt JSA Đạt chuẩn ALARP"
        type: item-update
        options:
          collection: hse_jsas
          key: "{{$trigger.key}}"
          data:
            status: approved
        position_x: 40
        position_y: 1

      - key: notify_jsa_author_approved
        name: "Thông báo JSA Đã Được Phê duyệt"
        type: notification
        options:
          recipient: "{{read_jsa_record.lead_assessor}}"
          subject: "JSA #{{read_jsa_record.jsa_number}} đã được phê duyệt an toàn"
          message: "Phân tích an toàn công việc JSA #{{read_jsa_record.jsa_number}} đã chứng minh rủi ro dư ở mức thấp (ALARP <= 6) và được phê duyệt."
        position_x: 60
        position_y: 1

      - key: reject_jsa_high_residual
        name: "Từ chối JSA do Rủi ro Dư Vượt ngưỡng ALARP"
        type: item-update
        options:
          collection: hse_jsas
          key: "{{$trigger.key}}"
          data:
            status: rejected
        position_x: 40
        position_y: 14

      - key: notify_jsa_author_rejected
        name: "Thông báo Yêu cầu Bổ sung Kiểm soát JSA"
        type: notification
        options:
          recipient: "{{read_jsa_record.lead_assessor}}"
          subject: "JSA #{{read_jsa_record.jsa_number}} bị từ chối: Rủi ro vượt ngưỡng an toàn"
          message: "JSA chưa chứng minh giảm thiểu rủi ro xuống mức thấp nhất chấp nhận được (ALARP). Vui lòng bổ sung biện pháp kiểm soát kỹ thuật hoặc thiết bị bảo hộ đặc chủng."
        position_x: 60
        position_y: 14

    edges:
      - ["$trigger", "read_jsa_record", "resolve"]
      - ["read_jsa_record", "verify_alarp_residual_level", "resolve"]
      - ["verify_alarp_residual_level", "approve_jsa_status", "resolve"]
      - ["approve_jsa_status", "notify_jsa_author_approved", "resolve"]
      - ["verify_alarp_residual_level", "reject_jsa_high_residual", "reject"]
      - ["reject_jsa_high_residual", "notify_jsa_author_rejected", "resolve"]

  - key: dpm-capa-lifecycle-verification
    name: "Quy trình Nghiệm thu Độc lập Hành động Khắc phục (CAPA SoD Verification)"
    description: "Khi hành động khắc phục hoàn thành, kích hoạt quy trình nghiệm thu kiểm chứng độc lập (Verifier != Assignee) và thông báo người kiểm chứng thực địa."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - grc_actions
      filter:
        status:
          _eq: completed
    nodes:
      - key: read_completed_capa
        name: "Đọc Dữ liệu CAPA Đã Thực hiện"
        type: item-read
        options:
          collection: grc_actions
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - identifier
              - title
              - assignee
              - verifier
              - verification_status
        position_x: 1
        position_y: 1

      - key: check_capa_verification_gate
        name: "Kiểm tra Trạng thái Nghiệm thu"
        type: condition
        options:
          filter:
            read_completed_capa:
              verification_status:
                _eq: PENDING
        position_x: 20
        position_y: 1

      - key: notify_capa_independent_verifier
        name: "Gửi Yêu cầu Nghiệm thu cho Verifier"
        type: notification
        options:
          recipient: "{{read_completed_capa.verifier}}"
          subject: "CAPA #{{read_completed_capa.identifier}} hoàn thành - Chờ nghiệm thu kiểm chứng thực địa"
          message: "Hành động khắc phục CAPA #{{read_completed_capa.identifier}} đã được thực hiện. Đề nghị người nghiệm thu độc lập kiểm chứng hiệu quả hiện trường."
        position_x: 40
        position_y: 1

      - key: log_capa_already_verified
        name: "Ghi nhận CAPA Đã Nghiệm thu Hoàn tất"
        type: transform
        options:
          note: "Hành động khắc phục đã được nghiệm thu hiệu quả hoặc không ở trạng thái chờ kiểm chứng."
        position_x: 40
        position_y: 14

    edges:
      - ["$trigger", "read_completed_capa", "resolve"]
      - ["read_completed_capa", "check_capa_verification_gate", "resolve"]
      - ["check_capa_verification_gate", "notify_capa_independent_verifier", "resolve"]
      - ["check_capa_verification_gate", "log_capa_already_verified", "reject"]

rules:
  - rule_id: DPM-PSM-001
    name: "Hot Work Strict Flammable Gas Limit"
    description: "Atmospheric combustible gas level must be strictly under 10% LEL prior to issuing Hot Work permits in the ammonia/urea complex."
    severity: critical
    condition: "gas_ch4_lel_percent < 10.0"
    enforcement: strict_rejection
    action: "Block permit issuance and initiate hazardous gas evacuation."

  - rule_id: DPM-MOC-002
    name: "3-Stage Separation of Duty in MOC Approvals"
    description: "Process Safety, Operations, and Plant Manager approvals must be executed by distinct authorized personnel without self-approval."
    severity: high
    condition: "process_safety_approver != operations_approver && operations_approver != plant_manager_approver"
    enforcement: approval_gate
    action: "Enforce multi-discipline sequential signoff gate."

  - rule_id: DPM-JSA-003
    name: "JSA Residual Risk ALARP Threshold"
    description: "All job steps in JSA must demonstrate ALARP residual risk score <= 6 prior to approval."
    severity: high
    condition: "residual_risk_score <= 6"
    enforcement: approval_gate
    action: "Reject JSA and require additional hierarchy of controls."

  - rule_id: DPM-CAPA-004
    name: "CAPA Segregation of Duties Invariant"
    description: "Assignee cannot act as the Verifier for their own corrective action (Maker != Checker)."
    severity: high
    condition: "assignee != verifier"
    enforcement: strict_rejection
    action: "Reject self-verification of CAPA actions."

