    - collection: aes_transformer_dga_telemetry
      name: "GSU Transformer DGA Telemetry"
      description: "Dissolved Gas Analysis (DGA) surveillance per IEEE C57.104 and Duval Triangle fault diagnosis for Generator Step-Up transformers."
      fields:
        - field: id
          type: uuid
        - field: transformer_tag
          type: string
        - field: h2_ppm
          type: float
        - field: ch4_ppm
          type: float
        - field: c2h2_ppm
          type: float
        - field: c2h4_ppm
          type: float
        - field: c2h6_ppm
          type: float
        - field: tdcg_ppm
          type: float
        - field: duval_fault_zone
          type: string
        - field: oil_temp_c
          type: float
        - field: status
          type: string

    - collection: aes_nerc_cip_assets
      name: "NERC CIP OT Cyber Assets & Baseline Ledger"
      description: "Configuration baseline, cryptographic hash integrity, and Maker-Checker patch authorization for BES Cyber Systems per NERC CIP-007 and CIP-010."
      fields:
        - field: id
          type: uuid
        - field: cyber_asset_tag
          type: string
        - field: esp_zone
          type: string
        - field: firmware_version
          type: string
        - field: baseline_sha256
          type: string
        - field: observed_sha256
          type: string
        - field: patch_approval_id
          type: string
        - field: requester_id
          type: uuid
        - field: approver_id
          type: uuid
        - field: status
          type: string

    - collection: aes_ghg_emission_ledgers
      name: "Thermal Generation GHG Scope 1 & Carbon Intensity Ledgers"
      description: "Thermal power fuel consumption, net generation, and Scope 1 CO2 carbon intensity reconciliation under ISO 50001 and statutory emission quotas."
      fields:
