    - collection: aes_ptw_csp
      name: "PTW-AES Confined Space Permits (CSP) & Entry Point Condition Monitoring"
      description: "Confined Space Permits (CSP) linked to PTW-AES with Entry Point Condition Monitoring inputs (O2, LEL, CO, H2S, NH3) per interval and validity tracking (actived/invalided) without hardware interlock."
      fields:
        - field: id
          type: uuid
        - field: title
          type: string
        - field: permit
          type: uuid
        - field: status
          type: string
        - field: approved_by
          type: uuid
        - field: evidence
          type: text
        - field: entry_details
          type: text
        - field: rescue_details
          type: text
        - field: lel_pct
          type: float
        - field: h2s_ppm
          type: float
        - field: nh3_ppm
          type: float
        - field: o2_pct
          type: float
        - field: co_ppm
          type: float
        - field: interval_hours
          type: integer
        - field: valid_end_at
          type: timestamp
        - field: condition_status
          type: string

    - collection: aes_ptw_hwp
      name: "PTW-AES Hot Work Permits (HWP) & Entry Point Condition Monitoring"
      description: "Hot Work Permits (HWP) linked to PTW-AES with Entry Point Condition Monitoring inputs (O2, LEL, CO, H2S, NH3) per interval and validity tracking (actived/invalided) without hardware interlock."
      fields:
        - field: id
          type: uuid
        - field: title
          type: string
        - field: permit
          type: uuid
        - field: status
          type: string
        - field: approved_by
          type: uuid
        - field: evidence
          type: text
        - field: lel_pct
          type: float
        - field: h2s_ppm
          type: float
        - field: nh3_ppm
          type: float
        - field: o2_pct
          type: float
        - field: co_ppm
          type: float
        - field: interval_hours
          type: integer
        - field: valid_end_at
          type: timestamp
        - field: condition_status
          type: string

  relations:
    - collection: aes_loto_isolations
      field: lockbox_id
      related_collection: aes_lockbox_registers
      type: m2o
    - collection: aes_loto_forced_removals
      field: lockbox_id
      related_collection: aes_lockbox_registers
      type: m2o

  equipment_taxonomy:
    plant_code: AES_MONGDUONG
    areas:
      - code: "GEN_U1"
        name: "Unit 1 Power Block (560 MW)"
        systems:
          - code: "B1"
            name: "CFB Boiler Unit 1 & ESP"
          - code: "ST1"
            name: "Steam Turbine & Generator Unit 1"
          - code: "FGD1"
            name: "Seawater Flue Gas Desulfurization Unit 1"
      - code: "GEN_U2"
        name: "Unit 2 Power Block (560 MW)"
        systems:
          - code: "B2"
            name: "CFB Boiler Unit 2 & ESP"
          - code: "ST2"
            name: "Steam Turbine & Generator Unit 2"
          - code: "FGD2"
            name: "Seawater Flue Gas Desulfurization Unit 2"
      - code: "SWYD"
        name: "High Voltage Switchyard (500kV / 220kV GIS)"

business_flows:
  - key: aes-loto-4eyes-multi-step
    name: "High-Voltage 4-Eyes LOTO 12-State Isolation & Lockbox Flow"
    description: "Enforces 12-state hazardous energy isolation lifecycle with strict 4-eyes Maker-Checker SoD (CBO-1, CBO-2, Local 1, Local 2, WPH, CBO-3) across 500kV/220kV switchgear."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - aes_loto_isolations
      filter:
        status:
          _eq: isolation_submitted
    nodes:
      - key: read_isolation_dossier
        name: "Read High-Voltage Isolation Request Dossier"
        type: item-read
        options:
          collection: aes_loto_isolations
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - loto_no
              - equipment_tag
              - voltage_class_kv
              - lockbox_id
              - cbo1_preparer_id
              - cbo2_verifier_id
              - local1_operator_id
              - local2_witness_id
              - wph_holder_id
              - cbo3_authorizer_id
              - status
        position_x: 1
        position_y: 1

      - key: read_lockbox_isolation_points
        name: "Read Physical Lockbox Status & Key Verification"
        type: item-read
        options:
          collection: aes_lockbox_registers
          key: "{{read_isolation_dossier.lockbox_id}}"
          query:
            fields:
              - id
              - lockbox_code
              - breaker_racked_out
              - earth_switch_closed
              - padlocks_applied
              - master_key_secured
              - keys_deposited_count
        position_x: 20
        position_y: 1

      - key: check_4eyes_sod_separation
        name: "Verify 4-Eyes Maker-Checker Separation of Duties"
        type: condition
        options:
          filter:
            _and:
              - read_isolation_dossier:
                  cbo1_preparer_id:
                    _neq: "{{read_isolation_dossier.cbo2_verifier_id}}"
              - read_isolation_dossier:
                  local1_operator_id:
                    _neq: "{{read_isolation_dossier.local2_witness_id}}"
              - read_isolation_dossier:
                  wph_holder_id:
                    _neq: "{{read_isolation_dossier.cbo3_authorizer_id}}"
        position_x: 40
        position_y: 1

      - key: verify_physical_isolation_safeguards
        name: "Verify Physical Isolation & Earth Switch Latching"
        type: condition
        options:
          filter:
            _and:
              - read_lockbox_isolation_points:
                  breaker_racked_out:
                    _eq: true
              - read_lockbox_isolation_points:
                  earth_switch_closed:
                    _eq: true
              - read_lockbox_isolation_points:
                  padlocks_applied:
                    _eq: true
              - read_lockbox_isolation_points:
                  master_key_secured:
                    _eq: true
              - read_lockbox_isolation_points:
                  keys_deposited_count:
                    _gte: 1
        position_x: 60
        position_y: 1

      - key: authorize_12state_isolation
        name: "Authorize 12-State High-Voltage Isolation"
        type: item-update
        options:
          collection: aes_loto_isolations
          key: "{{$trigger.key}}"
          data:
            status: isolated_verified
            work_authorized: true
            isolation_step: cbo3_lockbox_secured
            isolation_witnessed_at: "{{$NOW}}"
        position_x: 80
        position_y: 1

      - key: notify_isolation_cleared
        name: "Notify WPH of Completed 4-Eyes Isolation"
        type: notification
        options:
          recipient: "{{read_isolation_dossier.wph_holder_id}}"
          subject: "LOTO Authorized: 4-Eyes Isolation Verified for {{read_isolation_dossier.equipment_tag}}"
          message: "12-state isolation verified. CBO-1/2, Local 1/2, and CBO-3 signed. Lockbox secured. Maintenance authorized."
        position_x: 100
        position_y: 1

      - key: reject_physical_deficiency
        name: "Reject Isolation Due to Missing Physical Safeguards"
        type: item-update
        options:
          collection: aes_loto_isolations
          key: "{{$trigger.key}}"
          data:
            status: isolation_verification_failed
            work_authorized: false
            alert_flag: missing_rackout_or_grounding
        position_x: 80
        position_y: 15

      - key: notify_physical_abort
        name: "Alert CBO of Physical Isolation Failure"
        type: notification
        options:
          recipient: "{{read_isolation_dossier.cbo3_authorizer_id}}"
          subject: "ISOLATION REJECTED: Physical Safeguard Missing on {{read_isolation_dossier.equipment_tag}}"
          message: "High-voltage isolation rejected: breaker not racked out, earth switch open, or master key unverified."
        position_x: 100
        position_y: 15

      - key: reject_sod_violation
        name: "Reject Isolation Due to Maker-Checker SoD Breach"
        type: item-update
        options:
          collection: aes_loto_isolations
          key: "{{$trigger.key}}"
          data:
            status: isolation_rejected_sod_conflict
            work_authorized: false
            alert_flag: maker_checker_sod_breach
        position_x: 60
        position_y: 30

      - key: notify_sod_breach
        name: "Alert SCE of SoD Separation Conflict"
        type: notification
        options:
          recipient: "{{read_isolation_dossier.cbo1_preparer_id}}"
          subject: "SECURITY ALERT: LOTO 4-Eyes SoD Violation on {{read_isolation_dossier.equipment_tag}}"
          message: "Isolation rejected due to Maker-Checker conflict: CBO-1 cannot verify CBO-2, or Local Operator 1 cannot witness self."
        position_x: 80
        position_y: 30

    edges:
      - ["$trigger", "read_isolation_dossier", "resolve"]
      - ["read_isolation_dossier", "read_lockbox_isolation_points", "resolve"]
      - ["read_lockbox_isolation_points", "check_4eyes_sod_separation", "resolve"]
      - ["check_4eyes_sod_separation", "verify_physical_isolation_safeguards", "resolve"]
      - ["check_4eyes_sod_separation", "reject_sod_violation", "reject"]
      - ["verify_physical_isolation_safeguards", "authorize_12state_isolation", "resolve"]
      - ["verify_physical_isolation_safeguards", "reject_physical_deficiency", "reject"]
      - ["authorize_12state_isolation", "notify_isolation_cleared", "resolve"]
      - ["reject_physical_deficiency", "notify_physical_abort", "resolve"]
      - ["reject_sod_violation", "notify_sod_breach", "resolve"]

  - key: aes-loto-group-lockbox-sync
    name: "Group Lockbox (GLBX) Custody & Contractor Lock Synchronization Flow"
    description: "Tracks contractor master and personal padlocks on group lockboxes (OSHA 1910.147). Forbids de-isolation and re-energization until 100% of contractor locks are removed."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - aes_lockbox_registers
      filter:
        status:
          _eq: deisolation_clearance_requested
    nodes:
      - key: read_lockbox_custody
        name: "Read Group Lockbox Active Custody Records"
        type: item-read
        options:
          collection: aes_lockbox_registers
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - lockbox_code
              - contractor_locks_attached_count
              - contractor_locks_removed_count
              - active_contractor_count
              - custodian_id
        position_x: 1
        position_y: 1

      - key: verify_contractor_locks_cleared
        name: "Verify 100% Contractor Padlocks Removed"
        type: condition
        options:
          filter:
            _and:
              - read_lockbox_custody:
                  active_contractor_count:
                    _eq: 0
              - read_lockbox_custody:
                  contractor_locks_attached_count:
                    _eq: "{{read_lockbox_custody.contractor_locks_removed_count}}"
        position_x: 20
        position_y: 1

      - key: release_group_lockbox
        name: "Release Group Lockbox & Authorize Key Retrieval"
        type: item-update
        options:
          collection: aes_lockbox_registers
          key: "{{$trigger.key}}"
          data:
            status: available_cleared
            all_contractors_cleared: true
            master_key_releasable: true
            cleared_at: "{{$NOW}}"
        position_x: 40
        position_y: 1

      - key: notify_cbo_lockbox_cleared
        name: "Notify Custodian that All Padlocks are Cleared"
        type: notification
        options:
          recipient: "{{read_lockbox_custody.custodian_id}}"
          subject: "Lockbox Cleared: All Contractor Padlocks Removed from {{read_lockbox_custody.lockbox_code}}"
          message: "All contractor crews have removed personal locks. CBO authorized to retrieve master key and proceed with plant de-isolation."
        position_x: 60
        position_y: 1

      - key: retain_group_lockbox_hold
        name: "Hold Lockbox Due to Lingering Contractor Padlocks"
        type: item-update
        options:
          collection: aes_lockbox_registers
          key: "{{$trigger.key}}"
          data:
            status: lockbox_hold_contractors_attached
            master_key_releasable: false
            alert_flag: contractor_locks_still_present
        position_x: 40
        position_y: 15

      - key: notify_contractor_locks_remaining
        name: "Alert Custodian of Lingering Contractor Locks"
        type: notification
        options:
          recipient: "{{read_lockbox_custody.custodian_id}}"
          subject: "DEISOLATION BLOCKED: Contractor Padlocks Still Present on {{read_lockbox_custody.lockbox_code}}"
          message: "De-isolation rejected. Active contractor locks remain attached to lockbox. Switchgear re-energization prohibited."
        position_x: 60
        position_y: 15

    edges:
      - ["$trigger", "read_lockbox_custody", "resolve"]
      - ["read_lockbox_custody", "verify_contractor_locks_cleared", "resolve"]
      - ["verify_contractor_locks_cleared", "release_group_lockbox", "resolve"]
      - ["release_group_lockbox", "notify_cbo_lockbox_cleared", "resolve"]
      - ["verify_contractor_locks_cleared", "retain_group_lockbox_hold", "reject"]
      - ["retain_group_lockbox_hold", "notify_contractor_locks_remaining", "resolve"]

  - key: aes-loto-forced-removal-council
    name: "Forced Lock Removal Emergency Council 3-Party Protocol"
    description: "Strict multi-signoff emergency lock cutting protocol requiring unanimous consent of Shift Charge Engineer (SCE), Lockbox Custodian, and Plant HSE Manager following verified field search."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - aes_loto_forced_removals
      filter:
        status:
          _eq: council_convened
    nodes:
      - key: read_forced_removal_dossier
        name: "Read Forced Lock Removal Request Dossier"
        type: item-read
        options:
          collection: aes_loto_forced_removals
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - removal_no
              - lockbox_id
              - equipment_tag
              - absent_wph_name
              - sce_signature
              - custodian_signature
              - hse_manager_signature
              - field_sweep_cleared
              - emergency_reason
        position_x: 1
        position_y: 1

      - key: read_target_lockbox
        name: "Read Target Lockbox Register & Status"
        type: item-read
        options:
          collection: aes_lockbox_registers
          key: "{{read_forced_removal_dossier.lockbox_id}}"
          query:
            fields:
              - id
              - lockbox_code
              - status
              - breaker_racked_out
        position_x: 20
        position_y: 1

      - key: verify_3party_council_approval
        name: "Verify Unanimous 3-Party Council Approval & Field Search"
        type: condition
        options:
          filter:
            _and:
              - read_forced_removal_dossier:
                  field_sweep_cleared:
                    _eq: true
              - read_forced_removal_dossier:
                  sce_signature:
                    _nnull: true
              - read_forced_removal_dossier:
                  custodian_signature:
                    _nnull: true
              - read_forced_removal_dossier:
                  hse_manager_signature:
                    _nnull: true
        position_x: 40
        position_y: 1

      - key: authorize_forced_removal
        name: "Authorize Bolt-Cutter Removal & Stamp Audit Trail"
        type: item-update
        options:
          collection: aes_loto_forced_removals
          key: "{{$trigger.key}}"
          data:
            status: authorized_for_cutting
            merkle_audit_recorded: true
            council_authorized_at: "{{$NOW}}"
        position_x: 60
        position_y: 1

      - key: update_lockbox_cut_status
        name: "Record Forced Lock Cut on Lockbox Register"
        type: item-update
        options:
          collection: aes_lockbox_registers
          key: "{{read_forced_removal_dossier.lockbox_id}}"
          data:
            status: forced_lock_cut_authorized
            forced_removal_executed: true
            alert_flag: forced_lock_cut_logged
        position_x: 80
        position_y: 1

      - key: broadcast_forced_removal_audit
        name: "Broadcast Forced Lock Removal Audit Notification"
        type: notification
        options:
          recipient: "{{read_forced_removal_dossier.sce_signature}}"
          subject: "EMERGENCY LOTO FORCED REMOVAL AUTHORIZED: Lockbox {{read_target_lockbox.lockbox_code}}"
          message: "Unanimous council approval granted (SCE, Custodian, HSE). Field search confirmed no personnel inside {{read_forced_removal_dossier.equipment_tag}}. Bolt-cutter removal authorized and logged to Merkle audit ledger."
        position_x: 100
        position_y: 1

      - key: reject_forced_removal
        name: "Reject Forced Removal Due to Incomplete Signoff"
        type: item-update
        options:
          collection: aes_loto_forced_removals
          key: "{{$trigger.key}}"
          data:
            status: rejected_incomplete_council
            merkle_audit_recorded: false
            alert_flag: missing_council_signatures_or_sweep
        position_x: 60
        position_y: 15

      - key: notify_council_rejection
        name: "Alert SCE of Forced Removal Protocol Rejection"
        type: notification
        options:
          recipient: "{{read_forced_removal_dossier.sce_signature}}"
          subject: "FORCED REMOVAL REJECTED: Incomplete Council Signatures or Unverified Field Sweep"
          message: "Cutting of abandoned lock on {{read_target_lockbox.lockbox_code}} DENIED. All 3 signatures and verified field sweep required before any forced removal."
        position_x: 80
        position_y: 15

    edges:
      - ["$trigger", "read_forced_removal_dossier", "resolve"]
      - ["read_forced_removal_dossier", "read_target_lockbox", "resolve"]
      - ["read_target_lockbox", "verify_3party_council_approval", "resolve"]
      - ["verify_3party_council_approval", "authorize_forced_removal", "resolve"]
      - ["authorize_forced_removal", "update_lockbox_cut_status", "resolve"]
      - ["update_lockbox_cut_status", "broadcast_forced_removal_audit", "resolve"]
      - ["verify_3party_council_approval", "reject_forced_removal", "reject"]
      - ["reject_forced_removal", "notify_council_rejection", "resolve"]

  - key: aes-cems-exceedance-auto-capa
    name: "CEMS Continuous Emission Exceedance Alert & Automatic CAPA Flow"
    description: "Monitors stack flue gas emissions against TCVN 7440 statutory caps (SO2 > 500, NOx > 1000, Dust > 100 mg/Nm3). Automatically dispatches environmental CAPA and corrective FGD/ESP operations."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - aes_cems_telemetry
      filter:
        emission_compliance_status:
          _eq: exceedance_detected
    nodes:
      - key: read_cems_telemetry
        name: "Read Stack Continuous Flue Gas Telemetry"
        type: item-read
        options:
          collection: aes_cems_telemetry
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - stack_id
              - timestamp
              - so2_instantaneous
              - nox_instantaneous
              - dust_instantaneous
              - co_instantaneous
              - o2_percentage
        position_x: 1
        position_y: 1

      - key: evaluate_cems_thresholds
        name: "Evaluate TCVN 7440 Statutory Emission Caps"
        type: condition
        options:
          filter:
            _or:
              - read_cems_telemetry:
                  so2_instantaneous:
                    _gt: 500.0
              - read_cems_telemetry:
                  nox_instantaneous:
                    _gt: 1000.0
              - read_cems_telemetry:
                  dust_instantaneous:
                    _gt: 100.0
        position_x: 20
        position_y: 1

      - key: create_cems_emergency_capa
        name: "Create Emergency Environmental CAPA"
        type: item-create
        options:
          collection: grc_actions
          data:
            title: "CEMS Stack {{read_cems_telemetry.stack_id}} Exceedance Mitigation"
            source_module: cems_surveillance
            action_category: environmental_compliance
            priority: critical
            status: open
            description: "Flue gas exceedance logged: SO2={{read_cems_telemetry.so2_instantaneous}} mg/Nm3 (cap 500), NOx={{read_cems_telemetry.nox_instantaneous}} mg/Nm3 (cap 1000), Dust={{read_cems_telemetry.dust_instantaneous}} mg/Nm3 (cap 100)."
        position_x: 40
        position_y: 1

      - key: create_fgd_esp_tuning_task
        name: "Dispatch Operational FGD & ESP Tuning Task"
        type: item-create
        options:
          collection: hse_tasks
          data:
            task_title: "Emergency FGD Slurry Rate Increase & ESP Electrical Field Inspection"
            unit_tag: "FGD-ESP-STACK"
            priority: critical
            status: assigned
            assigned_to: "FGD_Lead_Operator"
            deadline_hours: 1
        position_x: 60
        position_y: 1

      - key: update_cems_telemetry_status
        name: "Update CEMS Record with Active CAPA Reference"
        type: item-update
        options:
          collection: aes_cems_telemetry
          key: "{{$trigger.key}}"
          data:
            emission_compliance_status: exceedance_capa_dispatched
            alert_dispatched: true
        position_x: 80
        position_y: 1

      - key: notify_cems_environmental_alert
        name: "Dispatch High-Priority SMS & Alert to Plant Officers"
        type: notification
        options:
          recipient: "ENVIRONMENTAL_DUTY_OFFICER"
          subject: "CRITICAL CEMS EXCEEDANCE: Stack {{read_cems_telemetry.stack_id}} Exceeded Regulatory Cap"
          message: "SO2={{read_cems_telemetry.so2_instantaneous}} mg/Nm3, NOx={{read_cems_telemetry.nox_instantaneous}} mg/Nm3, Dust={{read_cems_telemetry.dust_instantaneous}} mg/Nm3. Emergency CAPA created. FGD lime slurry increase mandated."
        position_x: 100
        position_y: 1

      - key: update_cems_compliant_status
        name: "Reset CEMS Status to Statutory Compliance"
        type: item-update
        options:
          collection: aes_cems_telemetry
          key: "{{$trigger.key}}"
          data:
            emission_compliance_status: compliant
            alert_dispatched: false
        position_x: 40
        position_y: 15

      - key: notify_cems_normalization
        name: "Notify Environmental Team of Emission Normalization"
        type: notification
        options:
          recipient: "ENVIRONMENTAL_DUTY_OFFICER"
          subject: "CEMS Normalization: Stack {{read_cems_telemetry.stack_id}} Emissions Compliant"
          message: "Continuous emissions returned within TCVN 7440 statutory caps. Telemetry verified."
        position_x: 60
        position_y: 15

    edges:
      - ["$trigger", "read_cems_telemetry", "resolve"]
      - ["read_cems_telemetry", "evaluate_cems_thresholds", "resolve"]
      - ["evaluate_cems_thresholds", "create_cems_emergency_capa", "resolve"]
      - ["create_cems_emergency_capa", "create_fgd_esp_tuning_task", "resolve"]
      - ["create_fgd_esp_tuning_task", "update_cems_telemetry_status", "resolve"]
      - ["update_cems_telemetry_status", "notify_cems_environmental_alert", "resolve"]
      - ["evaluate_cems_thresholds", "update_cems_compliant_status", "reject"]
      - ["update_cems_compliant_status", "notify_cems_normalization", "resolve"]

  - key: aes-contractor-credential-safety-gate
    name: "Contractor Safety Credential & Heavy Equipment Inspection Gate Flow"
    description: "Validates statutory load test certificates for mobile cranes, hydrostatic test tags for pressure vessels, and electrician safety licenses before authorizing PTW issuance."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - aes_contractor_equipment
      filter:
        status:
          _eq: verification_requested
    nodes:
      - key: read_contractor_equipment_record
        name: "Read Contractor Equipment & Personnel Dossier"
        type: item-read
        options:
          collection: aes_contractor_equipment
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - contractor_name
              - equipment_code
              - equipment_type
              - crane_load_test_valid
              - pressure_vessel_cert_valid
              - electrical_tool_cert_valid
              - operator_safety_card_valid
              - hse_prequalification_score
        position_x: 1
        position_y: 1

      - key: verify_contractor_safety_credentials
        name: "Verify 100% Inspection Tags & Qualification Score"
        type: condition
        options:
          filter:
            _and:
              - read_contractor_equipment_record:
                  crane_load_test_valid:
                    _eq: true
              - read_contractor_equipment_record:
                  pressure_vessel_cert_valid:
                    _eq: true
              - read_contractor_equipment_record:
                  electrical_tool_cert_valid:
                    _eq: true
              - read_contractor_equipment_record:
                  operator_safety_card_valid:
                    _eq: true
              - read_contractor_equipment_record:
                  hse_prequalification_score:
                    _gte: 80.0
        position_x: 20
        position_y: 1

      - key: approve_equipment_for_ptw
        name: "Approve Equipment & Authorize PTW Association"
        type: item-update
        options:
          collection: aes_contractor_equipment
          key: "{{$trigger.key}}"
          data:
            status: certified_active
            ptw_issuance_allowed: true
            certified_at: "{{$NOW}}"
        position_x: 40
        position_y: 1

      - key: notify_contractor_approved
        name: "Notify Gate Security of Cleared Equipment"
        type: notification
        options:
          recipient: "PLANT_GATE_SECURITY"
          subject: "EQUIPMENT CLEARED: {{read_contractor_equipment_record.equipment_code}} Certified for Site Entry"
          message: "Contractor {{read_contractor_equipment_record.contractor_name}} equipment {{read_contractor_equipment_record.equipment_code}} ({{read_contractor_equipment_record.equipment_type}}) passed 100% inspection checks. PTW attachment authorized."
        position_x: 60
        position_y: 1

      - key: block_equipment_and_ptw
        name: "Block Non-Compliant Equipment & Inhibit PTW"
        type: item-update
        options:
          collection: aes_contractor_equipment
          key: "{{$trigger.key}}"
          data:
            status: blocked_certification_expired
            ptw_issuance_allowed: false
            alert_flag: expired_inspection_or_low_score
        position_x: 40
        position_y: 15

      - key: notify_contractor_blocked
        name: "Alert Safety Team of Blocked Contractor Equipment"
        type: notification
        options:
          recipient: "HSE_CONTRACTOR_SUPERVISOR"
          subject: "SAFETY GATE REJECTION: {{read_contractor_equipment_record.equipment_code}} Blocked"
          message: "Equipment certification failed: expired load test, pressure vessel tag, or contractor safety score < 80%. PTW creation blocked."
        position_x: 60
        position_y: 15

    edges:
      - ["$trigger", "read_contractor_equipment_record", "resolve"]
      - ["read_contractor_equipment_record", "verify_contractor_safety_credentials", "resolve"]
      - ["verify_contractor_safety_credentials", "approve_equipment_for_ptw", "resolve"]
      - ["approve_equipment_for_ptw", "notify_contractor_approved", "resolve"]
      - ["verify_contractor_safety_credentials", "block_equipment_and_ptw", "reject"]
      - ["block_equipment_and_ptw", "notify_contractor_blocked", "resolve"]

  - key: aes-boiler-ciwh-interlock
    name: "CFB Boiler Thermal Ramp Rate & CIWH Water Hammer Prevention Interlock Flow"
    description: "Monitors boiler drum metal temperature rate of rise (< 55°C/h) and top-to-bottom differential (< 40°C) during warm-up to prevent Cold Inflow Water Hammer (CIWH) and structural drum fatigue."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - aes_boiler_startups
      filter:
        status:
          _eq: startup_ramp_in_progress
    nodes:
      - key: read_boiler_startup_telemetry
        name: "Read Boiler Startup Drum Telemetry"
        type: item-read
        options:
          collection: aes_boiler_startups
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - boiler_tag
              - drum_temperature_rate_c_hr
              - drum_pressure_bar
              - metal_temp_top_bottom_delta_c
              - feedwater_temp_c
              - superheater_steam_temp_c
        position_x: 1
        position_y: 1

      - key: verify_boiler_thermal_limits
        name: "Verify Drum Ramp Rate <= 55°C/h & Delta <= 40°C"
        type: condition
        options:
          filter:
            _and:
              - read_boiler_startup_telemetry:
                  drum_temperature_rate_c_hr:
                    _lte: 55.0
              - read_boiler_startup_telemetry:
                  metal_temp_top_bottom_delta_c:
                    _lte: 40.0
        position_x: 20
        position_y: 1

      - key: authorize_continuous_warmup
        name: "Authorize Continuous Boiler Warm-Up Sequence"
        type: item-update
        options:
          collection: aes_boiler_startups
          key: "{{$trigger.key}}"
          data:
            status: warmup_ramp_normal
            ciwh_protection_active: true
            interlock_trip: false
        position_x: 40
        position_y: 1

      - key: notify_boiler_ramp_normal
        name: "Notify Control Room of Compliant Thermal Gradient"
        type: notification
        options:
          recipient: "BOILER_CONTROL_ROOM_OPERATOR"
          subject: "Boiler {{read_boiler_startup_telemetry.boiler_tag}} Thermal Ramp Compliant"
          message: "Drum ramp rate {{read_boiler_startup_telemetry.drum_temperature_rate_c_hr}} °C/h is within safe 55°C/h ASME Sec I limit. Differential {{read_boiler_startup_telemetry.metal_temp_top_bottom_delta_c}} °C compliant. Continue warm-up."
        position_x: 60
        position_y: 1

      - key: trip_boiler_ramp_interlock
        name: "Engage Emergency Fuel Hold & Interlock Trip"
        type: item-update
        options:
          collection: aes_boiler_startups
          key: "{{$trigger.key}}"
          data:
            status: tripped_thermal_ramp_exceeded
            ciwh_protection_active: true
            interlock_trip: true
            alert_flag: thermal_shock_ciwh_prevention
        position_x: 40
        position_y: 15

      - key: create_boiler_inspection_action
        name: "Create Immediate Thermal Ramp Investigation CAPA"
        type: item-create
        options:
          collection: grc_actions
          data:
            title: "Boiler Thermal Ramp Exceedance Investigation - {{read_boiler_startup_telemetry.boiler_tag}}"
            source_module: boiler_interlock
            action_category: asset_integrity
            priority: critical
            status: open
            description: "Boiler drum ramp rate exceeded 55°C/h (measured {{read_boiler_startup_telemetry.drum_temperature_rate_c_hr}} °C/h). Automatic interlock engaged to prevent CIWH thermal shock."
        position_x: 60
        position_y: 15

      - key: notify_boiler_trip_emergency
        name: "Alert SCE of Emergency Ramp Rate Interlock Trip"
        type: notification
        options:
          recipient: "SHIFT_CHARGE_ENGINEER"
          subject: "EMERGENCY INTERLOCK TRIP: Boiler {{read_boiler_startup_telemetry.boiler_tag}} Thermal Ramp Exceeded"
          message: "Drum ramp rate {{read_boiler_startup_telemetry.drum_temperature_rate_c_hr}} °C/h exceeded 55°C/h limit. Firing hold engaged to prevent CIWH shock. Emergency CAPA created."
        position_x: 80
        position_y: 15

    edges:
      - ["$trigger", "read_boiler_startup_telemetry", "resolve"]
      - ["read_boiler_startup_telemetry", "verify_boiler_thermal_limits", "resolve"]
      - ["verify_boiler_thermal_limits", "authorize_continuous_warmup", "resolve"]
      - ["authorize_continuous_warmup", "notify_boiler_ramp_normal", "resolve"]
      - ["verify_boiler_thermal_limits", "trip_boiler_ramp_interlock", "reject"]
      - ["trip_boiler_ramp_interlock", "create_boiler_inspection_action", "resolve"]
      - ["create_boiler_inspection_action", "notify_boiler_trip_emergency", "resolve"]

  - key: aes-transformer-dga-ieee-c57104-gate
    name: "IEEE C57.104 Generator Step-Up (GSU) Transformer Dissolved Gas Analysis (DGA) & Duval Triangle Fault Interlock"
    description: "Evaluates transformer oil dissolved gas concentrations against IEEE C57.104 limits (C2H2 <= 2.0 ppm, TDCG <= 720 ppm). Normal readings certify transformer operational status; exceedances trigger Duval Triangle D2 High Energy Arcing classification, emergency inspection dispatch in hse_tasks, and corrective action CAPA in grc_actions."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.create
        - items.update
      collections:
        - aes_transformer_dga_telemetry
    nodes:
      - key: read_transformer_dga_telemetry
        name: "Read GSU Transformer Dissolved Gas Telemetry"
        type: item-read
        options:
          collection: aes_transformer_dga_telemetry
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - transformer_tag
              - h2_ppm
              - ch4_ppm
              - c2h2_ppm
              - c2h4_ppm
              - c2h6_ppm
              - tdcg_ppm
              - duval_fault_zone
              - oil_temp_c
              - status
        position_x: 1
        position_y: 1

      - key: verify_dga_ieee_thresholds
        name: "Verify IEEE C57.104 Limits (C2H2 <= 2.0 ppm & TDCG <= 720 ppm)"
        type: condition
        options:
          filter:
            _and:
              - read_transformer_dga_telemetry:
                  c2h2_ppm:
                    _lte: 2.0
              - read_transformer_dga_telemetry:
                  tdcg_ppm:
                    _lte: 720.0
        position_x: 20
        position_y: 1

      - key: mark_dga_normal_monitored
        name: "Certify Normal Monitored Status per IEEE C57.104"
        type: item-update
        options:
          collection: aes_transformer_dga_telemetry
          key: "{{$trigger.key}}"
          data:
            status: normal_monitored
            duval_fault_zone: normal_no_fault
        position_x: 40
        position_y: 1

      - key: notify_dga_normal_status
        name: "Notify Substation Supervisor of Normal DGA Telemetry"
        type: notification
        options:
          recipient: "SUBSTATION_ELECTRICAL_SUPERVISOR"
          subject: "GSU Transformer {{read_transformer_dga_telemetry.transformer_tag}} DGA Telemetry Normal"
          message: "Dissolved gas concentrations within IEEE C57.104 Condition 1 limits (C2H2 <= 2.0 ppm, TDCG <= 720 ppm). GSU transformer certified in normal monitored state."
        position_x: 60
        position_y: 1

      - key: reject_dga_arcing_fault
        name: "Classify D2 High-Energy Arcing Fault & Trip Interlock"
        type: item-update
        options:
          collection: aes_transformer_dga_telemetry
          key: "{{$trigger.key}}"
          data:
            status: critical_dga_fault_detected
            duval_fault_zone: D2_HIGH_ENERGY_ARCING
        position_x: 40
        position_y: 15

      - key: create_dga_urgent_task
        name: "Dispatch Emergency DGA Inspection Task"
        type: item-create
        options:
          collection: hse_tasks
          data:
            task_title: "Emergency DGA Resampling & Buchholz Relay Inspection - {{read_transformer_dga_telemetry.transformer_tag}}"
            unit_tag: "{{read_transformer_dga_telemetry.transformer_tag}}"
            priority: critical
            status: assigned
            assigned_to: "Lead_Substation_Engineer"
            deadline_hours: 2
        position_x: 60
        position_y: 15

      - key: create_dga_capa_action
        name: "Create High-Priority DGA Arcing CAPA"
        type: item-create
        options:
          collection: grc_actions
          data:
            title: "IEEE C57.104 DGA Arcing Investigation: {{read_transformer_dga_telemetry.transformer_tag}}"
            source_module: transformer_dga
            action_category: asset_integrity
            priority: critical
            status: open
            description: "Acetylene (C2H2) {{read_transformer_dga_telemetry.c2h2_ppm}} ppm or TDCG {{read_transformer_dga_telemetry.tdcg_ppm}} ppm exceeded IEEE C57.104 thresholds. Duval Triangle diagnosis indicates D2 High-Energy Arcing."
        position_x: 80
        position_y: 15

      - key: notify_dga_arcing_alert
        name: "Alert Electrical Superintendent of Critical DGA Arcing"
        type: notification
        options:
          recipient: "ELECTRICAL_MAINTENANCE_SUPERINTENDENT"
          subject: "CRITICAL DGA TRIP INTERLOCK: High-Energy Arcing on {{read_transformer_dga_telemetry.transformer_tag}}"
          message: "C2H2={{read_transformer_dga_telemetry.c2h2_ppm}} ppm, TDCG={{read_transformer_dga_telemetry.tdcg_ppm}} ppm. Duval Triangle D2 arcing detected. Urgent task and CAPA dispatched."
        position_x: 100
        position_y: 15

    edges:
      - ["$trigger", "read_transformer_dga_telemetry", "resolve"]
      - ["read_transformer_dga_telemetry", "verify_dga_ieee_thresholds", "resolve"]
      - ["verify_dga_ieee_thresholds", "mark_dga_normal_monitored", "resolve"]
      - ["mark_dga_normal_monitored", "notify_dga_normal_status", "resolve"]
      - ["verify_dga_ieee_thresholds", "reject_dga_arcing_fault", "reject"]
      - ["reject_dga_arcing_fault", "create_dga_urgent_task", "resolve"]
      - ["create_dga_urgent_task", "create_dga_capa_action", "resolve"]
      - ["create_dga_capa_action", "notify_dga_arcing_alert", "resolve"]

  - key: aes-nerc-cip-010-baseline-drift-gate
    name: "NERC CIP-007 / CIP-010 BES Cyber System Configuration Baseline Drift & Maker-Checker Patch Gate"
    description: "Verifies OT relay, DCS, and RTU cyber asset firmware configuration baseline cryptographic integrity (SHA-256) and enforces Maker-Checker Segregation of Duties (requester != approver) before authorizing deployment inside the Electronic Security Perimeter (ESP)."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - aes_nerc_cip_assets
      filter:
        status:
          _eq: baseline_verification_requested
    nodes:
      - key: read_nerc_cip_asset
        name: "Read BES Cyber Asset & Cryptographic Baseline Record"
        type: item-read
        options:
          collection: aes_nerc_cip_assets
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - cyber_asset_tag
              - esp_zone
              - firmware_version
              - baseline_sha256
              - observed_sha256
              - patch_approval_id
              - requester_id
              - approver_id
              - status
        position_x: 1
        position_y: 1

      - key: verify_cip_baseline_and_sod
        name: "Verify Cryptographic Baseline Hash Parity & Maker-Checker SoD"
        type: condition
        options:
          filter:
            _and:
              - read_nerc_cip_asset:
                  baseline_sha256:
                    _eq: "{{read_nerc_cip_asset.observed_sha256}}"
              - read_nerc_cip_asset:
                  requester_id:
                    _neq: "{{read_nerc_cip_asset.approver_id}}"
        position_x: 20
        position_y: 1

      - key: authorize_esp_deployment
        name: "Authorize Deployment Inside Electronic Security Perimeter"
        type: item-update
        options:
          collection: aes_nerc_cip_assets
          key: "{{$trigger.key}}"
          data:
            status: esp_deployment_authorized
        position_x: 40
        position_y: 1

      - key: notify_esp_authorization
        name: "Notify Approver of Verified Baseline & ESP Authorization"
        type: notification
        options:
          recipient: "{{read_nerc_cip_asset.approver_id}}"
          subject: "NERC CIP Clearance: {{read_nerc_cip_asset.cyber_asset_tag}} Cleared for ESP Deployment"
          message: "Cryptographic baseline hash verified and Maker-Checker SoD confirmed. Patch deployment into ESP Zone {{read_nerc_cip_asset.esp_zone}} authorized."
        position_x: 60
        position_y: 1

      - key: quarantine_baseline_drift
        name: "Quarantine Asset Due to Baseline Drift or SoD Violation"
        type: item-update
        options:
          collection: aes_nerc_cip_assets
          key: "{{$trigger.key}}"
          data:
            status: quarantined_baseline_drift
        position_x: 40
        position_y: 15

      - key: create_cip_security_incident_capa
        name: "Create NERC CIP Cyber Security Incident CAPA"
        type: item-create
        options:
          collection: grc_actions
          data:
            title: "NERC CIP-010 Baseline Drift / SoD Incident: {{read_nerc_cip_asset.cyber_asset_tag}}"
            source_module: nerc_cip_compliance
            action_category: cyber_security
            priority: critical
            status: open
            description: "Configuration baseline mismatch (observed SHA-256 differs from approved baseline) or Maker-Checker SoD violation on BES Cyber Asset {{read_nerc_cip_asset.cyber_asset_tag}} in ESP Zone {{read_nerc_cip_asset.esp_zone}}."
        position_x: 60
        position_y: 15

      - key: notify_cip_drift_incident
        name: "Alert OT Security Officer of Unauthorized Drift"
        type: notification
        options:
          recipient: "OT_SECURITY_OFFICER"
          subject: "CRITICAL NERC CIP GATE REJECTION: {{read_nerc_cip_asset.cyber_asset_tag}} Quarantined"
          message: "Cryptographic hash mismatch or SoD collision detected. Cyber asset quarantined and security incident CAPA logged."
        position_x: 80
        position_y: 15

    edges:
      - ["$trigger", "read_nerc_cip_asset", "resolve"]
      - ["read_nerc_cip_asset", "verify_cip_baseline_and_sod", "resolve"]
      - ["verify_cip_baseline_and_sod", "authorize_esp_deployment", "resolve"]
      - ["authorize_esp_deployment", "notify_esp_authorization", "resolve"]
      - ["verify_cip_baseline_and_sod", "quarantine_baseline_drift", "reject"]
      - ["quarantine_baseline_drift", "create_cip_security_incident_capa", "resolve"]
      - ["create_cip_security_incident_capa", "notify_cip_drift_incident", "resolve"]

  - key: aes-boiler-heat-rate-ptc4-optimization
    name: "ASME PTC 4.1 CFB Boiler Net Heat Rate & Condenser Vacuum Degradation Recovery Flow"
    description: "Evaluates CFB Boiler net heat rate against thermal efficiency benchmark (<= 9850 kJ/kWh) and verifies condenser backpressure. Passing tests certify unit heat-rate efficiency; degraded performance triggers targeted sootblowing dispatch and condenser tube descaling work item in hse_tasks."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - aes_generation_units
      filter:
        status:
          _eq: performance_test_completed
    nodes:
      - key: read_generation_unit_performance
        name: "Read Generation Unit Performance & Heat Rate Data"
        type: item-read
        options:
          collection: aes_generation_units
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - unit_id
              - net_heat_rate_kj_kwh
              - condenser_backpressure_mbar
              - boiler_availability_pct
              - turbine_availability_pct
              - status
        position_x: 1
        position_y: 1

      - key: verify_heat_rate_and_vacuum_limits
        name: "Verify ASME PTC 4.1 Heat Rate <= 9850 kJ/kWh & Vacuum Integrity"
        type: condition
        options:
          filter:
            _and:
              - read_generation_unit_performance:
                  net_heat_rate_kj_kwh:
                    _lte: 9850.0
              - read_generation_unit_performance:
                  condenser_backpressure_mbar:
                    _lte: 85.0
        position_x: 20
        position_y: 1

      - key: certify_unit_efficiency
        name: "Certify Thermal Unit Efficiency & Heat Rate Compliance"
        type: item-update
        options:
          collection: aes_generation_units
          key: "{{$trigger.key}}"
          data:
            status: efficiency_certified_compliant
            efficiency_certified: true
        position_x: 40
        position_y: 1

      - key: notify_efficiency_certified
        name: "Notify Performance Engineer of Certified Thermal Efficiency"
        type: notification
        options:
          recipient: "PLANT_PERFORMANCE_ENGINEER"
          subject: "Unit {{read_generation_unit_performance.unit_id}} Heat Rate & Condenser Efficiency Certified"
          message: "Net heat rate {{read_generation_unit_performance.net_heat_rate_kj_kwh}} kJ/kWh satisfies ASME PTC 4.1 efficiency design benchmark. Condenser vacuum compliant."
        position_x: 60
        position_y: 1

      - key: flag_efficiency_degradation
        name: "Flag Heat Rate Degradation & Vacuum Deficiency"
        type: item-update
        options:
          collection: aes_generation_units
          key: "{{$trigger.key}}"
          data:
            status: heat_rate_degraded_remediation_required
            efficiency_certified: false
            alert_flag: heat_rate_or_condenser_vacuum_degraded
        position_x: 40
        position_y: 15

      - key: create_sootblowing_and_tube_cleaning_task
        name: "Dispatch Targeted Sootblowing & Condenser Cleaning Task"
        type: item-create
        options:
          collection: hse_tasks
          data:
            task_title: "CFB Intelligent Sootblowing & Condenser Waterbox Ball Cleaning: Unit {{read_generation_unit_performance.unit_id}}"
            unit_tag: "{{read_generation_unit_performance.unit_id}}"
            priority: high
            status: assigned
            assigned_to: "Boiler_Efficiency_Specialist"
            deadline_hours: 8
        position_x: 60
        position_y: 15

      - key: notify_degradation_alert
        name: "Alert Performance Team of Efficiency Recovery Dispatch"
        type: notification
        options:
          recipient: "PLANT_PERFORMANCE_ENGINEER"
          subject: "EFFICIENCY DEGRADATION ALERT: Unit {{read_generation_unit_performance.unit_id}} Heat Rate Exceeded"
          message: "Net heat rate {{read_generation_unit_performance.net_heat_rate_kj_kwh}} kJ/kWh > 9850 kJ/kWh. Automated sootblowing & condenser ball cleaning task created."
        position_x: 80
        position_y: 15

    edges:
      - ["$trigger", "read_generation_unit_performance", "resolve"]
      - ["read_generation_unit_performance", "verify_heat_rate_and_vacuum_limits", "resolve"]
      - ["verify_heat_rate_and_vacuum_limits", "certify_unit_efficiency", "resolve"]
      - ["certify_unit_efficiency", "notify_efficiency_certified", "resolve"]
      - ["verify_heat_rate_and_vacuum_limits", "flag_efficiency_degradation", "reject"]
      - ["flag_efficiency_degradation", "create_sootblowing_and_tube_cleaning_task", "resolve"]
      - ["create_sootblowing_and_tube_cleaning_task", "notify_degradation_alert", "resolve"]

  - key: aes-iso50001-ghg-scope1-reconciliation
    name: "ISO 50001 & GHG Scope 1 Thermal Carbon Intensity & Emission Quota Gate"
    description: "Surveils thermal power carbon intensity (kg CO2 per kWh net generation) against statutory environmental allocation limits under ISO 50001 and Decree 06/2022/ND-CP. Compliant ledgers are locked as verified; quota overages trigger mandatory fuel-blend and combustion optimization CAPA in grc_actions."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - aes_ghg_emission_ledgers
      filter:
        verification_status:
          _eq: pending_reconciliation
    nodes:
      - key: read_ghg_emission_ledger
        name: "Read Thermal Generation GHG Scope 1 Ledger"
        type: item-read
        options:
          collection: aes_ghg_emission_ledgers
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - reporting_period
              - unit_tag
              - coal_consumed_tons
              - net_generation_mwh
              - co2_tons
              - carbon_intensity_kg_kwh
              - quota_limit_kg_kwh
              - verification_status
        position_x: 1
        position_y: 1

      - key: verify_ghg_quota_compliance
        name: "Verify ISO 50001 Carbon Intensity Quota Compliance"
        type: condition
        options:
          filter:
            read_ghg_emission_ledger:
              carbon_intensity_kg_kwh:
                _lte: "{{read_ghg_emission_ledger.quota_limit_kg_kwh}}"
        position_x: 20
        position_y: 1

      - key: lock_verified_ghg_ledger
        name: "Lock Verified & Quota-Compliant GHG Ledger"
        type: item-update
        options:
          collection: aes_ghg_emission_ledgers
          key: "{{$trigger.key}}"
          data:
            verification_status: verified_quota_compliant
        position_x: 40
        position_y: 1

      - key: notify_ghg_reconciliation_cleared
        name: "Notify Environmental Director of Cleared Reconciliation"
        type: notification
        options:
          recipient: "ENVIRONMENTAL_COMPLIANCE_DIRECTOR"
          subject: "GHG Scope 1 Verified: Period {{read_ghg_emission_ledger.reporting_period}} Compliant"
          message: "Carbon intensity {{read_ghg_emission_ledger.carbon_intensity_kg_kwh}} kg CO2/kWh is within statutory quota {{read_ghg_emission_ledger.quota_limit_kg_kwh}} kg CO2/kWh. Ledger locked."
        position_x: 60
        position_y: 1

      - key: quarantine_ghg_quota_overage
        name: "Quarantine GHG Ledger Due to Quota Overage"
        type: item-update
        options:
          collection: aes_ghg_emission_ledgers
          key: "{{$trigger.key}}"
          data:
            verification_status: quota_exceeded_capa_required
        position_x: 40
        position_y: 15

      - key: create_fuel_combustion_optimization_capa
        name: "Create Fuel Combustion & Blend Optimization CAPA"
        type: item-create
        options:
          collection: grc_actions
          data:
            title: "GHG Scope 1 Quota Exceedance Remediation - Unit {{read_ghg_emission_ledger.unit_tag}}"
            source_module: ghg_reconciliation
            action_category: statutory_compliance
            priority: high
            status: open
            description: "Carbon intensity {{read_ghg_emission_ledger.carbon_intensity_kg_kwh}} kg/kWh exceeded quota {{read_ghg_emission_ledger.quota_limit_kg_kwh}} kg/kWh during {{read_ghg_emission_ledger.reporting_period}}. Mandatory fuel-blend ratio adjustment and excess air combustion optimization required."
        position_x: 60
        position_y: 15

      - key: notify_ghg_quota_breach
        name: "Alert Environmental Director of Quota Exceedance"
        type: notification
        options:
          recipient: "ENVIRONMENTAL_COMPLIANCE_DIRECTOR"
          subject: "ALERT: GHG Scope 1 Emission Quota Exceeded for {{read_ghg_emission_ledger.reporting_period}}"
          message: "Carbon intensity {{read_ghg_emission_ledger.carbon_intensity_kg_kwh}} kg/kWh exceeded limit {{read_ghg_emission_ledger.quota_limit_kg_kwh}} kg/kWh. Corrective CAPA created."
        position_x: 80
        position_y: 15

    edges:
      - ["$trigger", "read_ghg_emission_ledger", "resolve"]
      - ["read_ghg_emission_ledger", "verify_ghg_quota_compliance", "resolve"]
      - ["verify_ghg_quota_compliance", "lock_verified_ghg_ledger", "resolve"]
      - ["lock_verified_ghg_ledger", "notify_ghg_reconciliation_cleared", "resolve"]
      - ["verify_ghg_quota_compliance", "quarantine_ghg_quota_overage", "reject"]
      - ["quarantine_ghg_quota_overage", "create_fuel_combustion_optimization_capa", "resolve"]
      - ["create_fuel_combustion_optimization_capa", "notify_ghg_quota_breach", "resolve"]

  - key: aes-ptw-hazop-lopa-evaluation
    name: "PTW-AES HAZOP Deviation & LOPA Independent Protection Layer (IPL) Risk Evaluation Flow"
    description: "Governs PTW-AES HAZOP & LOPA hazard evaluation studies (hse_hazop_studies): verifies Facilitator and Approver Segregation of Duties (facilitator != approved_by) and LOPA Independent Protection Layer (IPL) evidence before approving HAZOP study for PTW-AES execution."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - hse_hazop_studies
      filter:
        status:
          _eq: review_submitted
    nodes:
      - key: read_hazop_lopa_study
        name: "Read PTW-AES HAZOP & LOPA Study Dossier"
        type: item-read
        options:
          collection: hse_hazop_studies
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - title
              - identifier
              - status
              - facilitator
              - approved_by
              - approval_evidence
        position_x: 1
        position_y: 1

      - key: verify_hazop_lopa_sod_and_evidence
        name: "Verify Facilitator != Approver SoD & LOPA IPL Evidence"
        type: condition
        options:
          filter:
            _and:
              - read_hazop_lopa_study:
                  facilitator:
                    _nnull: true
              - read_hazop_lopa_study:
                  approved_by:
                    _nnull: true
              - read_hazop_lopa_study:
                  facilitator:
                    _neq: "{{read_hazop_lopa_study.approved_by}}"
              - read_hazop_lopa_study:
                  approval_evidence:
                    _nnull: true
        position_x: 20
        position_y: 1

      - key: approve_hazop_lopa_study
        name: "Approve PTW-AES HAZOP & LOPA Study"
        type: item-update
        options:
          collection: hse_hazop_studies
          key: "{{$trigger.key}}"
          data:
            status: approved
        position_x: 40
        position_y: 1

      - key: notify_hazop_lopa_approved
        name: "Notify PTW-AES Facilitator & CBO of Approved HAZOP/LOPA"
        type: notification
        options:
          recipient: "{{read_hazop_lopa_study.facilitator}}"
          subject: "PTW-AES HAZOP/LOPA Approved: {{read_hazop_lopa_study.identifier}}"
          message: "HAZOP deviation analysis and LOPA Independent Protection Layer (IPL) credits verified with strict Maker-Checker SoD."
        position_x: 60
        position_y: 1

      - key: reject_hazop_lopa_study
        name: "Reject HAZOP/LOPA Due to SoD Collision or Missing IPL Evidence"
        type: item-update
        options:
          collection: hse_hazop_studies
          key: "{{$trigger.key}}"
          data:
            status: rejected_incomplete_lopa
        position_x: 40
        position_y: 15

      - key: notify_hazop_lopa_rejected
        name: "Alert Facilitator of HAZOP/LOPA Rejection"
        type: notification
        options:
          recipient: "{{read_hazop_lopa_study.facilitator}}"
          subject: "PTW-AES HAZOP/LOPA Rejected: {{read_hazop_lopa_study.identifier}}"
          message: "HAZOP/LOPA study rejected due to Facilitator == Approver SoD violation or missing LOPA IPL verification evidence."
        position_x: 60
        position_y: 15

    edges:
      - ["$trigger", "read_hazop_lopa_study", "resolve"]
      - ["read_hazop_lopa_study", "verify_hazop_lopa_sod_and_evidence", "resolve"]
      - ["verify_hazop_lopa_sod_and_evidence", "approve_hazop_lopa_study", "resolve"]
      - ["approve_hazop_lopa_study", "notify_hazop_lopa_approved", "resolve"]
      - ["verify_hazop_lopa_sod_and_evidence", "reject_hazop_lopa_study", "reject"]
      - ["reject_hazop_lopa_study", "notify_hazop_lopa_rejected", "resolve"]

  - key: aes-ptw-simops-plot-plant-gate
    name: "PTW-AES SIMOPS & Plot Plant Spatial Conflict Matrix Governance Flow"
    description: "Evaluates Simultaneous Operations (SIMOPS) spatial conflicts on the AES Plot Plant map (aes_ptw_simops): requires Central Board Operator (CBO) control measures and signoff before clearing conflicting PTW-AES permits."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - aes_ptw_simops
      filter:
        conflict_status:
          _in:
            - conflict
            - pending_cbo_review
    nodes:
      - key: read_simops_dossier
        name: "Read PTW-AES Plot Plant SIMOPS Conflict Record"
        type: item-read
        options:
          collection: aes_ptw_simops
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - title
              - permit
              - conflict_status
              - approved_by
              - controls
              - conflicting_permits
        position_x: 1
        position_y: 1

      - key: verify_simops_cbo_controls
        name: "Verify CBO Approval & SIMOPS Spatial Barrier Controls"
        type: condition
        options:
          filter:
            _and:
              - read_simops_dossier:
                  approved_by:
                    _nnull: true
              - read_simops_dossier:
                  controls:
                    _nnull: true
        position_x: 20
        position_y: 1

      - key: clear_simops_to_controlled
        name: "Update PTW-AES SIMOPS Status to Controlled"
        type: item-update
        options:
          collection: aes_ptw_simops
          key: "{{$trigger.key}}"
          data:
            conflict_status: controlled
        position_x: 40
        position_y: 1

      - key: notify_simops_controlled
        name: "Notify CBO & WPH of Cleared Plot Plant SIMOPS"
        type: notification
        options:
          recipient: "{{read_simops_dossier.approved_by}}"
          subject: "PTW-AES SIMOPS Controlled on Plot Plant: {{read_simops_dossier.title}}"
          message: "Simultaneous Operations (SIMOPS) spatial conflict mitigated and approved by CBO on Plot Plant."
        position_x: 60
        position_y: 1

      - key: hold_uncontrolled_simops
        name: "Hold Conflicting Permit Pending Plot Plant SIMOPS Controls"
        type: item-update
        options:
          collection: aes_ptw_simops
          key: "{{$trigger.key}}"
          data:
            conflict_status: conflict_hold_unmitigated
        position_x: 40
        position_y: 15

      - key: notify_simops_conflict_hold
        name: "Alert CBO of Unmitigated Plot Plant SIMOPS Conflict"
        type: notification
        options:
          recipient: "AES_CBO_SHIFT_SUPERVISOR"
          subject: "PTW-AES PLOT PLANT SIMOPS HOLD: {{read_simops_dossier.title}}"
          message: "Overlapping work radii detected on Plot Plant without approved SIMOPS barrier controls. Permit remains on hold."
        position_x: 60
        position_y: 15

    edges:
      - ["$trigger", "read_simops_dossier", "resolve"]
      - ["read_simops_dossier", "verify_simops_cbo_controls", "resolve"]
      - ["verify_simops_cbo_controls", "clear_simops_to_controlled", "resolve"]
      - ["clear_simops_to_controlled", "notify_simops_controlled", "resolve"]
      - ["verify_simops_cbo_controls", "hold_uncontrolled_simops", "reject"]
      - ["hold_uncontrolled_simops", "notify_simops_conflict_hold", "resolve"]

  - key: aes-ptw-csp-hwp-condition-monitoring
    name: "PTW-AES CSP & HWP Entry Point Condition Monitoring (LEL / H2S / NH3 / O2 / CO) Validity Flow (No Hardware Interlock)"
    description: "Evaluates periodic Condition Monitoring inputs (LEL, H2S, NH3, O2, CO) logged by the Gas Tester at Entry Points of Confined Space Permits (CSP - aes_ptw_csp) and Hot Work Permits (HWP - aes_ptw_hwp) linked to PTW-AES. Updates permit entry-point validity (condition_status: actived vs invalided and valid_end_at per interval) as an administrative permit validity control without any hardware trip interlock."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - aes_ptw_csp
        - aes_ptw_hwp
      filter:
        status:
          _in:
            - condition_monitoring_logged
            - approved
    nodes:
      - key: read_csp_hwp_entry_condition
        name: "Read PTW-AES CSP/HWP Entry Point Condition Monitoring Input"
        type: item-read
        options:
          collection: aes_ptw_csp
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - title
              - permit
              - status
              - approved_by
              - evidence
              - entry_details
              - lel_pct
              - h2s_ppm
              - nh3_ppm
              - o2_pct
              - co_ppm
              - interval_hours
        position_x: 1
        position_y: 1

      - key: evaluate_entry_point_gas_condition
        name: "Evaluate Entry Point Condition Monitoring Envelope (LEL < 10%, O2 19.5-23.5%, H2S < 10, NH3 < 25, CO < 25 — No Interlock)"
        type: condition
        options:
          filter:
            _and:
              - read_csp_hwp_entry_condition:
                  lel_pct:
                    _lt: 10.0
              - read_csp_hwp_entry_condition:
                  o2_pct:
                    _gte: 19.5
              - read_csp_hwp_entry_condition:
                  o2_pct:
                    _lte: 23.5
              - read_csp_hwp_entry_condition:
                  h2s_ppm:
                    _lt: 10.0
              - read_csp_hwp_entry_condition:
                  nh3_ppm:
                    _lt: 25.0
              - read_csp_hwp_entry_condition:
                  co_ppm:
                    _lt: 25.0
        position_x: 20
        position_y: 1

      - key: extend_permit_condition_validity
        name: "Update CSP/HWP Entry Point Condition Status to Actived (Extend validEndAt)"
        type: item-update
        options:
          collection: aes_ptw_csp
          key: "{{$trigger.key}}"
          data:
            status: approved
            condition_status: actived
            valid_end_at: "{{$NOW}}"
        position_x: 40
        position_y: 1

      - key: notify_condition_monitoring_actived
        name: "Notify Gas Tester & WPH of Entry Point Condition Validity Extension"
        type: notification
        options:
          recipient: "{{read_csp_hwp_entry_condition.approved_by}}"
          subject: "PTW-AES CSP/HWP Entry Point Condition Monitoring Actived: {{read_csp_hwp_entry_condition.title}}"
          message: "Entry point Condition Monitoring readings (LEL={{read_csp_hwp_entry_condition.lel_pct}}%, O2={{read_csp_hwp_entry_condition.o2_pct}}%, H2S={{read_csp_hwp_entry_condition.h2s_ppm}} ppm, NH3={{read_csp_hwp_entry_condition.nh3_ppm}} ppm, CO={{read_csp_hwp_entry_condition.co_ppm}} ppm) are within safe limits. Permit validity extended for next interval (no hardware interlock)."
        position_x: 60
        position_y: 1

      - key: mark_permit_condition_invalided
        name: "Mark CSP/HWP Entry Point Condition Status Invalided (Advisory Permit Validity — No Interlock)"
        type: item-update
        options:
          collection: aes_ptw_csp
          key: "{{$trigger.key}}"
          data:
            condition_status: invalided
        position_x: 40
        position_y: 15

      - key: notify_condition_monitoring_invalided
        name: "Notify WPH, Watchman & CBO of Invalided Entry Point Condition Monitoring"
        type: notification
        options:
          recipient: "{{read_csp_hwp_entry_condition.approved_by}}"
          subject: "PTW-AES CSP/HWP Condition Monitoring Invalided: {{read_csp_hwp_entry_condition.title}}"
          message: "Entry point Condition Monitoring input (LEL/H2S/NH3/O2/CO) exceeded administrative permit validity window on CSP/HWP. Permit validity marked invalided for ventilation & re-test by Gas Tester (no hardware trip interlock)."
        position_x: 60
        position_y: 15

    edges:
      - ["$trigger", "read_csp_hwp_entry_condition", "resolve"]
      - ["read_csp_hwp_entry_condition", "evaluate_entry_point_gas_condition", "resolve"]
      - ["evaluate_entry_point_gas_condition", "extend_permit_condition_validity", "resolve"]
      - ["extend_permit_condition_validity", "notify_condition_monitoring_actived", "resolve"]
      - ["evaluate_entry_point_gas_condition", "mark_permit_condition_invalided", "reject"]
      - ["mark_permit_condition_invalided", "notify_condition_monitoring_invalided", "resolve"]

rules:
  - rule_id: AES-LOTO-001
    name: "Zero Voltage & Earth Switch Requirement"
    description: "Switchgear above 1kV must have breakers racked out and earth switches mechanically latched before lockbox closure."
    severity: critical
    condition: "breaker_racked_out == true && earth_switch_closed == true"
    enforcement: strict_rejection
    action: "Block isolation authorization and trigger SCE inspection."

  - rule_id: AES-CEMS-002
    name: "TCVN 7440 Flue Gas SO2 Emission Cap"
    description: "Continuous stack emissions of sulfur dioxide must not exceed 500 mg/Nm3 hourly average."
    severity: high
    condition: "so2_instantaneous <= 500.0"
    enforcement: escalation
    action: "Increase FGD limestone slurry circulation and log environmental anomaly."

  - rule_id: AES-RAMP-003
    name: "ASME Section I Boiler Thermal Ramp Limit"
    description: "Boiler drum metal temperature rise rate must remain at or below 55°C per hour to prevent CIWH water hammer."
    severity: critical
    condition: "drum_temperature_rate_c_hr <= 55.0"
    enforcement: strict_rejection
    action: "Trigger fuel firing interlock hold and dispatch emergency inspection."

  - rule_id: AES-CONT-004
    name: "Contractor Heavy Equipment Safety Certification Gate"
    description: "Mobile cranes and pressure vessels must possess current third-party statutory inspection certificates prior to PTW issuance."
    severity: high
    condition: "crane_load_test_valid == true && pressure_vessel_cert_valid == true"
    enforcement: strict_rejection
    action: "Block PTW creation and notify site access security."

  - rule_id: AES-DGA-004
    name: "IEEE C57.104 Transformer Dissolved Gas & Duval Limit"
    description: "Acetylene (C2H2) must remain <= 2.0 ppm and Total Dissolved Combustible Gas (TDCG) <= 720 ppm to prevent arcing flashover in GSU transformers."
    severity: critical
    condition: "c2h2_ppm <= 2.0"
    enforcement: strict_rejection
    action: "Trigger immediate GSU transformer isolation review and dispatch urgent gas chromatography sampling."

  - rule_id: AES-CIP-005
    name: "NERC CIP-010 OT Configuration Baseline Hash Parity"
    description: "Observed firmware and relay logic SHA-256 hash must strictly equal the authorized baseline hash prior to Electronic Security Perimeter deployment."
    severity: critical
    condition: "baseline_sha256 == observed_sha256"
    enforcement: strict_rejection
    action: "Quarantine unauthorized cyber asset drift and open high-priority security incident CAPA."

