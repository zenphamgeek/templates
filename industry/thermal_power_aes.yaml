          type: uuid
        - field: reporting_period
          type: string
        - field: unit_tag
          type: string
        - field: coal_consumed_tons
          type: float
        - field: net_generation_mwh
          type: float
        - field: co2_tons
          type: float
        - field: carbon_intensity_kg_kwh
          type: float
        - field: quota_limit_kg_kwh
          type: float
        - field: verification_status
          type: string

    - collection: hse_hazop_studies
      name: "PTW-AES HAZOP & LOPA Process Hazard Studies"
      description: "HAZOP node deviations and Layer of Protection Analysis (LOPA) Independent Protection Layers (IPL) owned by PTW-AES."
      fields:
        - field: id
          type: uuid
        - field: title
          type: string
        - field: identifier
          type: string
        - field: status
          type: string
        - field: facilitator
          type: uuid
        - field: approved_by
          type: uuid
        - field: approval_evidence
          type: text

    - collection: aes_ptw_simops
      name: "PTW-AES SIMOPS & Plot Plant Conflict Matrix"
      description: "Simultaneous Operations (SIMOPS) spatial conflict detection on the AES Plot Plant map and CBO control authorization."
      fields:
