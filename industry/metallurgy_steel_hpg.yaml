template_id: metallurgy_steel_hpg
version: 1.0.0
industry_vertical: mining_metals
archetype: "Hoa Phat Dung Quat Steel Complex Archetype"

metadata:
  name: "Hoa Phat Dung Quat Integrated Steel Complex Resilience Template"
  description: "Operational resilience, blast furnace tapping safety, molten ladle tracking, and toxic carbon monoxide (CO) gas interlocks for integrated blast furnace-basic oxygen furnace (BF-BOF) steelmaking complexes."
  status: VERIFIED
  author: "Industry Template Architect & Metallurgy Specialist"
  approver: "Zen Phạm"
  created_at: "2026-10-04"
  tags:
    - metallurgy
    - steel
    - blast_furnace
    - bof_converter
    - molten_ladle
    - co_gas_safety
    - oee
  regulatory_frameworks:
    - "TCVN 6556:1999 Safety in Metallurgy and Hot Metal Casting"
    - "OSHA 1910.146 Permit-Required Confined Spaces & Hazardous Atmospheres"
    - "TCVN 5178:2004 Technical Safety Regulations in Smelting and Molten Metal Processing"
    - "ISO 45001:2018 Occupational Health and Safety Management"

taxonomy_and_fields:
  collections:
    - collection: hpg_hot_metal_permits
      name: "Hot Metal Tapping & Teeming Permits"
      description: "Permits authorizing hot liquid iron tapping from blast furnaces into torpedo/steel ladles."
      fields:
        - field: id
          type: uuid
        - field: permit_no
          type: string
        - field: blast_furnace_id
          type: string
        - field: tap_hole_no
          type: string
        - field: status
          type: string
        - field: gas_co_ppm
          type: float
        - field: gas_o2_percent
          type: float
        - field: ladle_id
          type: uuid
        - field: ladle_shell_temp_c
          type: float
        - field: work_authorized
          type: boolean
        - field: rejection_reason
          type: text

    - collection: hpg_gas_monitoring
      name: "Cast House & Converter CO Gas Telemetry"
      description: "Continuous toxic CO gas and oxygen atmospheric sensors across cast house and BOF converter floors."
      fields:
        - field: id
          type: uuid
        - field: sensor_tag
          type: string
        - field: zone_code
          type: string
        - field: co_instantaneous_ppm
          type: float
        - field: o2_percentage
          type: float
        - field: alarm_level
          type: string
        - field: timestamp
          type: timestamp

    - collection: hpg_ladle_tracking
      name: "Molten Steel Ladle Fleet Tracking"
      description: "Thermal integrity, refractory lining campaign heats, and weight telemetry of molten metal ladles."
      fields:
        - field: id
          type: uuid
        - field: ladle_code
          type: string
        - field: refractory_heat_count
          type: integer
        - field: shell_surface_temp_c
          type: float
        - field: tare_weight_mt
          type: float
        - field: gross_weight_mt
          type: float
        - field: status
          type: string

    - collection: hpg_plant_kpis
      name: "HPG Steel Complex Performance KPIs"
      description: "Aggregated ironmaking and steelmaking operational resilience metrics."
      fields:
        - field: id
          type: uuid
        - field: recorded_date
          type: date
        - field: crude_steel_output_mt
          type: float
        - field: bf_fuel_rate_kg_t
          type: float
        - field: overall_equipment_effectiveness
          type: float
        - field: co_alarms_count
          type: integer

    - collection: hpg_blast_furnace_telemetry
      name: "Blast Furnace Hearth & Stave Cooling Telemetry"
      description: "Hearth carbon brick thermocouples, cooling stave water flow, and delta-T interlock telemetry."
      fields:
        - field: id
          type: uuid
        - field: furnace_tag
          type: string
        - field: hearth_bottom_temp_c
          type: float
        - field: hearth_sidewall_temp_c
          type: float
        - field: stave_cooling_delta_t_c
          type: float
        - field: cooling_water_flow_m3_hr
          type: float
        - field: stave_booster_pump_status
          type: string
        - field: cooling_interlock_status
          type: string
        - field: timestamp
          type: timestamp

    - collection: hpg_torpedo_ladle_operations
      name: "Torpedo Ladle Car & Trackway Operations"
      description: "Moisture prevention, refractory preheat temperature, and trackway pit water entrapment tracking."
      fields:
        - field: id
          type: uuid
        - field: car_no
          type: string
        - field: track_pit_id
          type: string
        - field: refractory_temp_c
          type: float
        - field: pit_water_detected
          type: boolean
        - field: sump_sensor_status
          type: string
        - field: trackway_clearance
          type: boolean
        - field: status
          type: string
        - field: work_authorized
          type: boolean
        - field: rejection_reason
          type: text
        - field: timestamp
          type: timestamp

    - collection: hpg_radiation_source_permits
      name: "CCM Mold Radiation Source LOTO Permits"
      description: "Co-60 and Cs-137 radioactive level gauge shutter locking, dosimetry, and exclusion permits."
      fields:
        - field: id
          type: uuid
        - field: permit_no
          type: string
        - field: ccm_id
          type: string
        - field: source_isotope
          type: string
        - field: shutter_closed
          type: boolean
        - field: padlock_applied
          type: boolean
        - field: perimeter_dose_rate_usv_hr
          type: float
        - field: dosimeters_calibrated
          type: boolean
        - field: status
          type: string
        - field: work_authorized
          type: boolean
        - field: rejection_reason
          type: text

    - collection: hpg_ladle_crane_inspections
      name: "Ladle Crane ASME B30.2 Mechanical Safety Gates"
      description: "Dual-brake hoist testing, ultrasonic hook testing, and wire rope electromagnetic NDT records."
      fields:
        - field: id
          type: uuid
        - field: inspection_no
          type: string
        - field: crane_tag
          type: string
        - field: primary_brake_holding
          type: boolean
        - field: emergency_brake_holding
          type: boolean
        - field: wire_rope_ndt_valid
          type: boolean
        - field: hook_ut_valid
          type: boolean
        - field: load_test_passed
          type: boolean
        - field: status
          type: string
        - field: work_authorized
          type: boolean
        - field: rejection_reason
          type: text

  relations:
    - collection: hpg_hot_metal_permits
      field: ladle_id
      related_collection: hpg_ladle_tracking
      type: m2o

  equipment_taxonomy:
    plant_code: HPG_DUNGQUAT
    areas:
      - code: "BF_AREA"
        name: "Blast Furnace Ironmaking (BF1 - BF4)"
        systems:
          - code: "BF1"
            name: "Blast Furnace 1 (1080 m³)"
          - code: "BF2"
            name: "Blast Furnace 2 (1080 m³)"
          - code: "BF_CH"
            name: "Cast House Tapping Platforms & Mud Gun"
      - code: "BOF_AREA"
        name: "Basic Oxygen Furnace Steelmaking"
        systems:
          - code: "BOF1"
            name: "BOF Converter 1 (120 MT)"
          - code: "BOF2"
            name: "BOF Converter 2 (120 MT)"
          - code: "OG_SYS"
            name: "OG Primary Gas Cleaning & Recovery"
      - code: "CCM_AREA"
        name: "Continuous Casting Machine Fleet"
        systems:
          - code: "CCM1"
            name: "Billet Continuous Caster 1"
          - code: "CCM2"
            name: "Slab Continuous Caster 2"

business_flows:
  - key: hpg-hot-metal-ptw-approval
    name: "Hot Metal Tapping & Ladle Safety Clearance Flow"
    description: "Evaluates atmospheric CO levels, oxygen content, and ladle shell surface temperatures before authorizing blast furnace liquid iron tapping."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - hpg_hot_metal_permits
      filter:
        status:
          _eq: ptw_submitted
    nodes:
      - key: read_ptw_data
        name: "Read Hot Metal Permit Details"
        type: item-read
        options:
          collection: hpg_hot_metal_permits
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - permit_no
              - blast_furnace_id
              - gas_co_ppm
              - gas_o2_percent
              - ladle_id
              - ladle_shell_temp_c
        position_x: 1
        position_y: 1

      - key: verify_atmospheric_and_ladle_safety
        name: "Verify CO, O2 and Ladle Thermal Envelope"
        type: condition
        options:
          filter:
            _and:
              - read_ptw_data:
                  gas_co_ppm:
                    _lte: 25.0
              - read_ptw_data:
                  gas_o2_percent:
                    _gte: 19.5
              - read_ptw_data:
                  gas_o2_percent:
                    _lte: 23.5
              - read_ptw_data:
                  ladle_shell_temp_c:
                    _lte: 350.0
        position_x: 25
        position_y: 1

      - key: authorize_tapping
        name: "Authorize Hot Metal Tapping"
        type: item-update
        options:
          collection: hpg_hot_metal_permits
          key: "{{$trigger.key}}"
          data:
            status: tapping_authorized
            work_authorized: true
        position_x: 50
        position_y: 1

      - key: notify_tapping_crew
        name: "Notify Furnace Shift Supervisor of Clearance"
        type: notification
        options:
          recipient: "{{$trigger.payload.shift_foreman_id}}"
          subject: "Hot Metal Tapping Authorized: {{read_ptw_data.permit_no}} on {{read_ptw_data.blast_furnace_id}}"
          message: "Atmosphere verified (CO <= 25 ppm, O2 safe) and ladle shell <= 350°C. Clearance granted."
        position_x: 75
        position_y: 1

      - key: reject_tapping
        name: "Reject Hot Metal Tapping Due to Hazard Violation"
        type: item-update
        options:
          collection: hpg_hot_metal_permits
          key: "{{$trigger.key}}"
          data:
            status: tapping_rejected_hazard
            work_authorized: false
            rejection_reason: "Environmental or thermal safety trip: CO > 25 ppm, O2 outside 19.5-23.5%, or ladle shell temp > 350°C."
        position_x: 50
        position_y: 15

      - key: notify_safety_violation
        name: "Alert Safety Officer of Hot Metal Trip"
        type: notification
        options:
          recipient: "{{$trigger.payload.safety_engineer_id}}"
          subject: "SAFETY TRIP: Hot Metal Tapping Blocked for {{read_ptw_data.permit_no}}"
          message: "Tapping authorization denied: High CO hazard or ladle shell overheating. Inspect cast house immediately."
        position_x: 75
        position_y: 15

    edges:
      - ["$trigger", "read_ptw_data", "resolve"]
      - ["read_ptw_data", "verify_atmospheric_and_ladle_safety", "resolve"]
      - ["verify_atmospheric_and_ladle_safety", "authorize_tapping", "resolve"]
      - ["authorize_tapping", "notify_tapping_crew", "resolve"]
      - ["verify_atmospheric_and_ladle_safety", "reject_tapping", "reject"]
      - ["reject_tapping", "notify_safety_violation", "resolve"]

  - key: hpg-bof-co-evacuation-trip
    name: "Converter & Cast House Toxic CO Alarm Interlock Flow"
    description: "Monitors real-time CO gas detectors. If instantaneous CO exceeds 50 ppm, immediately escalates to toxic alarm state and broadcasts evacuation alerts."
    status: active
    accountability: system
    trigger:
      type: event
      scope:
        - items.create
        - items.update
      collections:
        - hpg_gas_monitoring
    nodes:
      - key: read_co_sensor_reading
        name: "Read Instantaneous CO Sensor Reading"
        type: item-read
        options:
          collection: hpg_gas_monitoring
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - sensor_tag
              - zone_code
              - co_instantaneous_ppm
              - alarm_level
        position_x: 1
        position_y: 1

      - key: check_co_critical_threshold
        name: "Check if CO Exceeds Critical Safety Threshold (>= 50 ppm)"
        type: condition
        options:
          filter:
            read_co_sensor_reading:
              co_instantaneous_ppm:
                _gte: 50.0
        position_x: 25
        position_y: 1

      - key: trigger_evacuation_alarm
        name: "Escalate Alarm Level to CRITICAL_EVACUATION"
        type: item-update
        options:
          collection: hpg_gas_monitoring
          key: "{{$trigger.key}}"
          data:
            alarm_level: CRITICAL_EVACUATION
        position_x: 50
        position_y: 1

      - key: broadcast_evacuation_alert
        name: "Broadcast Toxic Gas Evacuation Alert"
        type: notification
        options:
          recipient: "{{$trigger.payload.emergency_coordinator_id}}"
          subject: "TOXIC CO ALARM: Evacuate Zone {{read_co_sensor_reading.zone_code}}"
          message: "Critical CO gas concentration detected ({{read_co_sensor_reading.co_instantaneous_ppm}} ppm) at sensor {{read_co_sensor_reading.sensor_tag}}. Personnel must evacuate to muster point immediately."
        position_x: 75
        position_y: 1

      - key: log_normal_gas_state
        name: "Maintain Normal Atmosphere Status"
        type: transform
        options:
          format: json
          expression: "CO reading within normal operating envelope."
        position_x: 50
        position_y: 15

    edges:
      - ["$trigger", "read_co_sensor_reading", "resolve"]
      - ["read_co_sensor_reading", "check_co_critical_threshold", "resolve"]
      - ["check_co_critical_threshold", "trigger_evacuation_alarm", "resolve"]
      - ["trigger_evacuation_alarm", "broadcast_evacuation_alert", "resolve"]
      - ["check_co_critical_threshold", "log_normal_gas_state", "reject"]

  - key: hpg-bf-hearth-lining-cooling-interlock
    name: "Blast Furnace Hearth Lining & Stave Emergency Cooling Interlock"
    description: "Monitors hearth carbon refractory thermocouples and cooling water delta-T. If hearth temperature exceeds 380°C or delta-T exceeds 4.5°C, automatically engages stave booster pumps and throttles furnace blast."
    status: active
    accountability: system
    trigger:
      type: event
      scope:
        - items.create
        - items.update
      collections:
        - hpg_blast_furnace_telemetry
    nodes:
      - key: read_hearth_telemetry
        name: "Read Blast Furnace Hearth & Stave Temperatures"
        type: item-read
        options:
          collection: hpg_blast_furnace_telemetry
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - furnace_tag
              - hearth_bottom_temp_c
              - hearth_sidewall_temp_c
              - stave_cooling_delta_t_c
              - stave_booster_pump_status
              - cooling_interlock_status
        position_x: 1
        position_y: 1

      - key: verify_hearth_thermal_limits
        name: "Verify Hearth Temp <= 380°C and Stave Delta-T <= 4.5°C"
        type: condition
        options:
          filter:
            _and:
              - read_hearth_telemetry:
                  hearth_sidewall_temp_c:
                    _lte: 380.0
              - read_hearth_telemetry:
                  stave_cooling_delta_t_c:
                    _lte: 4.5
        position_x: 25
        position_y: 1

      - key: maintain_nominal_cooling
        name: "Maintain Nominal Stave Cooling State"
        type: transform
        options:
          format: json
          expression: "Blast furnace hearth thermal envelope within safe operational limits."
        position_x: 50
        position_y: 1

      - key: trigger_emergency_stave_cooling
        name: "Engage Emergency Stave Booster Pumps & Throttle Blast"
        type: item-update
        options:
          collection: hpg_blast_furnace_telemetry
          key: "{{$trigger.key}}"
          data:
            stave_booster_pump_status: EMERGENCY_BOOSTER_ACTIVE
            cooling_interlock_status: EMERGENCY_COOLING_ACTIVE
        position_x: 50
        position_y: 15

      - key: alert_bf_superintendent
        name: "Alert Blast Furnace Superintendent of Hearth Thermal Exceedance"
        type: notification
        options:
          recipient: "{{$trigger.payload.bf_superintendent_id}}"
          subject: "HEARTH THERMAL TRIP: Blast Furnace {{read_hearth_telemetry.furnace_tag}}"
          message: "Hearth sidewall temp ({{read_hearth_telemetry.hearth_sidewall_temp_c}}°C) or delta-T ({{read_hearth_telemetry.stave_cooling_delta_t_c}}°C) exceeded safe threshold. Emergency booster cooling engaged; throttle blast."
        position_x: 75
        position_y: 15
    edges:
      - ["$trigger", "read_hearth_telemetry", "resolve"]
      - ["read_hearth_telemetry", "verify_hearth_thermal_limits", "resolve"]
      - ["verify_hearth_thermal_limits", "maintain_nominal_cooling", "resolve"]
      - ["verify_hearth_thermal_limits", "trigger_emergency_stave_cooling", "reject"]
      - ["trigger_emergency_stave_cooling", "alert_bf_superintendent", "resolve"]

  - key: hpg-torpedo-ladle-moisture-interlock
    name: "Torpedo Ladle Moisture & Water Entrapment Anti-Explosion Interlock"
    description: "Evaluates pit trackway drainage and torpedo car refractory preheat temperature (>= 150°C) before authorizing molten liquid iron transfer."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - hpg_torpedo_ladle_operations
      filter:
        status:
          _eq: transfer_pending
    nodes:
      - key: read_torpedo_status
        name: "Read Torpedo Car & Trackway Sump Telemetry"
        type: item-read
        options:
          collection: hpg_torpedo_ladle_operations
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - car_no
              - track_pit_id
              - refractory_temp_c
              - pit_water_detected
              - trackway_clearance
        position_x: 1
        position_y: 1

      - key: verify_dry_envelope_and_clearance
        name: "Verify Zero Water Detected and Refractory >= 150°C"
        type: condition
        options:
          filter:
            _and:
              - read_torpedo_status:
                  pit_water_detected:
                    _eq: false
              - read_torpedo_status:
                  refractory_temp_c:
                    _gte: 150.0
              - read_torpedo_status:
                  trackway_clearance:
                    _eq: true
        position_x: 25
        position_y: 1

      - key: authorize_torpedo_transfer
        name: "Authorize Torpedo Car Trackway Positioning"
        type: item-update
        options:
          collection: hpg_torpedo_ladle_operations
          key: "{{$trigger.key}}"
          data:
            status: transfer_authorized
            work_authorized: true
        position_x: 50
        position_y: 1

      - key: notify_yard_dispatcher
        name: "Notify Rail Dispatcher of Safe Positioning"
        type: notification
        options:
          recipient: "{{$trigger.payload.rail_dispatcher_id}}"
          subject: "Torpedo Transfer Authorized: Car {{read_torpedo_status.car_no}} on Pit {{read_torpedo_status.track_pit_id}}"
          message: "Trackway dry (zero moisture) and refractory preheated. Authorized for hot metal reception."
        position_x: 75
        position_y: 1

      - key: reject_transfer_moisture_hazard
        name: "Block Torpedo Car Due to Water Entrapment Explosion Hazard"
        type: item-update
        options:
          collection: hpg_torpedo_ladle_operations
          key: "{{$trigger.key}}"
          data:
            status: transfer_blocked_moisture_hazard
            work_authorized: false
            rejection_reason: "Catastrophic steam explosion hazard: water detected in trackway pit or refractory temperature < 150°C."
        position_x: 50
        position_y: 15

      - key: alert_cast_house_safety
        name: "Alert Safety Officer & Engage Trackway Derailer"
        type: notification
        options:
          recipient: "{{$trigger.payload.safety_officer_id}}"
          subject: "EXPLOSION HAZARD TRIP: Torpedo Transfer Blocked for {{read_torpedo_status.car_no}}"
          message: "Molten metal transfer aborted: pit moisture or cold refractory detected. Derailer engaged."
        position_x: 75
        position_y: 15
    edges:
      - ["$trigger", "read_torpedo_status", "resolve"]
      - ["read_torpedo_status", "verify_dry_envelope_and_clearance", "resolve"]
      - ["verify_dry_envelope_and_clearance", "authorize_torpedo_transfer", "resolve"]
      - ["authorize_torpedo_transfer", "notify_yard_dispatcher", "resolve"]
      - ["verify_dry_envelope_and_clearance", "reject_transfer_moisture_hazard", "reject"]
      - ["reject_transfer_moisture_hazard", "alert_cast_house_safety", "resolve"]

  - key: hpg-ccm-radioactive-source-loto
    name: "Continuous Casting Mold Radioactive Source (Co-60/Cs-137) Shutter LOTO Gate"
    description: "Verifies radioactive source shutter closure, mechanical lockbox padlock, mold perimeter dose rate (<= 2.5 µSv/h), and dosimeter calibration prior to mold maintenance."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - hpg_radiation_source_permits
      filter:
        status:
          _eq: source_loto_submitted
    nodes:
      - key: read_radiation_permit
        name: "Read CCM Radiation Source Permit"
        type: item-read
        options:
          collection: hpg_radiation_source_permits
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - permit_no
              - ccm_id
              - source_isotope
              - shutter_closed
              - padlock_applied
              - perimeter_dose_rate_usv_hr
              - dosimeters_calibrated
        position_x: 1
        position_y: 1

      - key: verify_radiation_safety_safeguards
        name: "Verify Shutter Closed, Padlocked, Dose <= 2.5 µSv/h, and Dosimeters Calibrated"
        type: condition
        options:
          filter:
            _and:
              - read_radiation_permit:
                  shutter_closed:
                    _eq: true
              - read_radiation_permit:
                  padlock_applied:
                    _eq: true
              - read_radiation_permit:
                  perimeter_dose_rate_usv_hr:
                    _lte: 2.5
              - read_radiation_permit:
                  dosimeters_calibrated:
                    _eq: true
        position_x: 25
        position_y: 1

      - key: authorize_ccm_mold_access
        name: "Authorize Mold Maintenance Access"
        type: item-update
        options:
          collection: hpg_radiation_source_permits
          key: "{{$trigger.key}}"
          data:
            status: loto_radiation_cleared
            work_authorized: true
        position_x: 50
        position_y: 1

      - key: notify_ccm_foreman
        name: "Notify CCM Maintenance Foreman of Radiation Clearance"
        type: notification
        options:
          recipient: "{{$trigger.payload.ccm_foreman_id}}"
          subject: "Radiation LOTO Authorized: Permit {{read_radiation_permit.permit_no}} on {{read_radiation_permit.ccm_id}}"
          message: "Shutter locked and mold perimeter radiation verified <= 2.5 µSv/h. Authorized to proceed with mold servicing."
        position_x: 75
        position_y: 1

      - key: reject_radiation_access
        name: "Reject Mold Access Due to Radiation Hazard"
        type: item-update
        options:
          collection: hpg_radiation_source_permits
          key: "{{$trigger.key}}"
          data:
            status: loto_rejected_radiation_hazard
            work_authorized: false
            rejection_reason: "Radioactive shutter open, padlock missing, or perimeter dose rate > 2.5 µSv/h."
        position_x: 50
        position_y: 15

      - key: alert_radiation_protection_officer
        name: "Alert Radiation Protection Officer of Safety Breach"
        type: notification
        options:
          recipient: "{{$trigger.payload.rpo_id}}"
          subject: "RADIATION BREACH: Mold Access Blocked on {{read_radiation_permit.ccm_id}}"
          message: "CCM mold maintenance access denied: radiation survey failed or source shutter unlatched. Secure exclusion zone."
        position_x: 75
        position_y: 15
    edges:
      - ["$trigger", "read_radiation_permit", "resolve"]
      - ["read_radiation_permit", "verify_radiation_safety_safeguards", "resolve"]
      - ["verify_radiation_safety_safeguards", "authorize_ccm_mold_access", "resolve"]
      - ["authorize_ccm_mold_access", "notify_ccm_foreman", "resolve"]
      - ["verify_radiation_safety_safeguards", "reject_radiation_access", "reject"]
      - ["reject_radiation_access", "alert_radiation_protection_officer", "resolve"]

  - key: hpg-ladle-crane-dual-brake-gate
    name: "Hot Metal Ladle Crane ASME B30.2 NDT & Dual-Brake Hoist Safety Gate"
    description: "Enforces dual mechanical hoist brake holding tests, wire rope magnetic flux NDT, and hook ultrasonic testing prior to certifying crane for molten steel transport."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - hpg_ladle_crane_inspections
      filter:
        status:
          _eq: inspection_submitted
    nodes:
      - key: read_crane_inspection
        name: "Read Crane Inspection Dossier"
        type: item-read
        options:
          collection: hpg_ladle_crane_inspections
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - inspection_no
              - crane_tag
              - primary_brake_holding
              - emergency_brake_holding
              - wire_rope_ndt_valid
              - hook_ut_valid
              - load_test_passed
        position_x: 1
        position_y: 1

      - key: verify_dual_brake_and_ndt_integrity
        name: "Verify Dual Brakes Holding, NDT Valid, and UT Hook Test Passed"
        type: condition
        options:
          filter:
            _and:
              - read_crane_inspection:
                  primary_brake_holding:
                    _eq: true
              - read_crane_inspection:
                  emergency_brake_holding:
                    _eq: true
              - read_crane_inspection:
                  wire_rope_ndt_valid:
                    _eq: true
              - read_crane_inspection:
                  hook_ut_valid:
                    _eq: true
              - read_crane_inspection:
                  load_test_passed:
                    _eq: true
        position_x: 25
        position_y: 1

      - key: certify_crane_for_hot_metal
        name: "Certify Crane for Molten Steel Critical Lifts"
        type: item-update
        options:
          collection: hpg_ladle_crane_inspections
          key: "{{$trigger.key}}"
          data:
            status: crane_authorized_for_hot_metal
            work_authorized: true
        position_x: 50
        position_y: 1

      - key: notify_crane_operator
        name: "Notify Crane Operator & Casting Floor Supervisor"
        type: notification
        options:
          recipient: "{{$trigger.payload.crane_operator_id}}"
          subject: "Crane Certified: {{read_crane_inspection.crane_tag}} Authorized for Hot Metal"
          message: "Dual brakes, rope NDT, and hook UT verified per ASME B30.2. Heavy molten steel lift authorized."
        position_x: 75
        position_y: 1

      - key: lockout_defective_crane
        name: "Lockout Crane & Inhibit Main Hoist Contactor"
        type: item-update
        options:
          collection: hpg_ladle_crane_inspections
          key: "{{$trigger.key}}"
          data:
            status: crane_locked_out_mechanical_fault
            work_authorized: false
            rejection_reason: "Primary or emergency brake slippage, wire rope fatigue defect, or hook ultrasonic crack detected."
        position_x: 50
        position_y: 15

      - key: alert_mechanical_maintenance_chief
        name: "Alert Mechanical Maintenance Chief of Crane Defect"
        type: notification
        options:
          recipient: "{{$trigger.payload.chief_mechanical_engineer_id}}"
          subject: "CRANE DEFECT LOCKOUT: {{read_crane_inspection.crane_tag}} Failed Safety Inspection"
          message: "Ladle crane blocked from service: hoist brake or NDT defect detected. Emergency repairs required."
        position_x: 75
        position_y: 15
    edges:
      - ["$trigger", "read_crane_inspection", "resolve"]
      - ["read_crane_inspection", "verify_dual_brake_and_ndt_integrity", "resolve"]
      - ["verify_dual_brake_and_ndt_integrity", "certify_crane_for_hot_metal", "resolve"]
      - ["certify_crane_for_hot_metal", "notify_crane_operator", "resolve"]
      - ["verify_dual_brake_and_ndt_integrity", "lockout_defective_crane", "reject"]
      - ["lockout_defective_crane", "alert_mechanical_maintenance_chief", "resolve"]

rules:
  - rule_id: HPG-BF-CO-001
    name: "Cast House CO Atmospheric Ceiling Limit"
    description: "Atmospheric carbon monoxide concentration must remain below 25 ppm for unassisted operations and trigger immediate evacuation if exceeding 50 ppm."
    severity: critical
    condition: "gas_co_ppm <= 25.0"
    enforcement: strict_rejection
    action: "Halt hot metal tapping, trigger mechanical ventilation, and alert cast house supervisor."

  - rule_id: HPG-LADLE-TEMP-002
    name: "Molten Steel Ladle Shell Temperature Envelope"
    description: "Ladle external steel shell surface temperature must not exceed 350°C to prevent refractory burnout and molten metal breakout."
    severity: high
    condition: "ladle_shell_temp_c <= 350.0"
    enforcement: strict_rejection
    action: "Quarantine ladle, divert liquid steel to emergency pit, and log refractory inspection."

insights:
  - name: "Blast Furnace, BOF Converter & Gas Safety Dashboard"
    icon: "precision_manufacturing"
    color: "#D32F2F"
    note: "Real-time surveillance of blast furnace iron tapping, converter gas alarms, and molten ladle fleet integrity for Hoa Phat Dung Quat Steel Complex."
    panels:
      - name: "Crude Steel Daily Output (MT)"
        type: metric
        collection: hpg_plant_kpis
        options:
          field: crude_steel_output_mt
          function: sum
          decimals: 0
          suffix: " MT"
        position_x: 1
        position_y: 1
        width: 18
        height: 12
        icon: "factory"
        color: "#1565C0"

      - name: "Overall Equipment Effectiveness (OEE %)"
        type: metric
        collection: hpg_plant_kpis
        options:
          field: overall_equipment_effectiveness
          function: avg
          decimals: 1
          suffix: "%"
        position_x: 19
        position_y: 1
        width: 18
        height: 12
        icon: "speed"
        color: "#2E7D32"

      - name: "Blast Furnace Fuel Rate (kg/tHM) [Target <= 490]"
        type: metric
        collection: hpg_plant_kpis
        options:
          field: bf_fuel_rate_kg_t
          function: avg
          decimals: 1
          suffix: " kg/t"
        position_x: 37
        position_y: 1
        width: 18
        height: 12
        icon: "local_fire_department"
        color: "#EF6C00"

      - name: "Cast House Peak CO Level (ppm) [Limit: 25]"
        type: metric
        collection: hpg_gas_monitoring
        options:
          field: co_instantaneous_ppm
          function: max
          decimals: 1
          suffix: " ppm"
        position_x: 55
        position_y: 1
        width: 18
        height: 12
        icon: "air"
        color: "#C2185B"

      - name: "Real-Time CO Gas Detectors & Critical Alarms"
        type: list
        collection: hpg_gas_monitoring
        options:
          sortField: timestamp
          sortDirection: desc
          displayTemplate: "Sensor {{sensor_tag}} (Zone {{zone_code}}): CO {{co_instantaneous_ppm}} ppm | O2 {{o2_percentage}}% — Status: {{alarm_level}}"
          limit: 6
        position_x: 1
        position_y: 13
        width: 72
        height: 16
        icon: "warning"

      - name: "Active Hot Metal Tapping Permits"
        type: list
        collection: hpg_hot_metal_permits
        options:
          filter:
            status:
              _in:
                - ptw_submitted
                - tapping_authorized
          sortField: date_created
          sortDirection: desc
          displayTemplate: "PTW #{{permit_no}}: Furnace {{blast_furnace_id}} TapHole {{tap_hole_no}} — Status: {{status}}"
          limit: 6
        position_x: 1
        position_y: 29
        width: 72
        height: 16
        icon: "assignment"

      - name: "CR-250 Ladle Crane LMI & Molten Steel Critical Lift Monitor"
        type: grc-crane-lmi
        collection: hpg_hot_metal_permits
        options:
          crane_tag: "CR-250-LADLE"
          crane_model: "Liebherr LTM 1250-5.1"
          standard: "ASME B30.5 / EN 13000 / CIRIA C703"
        position_x: 1
        position_y: 45
        width: 72
        height: 24
        icon: "precision_manufacturing"
        color: "#FF9100"
