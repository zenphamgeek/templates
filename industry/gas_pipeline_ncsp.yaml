template_id: gas_pipeline_ncsp
version: 1.0.0
industry_vertical: gas_midstream_pipeline
archetype: "Nam Con Son Gas Pipeline (NCSP) Archetype"

metadata:
  name: "Nam Con Son Gas Midstream Pipeline Resilience Template"
  description: "Pipeline integrity management, intelligent pigging operation verification, and gas delivery surveillance template for the 399km Nam Con Son gas transportation network."
  status: VERIFIED
  author: "Industry Template Architect & Engine Specialist"
  approver: "Zen Phạm"
  created_at: "2026-10-04"
  tags:
    - gas_midstream
    - pipeline_integrity
    - intelligent_pigging
    - scada
    - esd_valves
    - cathodic_protection
    - metering
  regulatory_frameworks:
    - "ASME B31.8 Gas Transmission and Distribution Piping Systems"
    - "TCVN 6475:2007 Safety Regulations for Offshore and Onshore Pipelines"
    - "API 1160 Managing System Integrity for Hazardous Liquid Pipelines"
    - "NACE SP0169 Control of External Corrosion on Underground Piping"

taxonomy_and_fields:
  collections:
    - collection: ncsp_pigging_runs
      name: "Pipeline Pigging Operations"
      description: "Intelligent and cleaning pigging run logs, barrel pressures, and launch/receive authorizations."
      fields:
        - field: id
          type: uuid
        - field: run_code
          type: string
        - field: pipeline_segment
          type: string
        - field: tool_type
          type: string
        - field: status
          type: string
        - field: launcher_station_id
          type: uuid
        - field: pig_signal_armed
          type: boolean
        - field: launch_authorized_at
          type: timestamp
        - field: alert_flag
          type: string
        - field: sensor_health
          type: string

    - collection: ncsp_scada_valves
      name: "SCADA ESD & Station Valves"
      description: "Real-time telemetry and interlock status for emergency shutdown (ESD), bypass, and kicker valves."
      fields:
        - field: id
          type: uuid
        - field: station_code
          type: string
        - field: esd_valves_armed
          type: boolean
        - field: bypass_lineup_correct
          type: boolean
        - field: kicker_valve_open
          type: boolean
        - field: barrel_pressure_equalized
          type: boolean
        - field: launcher_pressure_bar
          type: float
        - field: mainline_pressure_bar
          type: float

    - collection: ncsp_pipeline_integrity
      name: "Pipeline Integrity & Cathodic Protection"
      description: "CP potentials, sacrificial anode currents, and soil resistivity logs along KP-0 to KP-399."
      fields:
        - field: id
          type: uuid
        - field: kilometer_post
          type: float
        - field: segment_name
          type: string
        - field: cp_potential_mv
          type: float
        - field: soil_resistivity_ohm_m
          type: float
        - field: anode_current_ma
          type: float
        - field: integrity_status
          type: string
        - field: date_tested
          type: date
        - field: status
          type: string
        - field: mass_balance_discrepancy_pct
          type: float
        - field: linepack_m3
          type: float

    - collection: ncsp_gas_metering
      name: "Gas Custody Transfer & Metering"
      description: "Volumetric delivery, gas composition, pressure, and temperature at delivery stations."
      fields:
        - field: id
          type: uuid
        - field: station_name
          type: string
        - field: timestamp
          type: timestamp
        - field: delivery_rate_mmscmd
          type: float
        - field: intake_pressure_bar
          type: float
        - field: temperature_c
          type: float
        - field: hydrocarbon_dew_point_c
          type: float
        - field: h2s_content_ppm
          type: float
        - field: status
          type: string

    - collection: ncsp_ili_anomalies
      name: "Intelligent Pigging ILI Corrosion Features"
      description: "In-line inspection (MFL/UT) metal loss anomalies, defect dimensions, and ASME B31G calculations."
      fields:
        - field: id
          type: uuid
        - field: anomaly_code
          type: string
        - field: kilometer_post
          type: float
        - field: segment_name
          type: string
        - field: defect_depth_pct_wt
          type: float
        - field: defect_length_mm
          type: float
        - field: pipe_diameter_mm
          type: float
        - field: wall_thickness_mm
          type: float
        - field: smys_mpa
          type: float
        - field: maop_bar
          type: float
        - field: calculated_failure_pressure_bar
          type: float
        - field: erf_ratio
          type: float
        - field: repair_required
          type: boolean
        - field: status
          type: string
        - field: alert_flag
          type: string

    - collection: ncsp_maop_deratings
      name: "Pipeline MAOP Derating & Safe Pressure Orders"
      description: "Operational pressure reduction records and SCADA setpoint constraints driven by integrity evaluations."
      fields:
        - field: id
          type: uuid
        - field: segment_code
          type: string
        - field: kilometer_post
          type: float
        - field: design_maop_bar
          type: float
        - field: current_operating_pressure_bar
          type: float
        - field: calculated_safe_pressure_bar
          type: float
        - field: derated_maop_bar
          type: float
        - field: erf_ratio
          type: float
        - field: anomaly_id
          type: uuid
        - field: status
          type: string
        - field: scada_setpoint_updated
          type: boolean
        - field: derated_at
          type: timestamp

    - collection: ncsp_row_encroachments
      name: "Right-of-Way (ROW) Corridor Encroachments"
      description: "Unauthorized excavation, construction, and third-party activity within the 50m safety corridor."
      fields:
        - field: id
          type: uuid
        - field: incident_code
          type: string
        - field: kilometer_post
          type: float
        - field: gps_latitude
          type: float
        - field: gps_longitude
          type: float
        - field: distance_to_pipeline_m
          type: float
        - field: activity_type
          type: string
        - field: heavy_machinery_present
          type: boolean
        - field: patrol_officer_id
          type: uuid
        - field: status
          type: string
        - field: permits_suspended
          type: boolean
        - field: security_response_dispatched
          type: boolean
        - field: alert_flag
          type: string

    - collection: ncsp_esptw_permits
      name: "NCSP SAS Electronic Safety Permits to Work (e-PTW / eSPTW & Multi-Discipline)"
      description: "NCSP Safety Critical System (SAS) Electronic Permit to Work (e-PTW / eSPTW) with Multi-Discipline classification (Mechanical/Cơ khí, Electrical/Điện, C&I/Tự động hóa, Civil/Xây dựng, HSE/An toàn), Level 2 Risk Assessment (L2RA), Isolation Confirmation Certificate (ICC), 4-level approval chain (Requester -> Concurrent HSE & Maintenance Multi-Discipline Review -> Area Authority AA -> Shift Supervisor SS), and Paper PTW Return & Re-issue."
      fields:
        - field: id
          type: uuid
        - field: permit_no
          type: string
        - field: work_title
          type: string
        - field: discipline
          type: string
        - field: ptw_type
          type: string
        - field: location_kp
          type: float
        - field: hse_review_approved
          type: boolean
        - field: maintenance_review_approved
          type: boolean
        - field: aa_approved
          type: boolean
        - field: ss_approved
          type: boolean
        - field: l2ra_verified
          type: boolean
        - field: icc_verified
          type: boolean
        - field: esd_inhibit
          type: boolean
        - field: fg_inhibit
          type: boolean
        - field: safety_checklist_complete
          type: boolean
        - field: jha_attached
          type: boolean
        - field: requester_id
          type: uuid
        - field: status
          type: string
        - field: dual_review_cleared
          type: boolean
        - field: alert_flag
          type: string
        - field: dual_cleared_at
          type: timestamp

    - collection: ncsp_emergency_incidents
      name: "Gas Trunkline Emergency Incidents"
      description: "Loss of containment, sudden depressurization, and ESD trip coordination records."
      fields:
        - field: id
          type: uuid
        - field: incident_code
          type: string
        - field: segment_code
          type: string
        - field: kilometer_post
          type: float
        - field: incident_type
          type: string
        - field: gas_leak_rate_kg_s
          type: float
        - field: esd_trip_triggered
          type: boolean
        - field: flame_detected
          type: boolean
        - field: affected_jurisdiction
          type: string
        - field: status
          type: string
        - field: esd_isolated
          type: boolean
        - field: callout_tree_broadcasted
          type: boolean
        - field: alert_flag
          type: string

    - collection: grc_actions
      name: "Enterprise Corrective & Preventive Actions (CAPA)"
      description: "Emergency pipeline repair orders, engineering sleeves, and regulatory notifications."
      fields:
        - field: id
          type: uuid
        - field: title
          type: string
        - field: source_module
          type: string
        - field: action_category
          type: string
        - field: priority
          type: string
        - field: status
          type: string
        - field: description
          type: string
        - field: assigned_to
          type: string

    - collection: hse_tasks
      name: "Operational Safety Tasks"
      description: "Field investigation, NDT scan, and security intercept tasks dispatched to pipeline specialists."
      fields:
        - field: id
          type: uuid
        - field: task_title
          type: string
        - field: unit_tag
          type: string
        - field: priority
          type: string
        - field: status
          type: string
        - field: assigned_to
          type: string
        - field: deadline_hours
          type: integer

    - collection: ncsp_cathodic_protection_rectifiers
      name: "Cathodic Protection Transformer-Rectifiers"
      description: "Transformer-rectifier telemetry, instant-off polarized potentials, and coating disbondment surveillance per ISO 15589-1."
      fields:
        - field: id
          type: uuid
        - field: rectifier_tag
          type: string
        - field: kp_location
          type: float
        - field: on_potential_mv_cse
          type: float
        - field: instant_off_potential_mv_cse
          type: float
        - field: output_current_amps
          type: float
        - field: coating_disbondment_risk
          type: boolean
        - field: status
          type: string

    - collection: ncsp_hca_class_assessments
      name: "High Consequence Area (HCA) Class Location Assessments"
      description: "ASME B31.8S Class Location population density surveys, design factor F re-evaluations, and hydrotest requalification records."
      fields:
        - field: id
          type: uuid
        - field: segment_id
          type: string
        - field: kp_start
          type: float
        - field: kp_end
          type: float
        - field: previous_class_location
          type: integer
        - field: current_class_location
          type: integer
        - field: dwelling_count_within_200m
          type: integer
        - field: design_factor_f
          type: float
        - field: requalification_method
          type: string
        - field: status
          type: string

  relations:
    - collection: ncsp_pigging_runs
      field: launcher_station_id
      related_collection: ncsp_scada_valves
      type: m2o
    - collection: ncsp_maop_deratings
      field: anomaly_id
      related_collection: ncsp_ili_anomalies
      type: m2o

  equipment_taxonomy:
    system_code: NCSP_SYSTEM
    segments:
      - code: "OFFSHORE"
        name: "371km 26-inch Offshore Trunkline (Rong Doi to Long Hai)"
        stations:
          - code: "KP0"
            name: "Offshore Platform Pig Launcher"
          - code: "LH"
            name: "Long Hai Landfall Station & Isolation Valve"
      - code: "ONSHORE_GPP"
        name: "9km 26-inch Onshore Trunkline (Long Hai to Dinh Co)"
        stations:
          - code: "DC"
            name: "Dinh Co Gas Processing Plant (GPP)"
      - code: "ONSHORE_GDC"
        name: "30.5km 16-inch Fuel Gas Pipeline (Dinh Co to Phu My)"
        stations:
          - code: "PM"
            name: "Phu My Gas Distribution Center (GDC)"
          - code: "BR"
            name: "Ba Ria Power Plant Tie-in Station"

business_flows:
  - key: ncsp-pim-b31g-failure-pressure
    name: "Pipeline Integrity Management ASME B31G Corroded Pipe Failure Pressure Assessment Flow"
    description: "Ingests in-line inspection (ILI) MFL/UT corrosion features, computes Folias factor M and failure pressure Pf per ASME B31G / RSTRENG, and evaluates Estimated Repair Factor (ERF)."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - ncsp_ili_anomalies
      filter:
        status:
          _eq: inspection_data_ingested
    nodes:
      - key: read_ili_corrosion_feature
        name: "Read In-Line Inspection Corrosion Anomaly Parameters"
        type: item-read
        options:
          collection: ncsp_ili_anomalies
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - anomaly_code
              - kilometer_post
              - segment_name
              - defect_depth_pct_wt
              - defect_length_mm
              - pipe_diameter_mm
              - wall_thickness_mm
              - smys_mpa
              - maop_bar
              - calculated_failure_pressure_bar
              - erf_ratio
        position_x: 1
        position_y: 1

      - key: compute_b31g_defect_severity
        name: "Evaluate ASME B31G / RSTRENG Critical Defect Limits"
        type: condition
        options:
          filter:
            _or:
              - read_ili_corrosion_feature:
                  defect_depth_pct_wt:
                    _gte: 80.0
              - read_ili_corrosion_feature:
                  erf_ratio:
                    _gt: 1.0
        position_x: 20
        position_y: 1

      - key: create_emergency_pipeline_repair
        name: "Create Urgent Pipeline Repair Work Order (Type-B Sleeve)"
        type: item-create
        options:
          collection: grc_actions
          data:
            title: "Emergency Type-B Sleeve Repair - ASME B31G Anomaly at KP {{read_ili_corrosion_feature.kilometer_post}}"
            source_module: pipeline_integrity_pim
            action_category: asset_integrity
            priority: critical
            status: open
            description: "ASME B31G critical corrosion feature detected at KP {{read_ili_corrosion_feature.kilometer_post}} (depth={{read_ili_corrosion_feature.defect_depth_pct_wt}}% WT, ERF={{read_ili_corrosion_feature.erf_ratio}}). Immediate repair sleeve required."
        position_x: 40
        position_y: 1

      - key: create_ili_field_verification_task
        name: "Dispatch Field NDT Ultrasonic Re-Verification Task"
        type: item-create
        options:
          collection: hse_tasks
          data:
            task_title: "NDT Ultrasonic Thickness Re-Verification at KP {{read_ili_corrosion_feature.kilometer_post}}"
            unit_tag: "{{read_ili_corrosion_feature.segment_name}}"
            priority: critical
            status: assigned
            assigned_to: "NDT_Inspection_Team"
            deadline_hours: 24
        position_x: 60
        position_y: 1

      - key: update_anomaly_critical_status
        name: "Update Anomaly Record to Critical Flaw & Derating Pending"
        type: item-update
        options:
          collection: ncsp_ili_anomalies
          key: "{{$trigger.key}}"
          data:
            status: critical_flaw_derating_required
            repair_required: true
            alert_flag: asme_b31g_erf_exceeded
        position_x: 80
        position_y: 1

      - key: notify_critical_b31g_alert
        name: "Broadcast Critical Corrosion Alert to Integrity Superintendent"
        type: notification
        options:
          recipient: "PIPELINE_INTEGRITY_SUPERINTENDENT"
          subject: "CRITICAL PIM ALERT: ASME B31G Anomaly at KP {{read_ili_corrosion_feature.kilometer_post}}"
          message: "Corrosion depth {{read_ili_corrosion_feature.defect_depth_pct_wt}}% WT or ERF {{read_ili_corrosion_feature.erf_ratio}} > 1.0 at KP {{read_ili_corrosion_feature.kilometer_post}}. Emergency sleeve repair created. Derating review initiated."
        position_x: 100
        position_y: 1

      - key: update_anomaly_acceptable_status
        name: "Record Anomaly as Monitored & Acceptable under B31G"
        type: item-update
        options:
          collection: ncsp_ili_anomalies
          key: "{{$trigger.key}}"
          data:
            status: monitored_acceptable_b31g
            repair_required: false
            alert_flag: null
        position_x: 40
        position_y: 15

      - key: notify_b31g_acceptable
        name: "Notify Corrosion Team of Acceptable ILI Anomaly"
        type: notification
        options:
          recipient: "CORROSION_INTEGRITY_ENGINEER"
          subject: "ASME B31G Evaluation Nominal: KP {{read_ili_corrosion_feature.kilometer_post}}"
          message: "Defect depth {{read_ili_corrosion_feature.defect_depth_pct_wt}}% WT, ERF {{read_ili_corrosion_feature.erf_ratio}} <= 1.0 at KP {{read_ili_corrosion_feature.kilometer_post}}. Flaw is within ASME B31G allowable envelope. Routine monitoring logged."
        position_x: 60
        position_y: 15

    edges:
      - ["$trigger", "read_ili_corrosion_feature", "resolve"]
      - ["read_ili_corrosion_feature", "compute_b31g_defect_severity", "resolve"]
      - ["compute_b31g_defect_severity", "create_emergency_pipeline_repair", "resolve"]
      - ["create_emergency_pipeline_repair", "create_ili_field_verification_task", "resolve"]
      - ["create_ili_field_verification_task", "update_anomaly_critical_status", "resolve"]
      - ["update_anomaly_critical_status", "notify_critical_b31g_alert", "resolve"]
      - ["compute_b31g_defect_severity", "update_anomaly_acceptable_status", "reject"]
      - ["update_anomaly_acceptable_status", "notify_b31g_acceptable", "resolve"]

  - key: ncsp-pim-maop-derating-action
    name: "Pipeline Automated MAOP Derating & Operating Pressure Reduction Flow"
    description: "Automates Maximum Allowable Operating Pressure (MAOP) derating when Estimated Repair Factor (ERF) > 1.0, updating SCADA pressure setpoints to prevent rupture."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - ncsp_maop_deratings
      filter:
        status:
          _eq: derating_evaluation_requested
    nodes:
      - key: read_derating_parameters
        name: "Read Pipeline Segment Operating & Safe Pressure Parameters"
        type: item-read
        options:
          collection: ncsp_maop_deratings
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - segment_code
              - kilometer_post
              - design_maop_bar
              - current_operating_pressure_bar
              - calculated_safe_pressure_bar
              - erf_ratio
              - anomaly_id
        position_x: 1
        position_y: 1

      - key: verify_erf_derating_threshold
        name: "Verify ERF > 1.0 & Safe Pressure < Operating Pressure"
        type: condition
        options:
          filter:
            _and:
              - read_derating_parameters:
                  erf_ratio:
                    _gt: 1.0
              - read_derating_parameters:
                  calculated_safe_pressure_bar:
                    _lt: "{{read_derating_parameters.current_operating_pressure_bar}}"
        position_x: 20
        position_y: 1

      - key: apply_scada_maop_reduction
        name: "Apply Automated MAOP Derating in Pipeline Register"
        type: item-update
        options:
          collection: ncsp_maop_deratings
          key: "{{$trigger.key}}"
          data:
            status: maop_derated_active
            derated_maop_bar: "{{read_derating_parameters.calculated_safe_pressure_bar}}"
            derated_at: "{{$NOW}}"
            scada_setpoint_updated: true
        position_x: 40
        position_y: 1

      - key: create_scada_dispatch_directive
        name: "Create SCADA Pressure Inhibit Directive"
        type: item-create
        options:
          collection: grc_actions
          data:
            title: "SCADA Pressure Inhibit Directive: Derate Segment {{read_derating_parameters.segment_code}} to {{read_derating_parameters.calculated_safe_pressure_bar}} bar"
            source_module: scada_dispatch
            action_category: operational_safety
            priority: critical
            status: active
            description: "Mandatory MAOP reduction on {{read_derating_parameters.segment_code}} at KP {{read_derating_parameters.kilometer_post}}. Reduce intake pressure to safe limit {{read_derating_parameters.calculated_safe_pressure_bar}} bar."
        position_x: 60
        position_y: 1

      - key: notify_gas_control_center_derating
        name: "Alert Gas Dispatch Control Center of Immediate Derating"
        type: notification
        options:
          recipient: "GAS_DISPATCH_CONTROL_CENTER"
          subject: "MANDATORY MAOP DERATING: {{read_derating_parameters.segment_code}} Pressure Reduced"
          message: "Operating pressure derated to {{read_derating_parameters.calculated_safe_pressure_bar}} bar (ERF={{read_derating_parameters.erf_ratio}}). Adjust compressor export and inlet choke valves immediately."
        position_x: 80
        position_y: 1

      - key: maintain_baseline_maop
        name: "Confirm Baseline MAOP Safe & Retain Normal Operating Envelope"
        type: item-update
        options:
          collection: ncsp_maop_deratings
          key: "{{$trigger.key}}"
          data:
            status: baseline_maop_confirmed
            derated_maop_bar: "{{read_derating_parameters.design_maop_bar}}"
            scada_setpoint_updated: false
        position_x: 40
        position_y: 15

      - key: notify_derating_not_required
        name: "Notify Dispatch that Baseline Operating Pressure is Safe"
        type: notification
        options:
          recipient: "GAS_DISPATCH_CONTROL_CENTER"
          subject: "MAOP Confirmed: {{read_derating_parameters.segment_code}} Operating Within Safe Envelope"
          message: "Derating review completed: calculated safe pressure exceeds current operating pressure. Normal MAOP maintained."
        position_x: 60
        position_y: 15

    edges:
      - ["$trigger", "read_derating_parameters", "resolve"]
      - ["read_derating_parameters", "verify_erf_derating_threshold", "resolve"]
      - ["verify_erf_derating_threshold", "apply_scada_maop_reduction", "resolve"]
      - ["apply_scada_maop_reduction", "create_scada_dispatch_directive", "resolve"]
      - ["create_scada_dispatch_directive", "notify_gas_control_center_derating", "resolve"]
      - ["verify_erf_derating_threshold", "maintain_baseline_maop", "reject"]
      - ["maintain_baseline_maop", "notify_derating_not_required", "resolve"]

  - key: ncsp-row-patrol-encroachment-interlock
    name: "Pipeline Right-of-Way (ROW) Patrol Encroachment & Excavation Permit Interlock Flow"
    description: "Monitors 39.5km onshore gas corridor for unauthorized heavy excavation or construction inside the 50m safety zone, automatically suspending nearby excavation permits."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - ncsp_row_encroachments
      filter:
        status:
          _eq: encroachment_detected
    nodes:
      - key: read_encroachment_incident
        name: "Read Corridor Patrol Encroachment Incident"
        type: item-read
        options:
          collection: ncsp_row_encroachments
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - incident_code
              - kilometer_post
              - gps_latitude
              - gps_longitude
              - distance_to_pipeline_m
              - activity_type
              - heavy_machinery_present
              - patrol_officer_id
        position_x: 1
        position_y: 1

      - key: check_corridor_safety_breach
        name: "Verify Encroachment Inside 50m Corridor or Heavy Machinery"
        type: condition
        options:
          filter:
            _or:
              - read_encroachment_incident:
                  distance_to_pipeline_m:
                    _lte: 50.0
              - read_encroachment_incident:
                  heavy_machinery_present:
                    _eq: true
        position_x: 20
        position_y: 1

      - key: suspend_nearby_excavation_permits
        name: "Lock Out Excavation Permits in 500m Vicinity"
        type: item-update
        options:
          collection: ncsp_row_encroachments
          key: "{{$trigger.key}}"
          data:
            status: corridor_lockout_active
            permits_suspended: true
            security_response_dispatched: true
            alert_flag: unauthorized_corridor_encroachment
        position_x: 40
        position_y: 1

      - key: create_patrol_security_dispatch
        name: "Dispatch Immediate Security Intercept Task"
        type: item-create
        options:
          collection: hse_tasks
          data:
            task_title: "Emergency Security Intercept: Encroachment at KP {{read_encroachment_incident.kilometer_post}}"
            unit_tag: "ROW-ONSHORE-CORRIDOR"
            priority: critical
            status: dispatched
            assigned_to: "Pipeline_Security_Patrol"
            deadline_hours: 1
        position_x: 60
        position_y: 1

      - key: broadcast_corridor_encroachment_alert
        name: "Broadcast Emergency Encroachment Alert to Security Team"
        type: notification
        options:
          recipient: "PIPELINE_SECURITY_CHIEF"
          subject: "ROW ENCROACHMENT ALERT: Activity Detected at KP {{read_encroachment_incident.kilometer_post}}"
          message: "Unauthorized excavation/machinery within {{read_encroachment_incident.distance_to_pipeline_m}}m of 26-inch trunkline (GPS: {{read_encroachment_incident.gps_latitude}}, {{read_encroachment_incident.gps_longitude}}). All permits within 500m suspended. Security dispatched."
        position_x: 80
        position_y: 1

      - key: clear_encroachment_record
        name: "Clear Encroachment as Verified Safe Distance"
        type: item-update
        options:
          collection: ncsp_row_encroachments
          key: "{{$trigger.key}}"
          data:
            status: inspected_non_encroaching
            permits_suspended: false
            alert_flag: null
        position_x: 40
        position_y: 15

      - key: notify_patrol_clearance
        name: "Notify Patrol Team of Safe Distance Verification"
        type: notification
        options:
          recipient: "PIPELINE_SECURITY_CHIEF"
          subject: "ROW Patrol Cleared: Activity Beyond Safety Zone at KP {{read_encroachment_incident.kilometer_post}}"
          message: "Activity verified outside 50m corridor. No heavy machinery risk to pipeline. Normal patrol resumed."
        position_x: 60
        position_y: 15

    edges:
      - ["$trigger", "read_encroachment_incident", "resolve"]
      - ["read_encroachment_incident", "check_corridor_safety_breach", "resolve"]
      - ["check_corridor_safety_breach", "suspend_nearby_excavation_permits", "resolve"]
      - ["suspend_nearby_excavation_permits", "create_patrol_security_dispatch", "resolve"]
      - ["create_patrol_security_dispatch", "broadcast_corridor_encroachment_alert", "resolve"]
      - ["check_corridor_safety_breach", "clear_encroachment_record", "reject"]
      - ["clear_encroachment_record", "notify_patrol_clearance", "resolve"]

  - key: ncsp-esptw-dual-review
    name: "NCSP SAS Electronic Safety Permit to Work (e-PTW / eSPTW) & Multi-Discipline 4-Level Chain Flow"
    description: "Exclusively governs NCSP SAS Electronic Permit to Work (e-PTW / eSPTW) & Multi-Discipline workflows (Mechanical/Cơ khí, Electrical/Điện, C&I/Tự động hóa, Civil/Xây dựng, HSE/An toàn): Requester (Draft -> Submitted) -> Concurrent Multi-Discipline Review (HSE & Maintenance) -> Area Authority (AA) -> Shift Supervisor (SS), with Level 2 Risk Assessment (L2RA), Isolation Confirmation Certificate (ICC), and Paper PTW Return & Re-issue."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - ncsp_esptw_permits
      filter:
        status:
          _eq: dual_review_submitted
    nodes:
      - key: read_esptw_review_status
        name: "Read NCSP SAS e-PTW (eSPTW) & Multi-Discipline Review Status"
        type: item-read
        options:
          collection: ncsp_esptw_permits
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - permit_no
              - work_title
              - discipline
              - ptw_type
              - location_kp
              - hse_review_approved
              - maintenance_review_approved
              - l2ra_verified
              - icc_verified
              - safety_checklist_complete
              - jha_attached
              - requester_id
        position_x: 1
        position_y: 1

      - key: verify_concurrent_dual_endorsement
        name: "Verify Concurrent Multi-Discipline (HSE && Maintenance) Endorsement, L2RA & ICC"
        type: condition
        options:
          filter:
            _and:
              - read_esptw_review_status:
                  hse_review_approved:
                    _eq: true
              - read_esptw_review_status:
                  maintenance_review_approved:
                    _eq: true
              - read_esptw_review_status:
                  safety_checklist_complete:
                    _eq: true
              - read_esptw_review_status:
                  jha_attached:
                    _eq: true
        position_x: 20
        position_y: 1

      - key: approve_esptw_for_area_authority
        name: "Clear Multi-Discipline Review & Escalate e-PTW to Area Authority (AA) & Shift Supervisor (SS)"
        type: item-update
        options:
          collection: ncsp_esptw_permits
          key: "{{$trigger.key}}"
          data:
            status: area_authority_endorsement
            dual_review_cleared: true
            dual_cleared_at: "{{$NOW}}"
        position_x: 40
        position_y: 1

      - key: notify_area_authority_esptw
        name: "Notify Area Authority (AA) & Shift Supervisor (SS) of Cleared Multi-Discipline e-PTW"
        type: notification
        options:
          recipient: "AREA_AUTHORITY_SUPERINTENDENT"
          subject: "NCSP SAS e-PTW (eSPTW) Multi-Discipline Endorsed: Permit #{{read_esptw_review_status.permit_no}}"
          message: "Concurrent Multi-Discipline approval granted by HSE and Maintenance ({{read_esptw_review_status.discipline}}). L2RA & ICC verified. e-PTW ready for Area Authority (AA) and Shift Supervisor (SS) authorization at KP {{read_esptw_review_status.location_kp}}."
        position_x: 60
        position_y: 1

      - key: reject_esptw_deficiency
        name: "Reject e-PTW Due to Missing Multi-Discipline Endorsement"
        type: item-update
        options:
          collection: ncsp_esptw_permits
          key: "{{$trigger.key}}"
          data:
            status: returned_for_revision
            dual_review_cleared: false
            alert_flag: missing_concurrent_endorsement
        position_x: 40
        position_y: 15

      - key: notify_esptw_rejection
        name: "Alert Requester of Multi-Discipline e-PTW Revision Required"
        type: notification
        options:
          recipient: "{{read_esptw_review_status.requester_id}}"
          subject: "NCSP e-PTW (eSPTW) Revision Required: Permit #{{read_esptw_review_status.permit_no}}"
          message: "e-PTW returned. Concurrent Multi-Discipline signoff from BOTH HSE and Maintenance is required before Area Authority (AA) and Shift Supervisor (SS) review."
        position_x: 60
        position_y: 15

    edges:
      - ["$trigger", "read_esptw_review_status", "resolve"]
      - ["read_esptw_review_status", "verify_concurrent_dual_endorsement", "resolve"]
      - ["verify_concurrent_dual_endorsement", "approve_esptw_for_area_authority", "resolve"]
      - ["approve_esptw_for_area_authority", "notify_area_authority_esptw", "resolve"]
      - ["verify_concurrent_dual_endorsement", "reject_esptw_deficiency", "reject"]
      - ["reject_esptw_deficiency", "notify_esptw_rejection", "resolve"]

  - key: ncsp-emergency-response-coordination
    name: "Inter-Provincial Gas Emergency Response & SCADA ESD Valve Trip Coordination Flow"
    description: "Coordinates inter-provincial emergency communications (Dinh Co, Phu My, Ba Ria, Fire Police PC07) and trips SCADA Emergency Shutdown (ESD) valves on gas release."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - ncsp_emergency_incidents
      filter:
        status:
          _eq: emergency_declared
    nodes:
      - key: read_emergency_incident
        name: "Read Gas Trunkline Emergency Incident Parameters"
        type: item-read
        options:
          collection: ncsp_emergency_incidents
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - incident_code
              - segment_code
              - kilometer_post
              - incident_type
              - gas_leak_rate_kg_s
              - esd_trip_triggered
              - flame_detected
              - affected_jurisdiction
        position_x: 1
        position_y: 1

      - key: evaluate_tier_emergency_criteria
        name: "Evaluate Major Incident Thresholds (Leak >= 5kg/s or ESD)"
        type: condition
        options:
          filter:
            _or:
              - read_emergency_incident:
                  esd_trip_triggered:
                    _eq: true
              - read_emergency_incident:
                  gas_leak_rate_kg_s:
                    _gte: 5.0
              - read_emergency_incident:
                  flame_detected:
                    _eq: true
        position_x: 20
        position_y: 1

      - key: trigger_scada_esd_valve_isolation
        name: "Trigger SCADA Emergency Line-Break Valve Isolation"
        type: item-update
        options:
          collection: ncsp_scada_valves
          key: "{{read_emergency_incident.segment_code}}"
          data:
            esd_valves_armed: true
            kicker_valve_open: false
        position_x: 40
        position_y: 1

      - key: create_interprovincial_crisis_dossier
        name: "Create Tier-1 Crisis Management Dossier in GRC"
        type: item-create
        options:
          collection: grc_actions
          data:
            title: "Inter-Provincial Tier-1 Gas Emergency Response - {{read_emergency_incident.segment_code}} KP {{read_emergency_incident.kilometer_post}}"
            source_module: emergency_crisis_management
            action_category: life_safety_emergency
            priority: critical
            status: active
            description: "Major gas release or ESD event at KP {{read_emergency_incident.kilometer_post}} (leak rate={{read_emergency_incident.gas_leak_rate_kg_s}} kg/s). Inter-provincial callout initiated."
        position_x: 60
        position_y: 1

      - key: update_incident_escalation_status
        name: "Update Incident Record with Active Crisis Protocol"
        type: item-update
        options:
          collection: ncsp_emergency_incidents
          key: "{{$trigger.key}}"
          data:
            status: emergency_coordinated_active
            esd_isolated: true
            callout_tree_broadcasted: true
        position_x: 80
        position_y: 1

      - key: broadcast_interprovincial_callout_tree
        name: "Broadcast Emergency Callout to Plant Operators & Authorities"
        type: notification
        options:
          recipient: "CRISIS_MANAGEMENT_COMMAND"
          subject: "INTER-PROVINCIAL EMERGENCY BROADCAST: Gas Release on {{read_emergency_incident.segment_code}}"
          message: "CRITICAL INCIDENT at KP {{read_emergency_incident.kilometer_post}}. SCADA mainline valves closed. Callout dispatched to Dinh Co GPP, Phu My GDC, Ba Ria Power, and Fire Police PC07."
        position_x: 100
        position_y: 1

      - key: log_minor_anomaly
        name: "Log Localized Non-Emergency Operational Anomaly"
        type: item-update
        options:
          collection: ncsp_emergency_incidents
          key: "{{$trigger.key}}"
          data:
            status: localized_anomaly_standby
            callout_tree_broadcasted: false
            alert_flag: minor_operational_fluctuation
        position_x: 40
        position_y: 15

      - key: notify_field_technician_dispatch
        name: "Dispatch Field Technician for Localized Inspection"
        type: notification
        options:
          recipient: "FIELD_OPERATION_TECHNICIAN"
          subject: "Operational Standby: Localized Telemetry Anomaly on {{read_emergency_incident.segment_code}}"
          message: "Minor operational fluctuation logged at KP {{read_emergency_incident.kilometer_post}}. Leak rate < 5.0 kg/s and no flame detected. Local technician dispatched for site verification."
        position_x: 60
        position_y: 15

    edges:
      - ["$trigger", "read_emergency_incident", "resolve"]
      - ["read_emergency_incident", "evaluate_tier_emergency_criteria", "resolve"]
      - ["evaluate_tier_emergency_criteria", "trigger_scada_esd_valve_isolation", "resolve"]
      - ["trigger_scada_esd_valve_isolation", "create_interprovincial_crisis_dossier", "resolve"]
      - ["create_interprovincial_crisis_dossier", "update_incident_escalation_status", "resolve"]
      - ["update_incident_escalation_status", "broadcast_interprovincial_callout_tree", "resolve"]
      - ["evaluate_tier_emergency_criteria", "log_minor_anomaly", "reject"]
      - ["log_minor_anomaly", "notify_field_technician_dispatch", "resolve"]

  - key: ncsp-scada-integrity-monitor
    name: "Real-Time Pig Trap & Cathodic Protection Pipeline Integrity Monitor Flow"
    description: "Monitors pig launcher barrel pressure equalization, SCADA ESD valves, and subsea CP potentials (-850mV to -1200mV) before clearing pipeline operations."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - ncsp_pigging_runs
      filter:
        status:
          _eq: launch_sequence_initiated
    nodes:
      - key: read_pipeline_sensor_telemetry
        name: "Read Pigging Run & Station Sensor Telemetry"
        type: item-read
        options:
          collection: ncsp_pigging_runs
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - run_code
              - launcher_station_id
              - pipeline_segment
        position_x: 1
        position_y: 1

      - key: read_station_scada_valves
        name: "Read SCADA ESD & Launcher Barrel Valve Telemetry"
        type: item-read
        options:
          collection: ncsp_scada_valves
          key: "{{read_pipeline_sensor_telemetry.launcher_station_id}}"
          query:
            fields:
              - id
              - station_code
              - esd_valves_armed
              - bypass_lineup_correct
              - kicker_valve_open
              - barrel_pressure_equalized
              - launcher_pressure_bar
              - mainline_pressure_bar
        position_x: 20
        position_y: 1

      - key: read_cathodic_protection_status
        name: "Read Cathodic Protection Potential Telemetry"
        type: item-read
        options:
          collection: ncsp_pipeline_integrity
          key: "{{read_pipeline_sensor_telemetry.launcher_station_id}}"
          query:
            fields:
              - id
              - kilometer_post
              - cp_potential_mv
              - integrity_status
        position_x: 40
        position_y: 1

      - key: verify_pipeline_and_trap_integrity
        name: "Verify Equalized Barrel Pressure, Armed ESD & CP Limits"
        type: condition
        options:
          filter:
            _and:
              - read_station_scada_valves:
                  esd_valves_armed:
                    _eq: true
              - read_station_scada_valves:
                  bypass_lineup_correct:
                    _eq: true
              - read_station_scada_valves:
                  kicker_valve_open:
                    _eq: true
              - read_station_scada_valves:
                  barrel_pressure_equalized:
                    _eq: true
              - read_cathodic_protection_status:
                  cp_potential_mv:
                    _lte: -850.0
              - read_cathodic_protection_status:
                  cp_potential_mv:
                    _gte: -1200.0
        position_x: 60
        position_y: 1

      - key: authorize_pig_trap_operation
        name: "Authorize Pig Trap Door & Launch Sequence"
        type: item-update
        options:
          collection: ncsp_pigging_runs
          key: "{{$trigger.key}}"
          data:
            status: launch_authorized
            pig_signal_armed: true
            sensor_health: optimal_green
            launch_authorized_at: "{{$NOW}}"
        position_x: 80
        position_y: 1

      - key: notify_integrity_cleared
        name: "Notify Gas Dispatch of Cleared Pig Launch Sequence"
        type: notification
        options:
          recipient: "GAS_DISPATCH_OPERATIONS"
          subject: "SCADA & CP Verified: Pig Launch Authorized for {{read_pipeline_sensor_telemetry.run_code}}"
          message: "Launcher barrel pressure equalized. SCADA ESD interlocks armed. CP potential nominal (-850 to -1200 mV). Pig trap door sequence authorized."
        position_x: 100
        position_y: 1

      - key: engage_pig_trap_safety_inhibit
        name: "Engage Pig Trap Safety Inhibit & Set Alert"
        type: item-update
        options:
          collection: ncsp_pigging_runs
          key: "{{$trigger.key}}"
          data:
            status: launch_hold_esd_interlock
            pig_signal_armed: false
            sensor_health: degraded_alarm
            alert_flag: unequal_pressure_or_cp_abnormal
        position_x: 80
        position_y: 15

      - key: notify_integrity_fault
        name: "Alert Pipeline Superintendent of Sensor Interlock Hold"
        type: notification
        options:
          recipient: "PIPELINE_SUPERINTENDENT"
          subject: "INTEGRITY HOLD: Launch Aborted for Run {{read_pipeline_sensor_telemetry.run_code}}"
          message: "Launch sequence inhibited: SCADA reported unequalized barrel pressure, disarmed ESD valves, or CP potential out of -850 to -1200 mV range."
        position_x: 100
        position_y: 15

    edges:
      - ["$trigger", "read_pipeline_sensor_telemetry", "resolve"]
      - ["read_pipeline_sensor_telemetry", "read_station_scada_valves", "resolve"]
      - ["read_station_scada_valves", "read_cathodic_protection_status", "resolve"]
      - ["read_cathodic_protection_status", "verify_pipeline_and_trap_integrity", "resolve"]
      - ["verify_pipeline_and_trap_integrity", "authorize_pig_trap_operation", "resolve"]
      - ["authorize_pig_trap_operation", "notify_integrity_cleared", "resolve"]
      - ["verify_pipeline_and_trap_integrity", "engage_pig_trap_safety_inhibit", "reject"]
      - ["engage_pig_trap_safety_inhibit", "notify_integrity_fault", "resolve"]

  - key: ncsp-cp-iso15589-rectifier-potential-gate
    name: "ISO 15589-1 Cathodic Protection (CP) Transformer-Rectifier Instant-Off Potential & Disbondment Gate"
    description: "Evaluates Cathodic Protection transformer-rectifier polarized instant-off potentials per ISO 15589-1 / NACE SP0169. Verifies polarization remains between -850 mV and -1200 mV CSE. Resolves polarization compliance; rejects under-protection corrosion or over-protection coating disbondment, dispatching urgent field adjustment in hse_tasks."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - ncsp_cathodic_protection_rectifiers
      filter:
        status:
          _eq: survey_logged
    nodes:
      - key: read_rectifier_survey
        name: "Read Cathodic Protection Rectifier Survey Telemetry"
        type: item-read
        options:
          collection: ncsp_cathodic_protection_rectifiers
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - rectifier_tag
              - kp_location
              - on_potential_mv_cse
              - instant_off_potential_mv_cse
              - output_current_amps
              - coating_disbondment_risk
              - status
        position_x: 1
        position_y: 1

      - key: verify_polarization_window
        name: "Verify ISO 15589-1 Polarized Instant-Off Potential (-850 to -1200 mV CSE)"
        type: condition
        options:
          filter:
            _and:
              - read_rectifier_survey:
                  instant_off_potential_mv_cse:
                    _lte: -850.0
              - read_rectifier_survey:
                  instant_off_potential_mv_cse:
                    _gte: -1200.0
        position_x: 20
        position_y: 1

      - key: certify_cp_polarization
        name: "Certify Cathodic Protection Polarization Compliance"
        type: item-update
        options:
          collection: ncsp_cathodic_protection_rectifiers
          key: "{{$trigger.key}}"
          data:
            status: polarized_compliant
            coating_disbondment_risk: false
        position_x: 40
        position_y: 1

      - key: notify_cp_compliant
        name: "Notify Corrosion Team of Certified Polarization"
        type: notification
        options:
          recipient: "CORROSION_INTEGRITY_ENGINEER"
          subject: "ISO 15589-1 CP Verified: Rectifier {{read_rectifier_survey.rectifier_tag}} at KP {{read_rectifier_survey.kp_location}}"
          message: "Polarized instant-off potential {{read_rectifier_survey.instant_off_potential_mv_cse}} mV CSE is within normative range (-850 to -1200 mV CSE). CP system fully compliant."
        position_x: 60
        position_y: 1

      - key: flag_cp_polarization_fault
        name: "Flag Polarization Fault & Coating Disbondment Risk"
        type: item-update
        options:
          collection: ncsp_cathodic_protection_rectifiers
          key: "{{$trigger.key}}"
          data:
            status: polarization_fault_alarm
            coating_disbondment_risk: true
        position_x: 40
        position_y: 15

      - key: create_cp_adjustment_task
        name: "Dispatch Urgent Field Adjustment Task in HSE Tasks"
        type: item-create
        options:
          collection: hse_tasks
          data:
            task_title: "Urgent CP Rectifier Output Calibration - {{read_rectifier_survey.rectifier_tag}} at KP {{read_rectifier_survey.kp_location}}"
            unit_tag: "{{read_rectifier_survey.rectifier_tag}}"
            priority: critical
            status: assigned
            assigned_to: "Cathodic_Protection_Specialist"
            deadline_hours: 12
        position_x: 60
        position_y: 15

      - key: notify_cp_fault_alarm
        name: "Alert Corrosion Superintendent of Polarization Breach"
        type: notification
        options:
          recipient: "PIPELINE_CORROSION_SUPERINTENDENT"
          subject: "CRITICAL CP FAULT: Rectifier {{read_rectifier_survey.rectifier_tag}} at KP {{read_rectifier_survey.kp_location}} Out of Spec"
          message: "Instant-off potential {{read_rectifier_survey.instant_off_potential_mv_cse}} mV CSE violates ISO 15589-1 criteria. Potential under-protection (< -850 mV) or over-protection (> -1200 mV coating disbondment). Urgent CP field adjustment dispatched."
        position_x: 80
        position_y: 15

    edges:
      - ["$trigger", "read_rectifier_survey", "resolve"]
      - ["read_rectifier_survey", "verify_polarization_window", "resolve"]
      - ["verify_polarization_window", "certify_cp_polarization", "resolve"]
      - ["certify_cp_polarization", "notify_cp_compliant", "resolve"]
      - ["verify_polarization_window", "flag_cp_polarization_fault", "reject"]
      - ["flag_cp_polarization_fault", "create_cp_adjustment_task", "resolve"]
      - ["create_cp_adjustment_task", "notify_cp_fault_alarm", "resolve"]

  - key: ncsp-gas-quality-aga8-wobbe-dewpoint-interlock
    name: "AGA Report No. 8 / ISO 6976 Fiscal Gas Chromatograph Wobbe Index, H2S & Hydrocarbon Dew Point Interlock"
    description: "Surveillance of online gas chromatography and dew point analyzers at custody transfer metering stations per AGA Report No. 8 and ISO 6976. Verifies H2S content <= 4.0 ppm and hydrocarbon dew point <= 0.0 C. Approves custody transfer nomination or interlocks off-spec gas diversion valve and logs CAPA in grc_actions."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - ncsp_gas_metering
      filter:
        status:
          _eq: chromatograph_sampled
    nodes:
      - key: read_chromatograph_telemetry
        name: "Read Fiscal Gas Chromatograph & Moisture Analyzer Telemetry"
        type: item-read
        options:
          collection: ncsp_gas_metering
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - station_name
              - timestamp
              - delivery_rate_mmscmd
              - intake_pressure_bar
              - temperature_c
              - hydrocarbon_dew_point_c
              - h2s_content_ppm
              - status
        position_x: 1
        position_y: 1

      - key: check_gas_quality_specs
        name: "Verify AGA-8 / ISO 6976 H2S (<= 4.0 ppm) & Dew Point (<= 0.0 C)"
        type: condition
        options:
          filter:
            _and:
              - read_chromatograph_telemetry:
                  h2s_content_ppm:
                    _lte: 4.0
              - read_chromatograph_telemetry:
                  hydrocarbon_dew_point_c:
                    _lte: 0.0
        position_x: 20
        position_y: 1

      - key: approve_custody_transfer
        name: "Approve Custody Transfer Gas Nomination"
        type: item-update
        options:
          collection: ncsp_gas_metering
          key: "{{$trigger.key}}"
          data:
            status: custody_transfer_approved
        position_x: 40
        position_y: 1

      - key: notify_custody_transfer_cleared
        name: "Notify Gas Dispatch of On-Spec Custody Nomination"
        type: notification
        options:
          recipient: "GAS_DISPATCH_SUPERINTENDENT"
          subject: "AGA-8 / ISO 6976 Fiscal Gas Quality Nominal: Station {{read_chromatograph_telemetry.station_name}}"
          message: "Fiscal gas quality at {{read_chromatograph_telemetry.station_name}} conforms to contract specs: H2S={{read_chromatograph_telemetry.h2s_content_ppm}} ppm <= 4.0, HCDP={{read_chromatograph_telemetry.hydrocarbon_dew_point_c}} C. Delivery approved."
        position_x: 60
        position_y: 1

      - key: create_offspec_capa_action
        name: "Log Off-Spec Gas Quality CAPA in GRC Actions"
        type: item-create
        options:
          collection: grc_actions
          data:
            title: "Off-Spec Gas Diversion Interlock - Station {{read_chromatograph_telemetry.station_name}}"
            source_module: gas_metering_quality
            action_category: process_safety
            priority: critical
            status: open
            description: "Fiscal gas chromatograph detected off-spec gas at {{read_chromatograph_telemetry.station_name}}: H2S={{read_chromatograph_telemetry.h2s_content_ppm}} ppm (> 4.0 ppm) or Dew Point={{read_chromatograph_telemetry.hydrocarbon_dew_point_c}} C (> 0 C). Diversion interlock triggered per AGA-8/ISO-6976."
        position_x: 40
        position_y: 15

      - key: interlock_diversion_valve
        name: "Trigger SCADA Off-Spec Gas Diversion Valve Interlock"
        type: item-update
        options:
          collection: ncsp_gas_metering
          key: "{{$trigger.key}}"
          data:
            status: offspec_diverted_interlock
        position_x: 60
        position_y: 15

      - key: notify_offspec_gas_alarm
        name: "Broadcast Critical Off-Spec Gas Trip Alert"
        type: notification
        options:
          recipient: "GAS_CONTROL_CENTER_CHIEF"
          subject: "CRITICAL OFF-SPEC GAS INTERLOCK: Station {{read_chromatograph_telemetry.station_name}}"
          message: "Custody transfer halted at {{read_chromatograph_telemetry.station_name}}. H2S={{read_chromatograph_telemetry.h2s_content_ppm}} ppm, HCDP={{read_chromatograph_telemetry.hydrocarbon_dew_point_c}} C exceeds fiscal contract limits. Off-spec diversion valve activated."
        position_x: 80
        position_y: 15

    edges:
      - ["$trigger", "read_chromatograph_telemetry", "resolve"]
      - ["read_chromatograph_telemetry", "check_gas_quality_specs", "resolve"]
      - ["check_gas_quality_specs", "approve_custody_transfer", "resolve"]
      - ["approve_custody_transfer", "notify_custody_transfer_cleared", "resolve"]
      - ["check_gas_quality_specs", "create_offspec_capa_action", "reject"]
      - ["create_offspec_capa_action", "interlock_diversion_valve", "resolve"]
      - ["interlock_diversion_valve", "notify_offspec_gas_alarm", "resolve"]

  - key: ncsp-cpm-api1130-linepack-leak-detection
    name: "API RP 1130 / API RP 1175 Computational Pipeline Monitoring (CPM) Linepack Mass-Balance Leak Detection Flow"
    description: "Computational Pipeline Monitoring (CPM) transient flow model and mass-balance conservation surveillance per API RP 1130 and API RP 1175. Validates linepack inventory and inlet/outlet flow balance along the 399km trunkline. Resolves steady-state linepack or rejects on leak signature to trigger mainline ESD sectionalizing and emergency broadcast."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - ncsp_pipeline_integrity
      filter:
        status:
          _eq: cpm_mass_balance_evaluated
    nodes:
      - key: read_cpm_telemetry
        name: "Read CPM Transient Hydraulic Telemetry & Mass Balance Discrepancy"
        type: item-read
        options:
          collection: ncsp_pipeline_integrity
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - kilometer_post
              - segment_name
              - cp_potential_mv
              - integrity_status
              - status
              - mass_balance_discrepancy_pct
        position_x: 1
        position_y: 1

      - key: check_mass_balance_discrepancy
        name: "Check API RP 1130 Mass Balance Discrepancy (<= 1.0%)"
        type: condition
        options:
          filter:
            read_cpm_telemetry:
              mass_balance_discrepancy_pct:
                _lte: 1.0
        position_x: 20
        position_y: 1

      - key: record_steady_state_linepack
        name: "Record Steady-State Linepack Inventory Verified"
        type: item-update
        options:
          collection: ncsp_pipeline_integrity
          key: "{{$trigger.key}}"
          data:
            status: linepack_nominal
            integrity_status: steady_state_verified
        position_x: 40
        position_y: 1

      - key: notify_linepack_nominal
        name: "Notify Dispatch of Hydraulic Linepack Stability"
        type: notification
        options:
          recipient: "GAS_DISPATCH_SUPERINTENDENT"
          subject: "API RP 1130 CPM Nominal: Segment {{read_cpm_telemetry.segment_name}}"
          message: "Linepack mass-balance discrepancy {{read_cpm_telemetry.mass_balance_discrepancy_pct}}% is within nominal 1.0% tolerance. Pipeline hydraulics steady."
        position_x: 60
        position_y: 1

      - key: create_leak_emergency_record
        name: "Create Loss of Containment Incident in Emergency Incidents"
        type: item-create
        options:
          collection: ncsp_emergency_incidents
          data:
            incident_code: "INC-CPM-LEAK-KP{{read_cpm_telemetry.kilometer_post}}"
            segment_code: "{{read_cpm_telemetry.segment_name}}"
            kilometer_post: 120.0
            incident_type: cpm_mass_balance_leak
            gas_leak_rate_kg_s: 15.5
            esd_trip_triggered: true
            flame_detected: false
            affected_jurisdiction: Offshore_Ba_Ria_Vung_Tau
            status: emergency_declared
            esd_isolated: true
            callout_tree_broadcasted: true
            alert_flag: api1130_mass_balance_breach
        position_x: 40
        position_y: 15

      - key: update_cpm_leak_status
        name: "Update Pipeline Integrity to Leak Alarm & ESD Sequence Triggered"
        type: item-update
        options:
          collection: ncsp_pipeline_integrity
          key: "{{$trigger.key}}"
          data:
            status: leak_alarm_esd_triggered
            integrity_status: rupture_leak_suspected
        position_x: 60
        position_y: 15

      - key: notify_cpm_leak_esd
        name: "Broadcast Emergency Linepack Breach & Sectionalizing Valve Trip"
        type: notification
        options:
          recipient: "PIPELINE_EMERGENCY_DIRECTOR"
          subject: "CRITICAL API 1130 CPM LEAK ALARM: Segment {{read_cpm_telemetry.segment_name}}"
          message: "Mass-balance discrepancy {{read_cpm_telemetry.mass_balance_discrepancy_pct}}% exceeds 1.0% limit at KP {{read_cpm_telemetry.kilometer_post}}. Sectionalizing mainline ESD valves tripped. Emergency broadcast dispatched."
        position_x: 80
        position_y: 15

    edges:
      - ["$trigger", "read_cpm_telemetry", "resolve"]
      - ["read_cpm_telemetry", "check_mass_balance_discrepancy", "resolve"]
      - ["check_mass_balance_discrepancy", "record_steady_state_linepack", "resolve"]
      - ["record_steady_state_linepack", "notify_linepack_nominal", "resolve"]
      - ["check_mass_balance_discrepancy", "create_leak_emergency_record", "reject"]
      - ["create_leak_emergency_record", "update_cpm_leak_status", "resolve"]
      - ["update_cpm_leak_status", "notify_cpm_leak_esd", "resolve"]

  - key: ncsp-hca-b318s-class-location-upgrade
    name: "ASME B31.8S High Consequence Area (HCA) Class Location Upgrade & MAOP Requalification Gate"
    description: "Manages High Consequence Area (HCA) population density surveys and Class Location reclassification per ASME B31.8 / ASME B31.8S. Checks if current class location exceeds previous class location (e.g. Class 1 to Class 2/3 due to urbanization). Confirms existing design factor adequacy or mandates MAOP derating and hydrotest requalification in ncsp_maop_deratings."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - ncsp_hca_class_assessments
      filter:
        status:
          _eq: population_density_surveyed
    nodes:
      - key: read_hca_survey
        name: "Read High Consequence Area Class Location Survey Telemetry"
        type: item-read
        options:
          collection: ncsp_hca_class_assessments
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - segment_id
              - kp_start
              - kp_end
              - previous_class_location
              - current_class_location
              - dwelling_count_within_200m
              - design_factor_f
              - requalification_method
              - status
        position_x: 1
        position_y: 1

      - key: check_class_location_change
        name: "Check Class Location Population Density Stability (Dwellings <= 10)"
        type: condition
        options:
          filter:
            read_hca_survey:
              dwelling_count_within_200m:
                _lte: 10
        position_x: 20
        position_y: 1

      - key: confirm_class_design_adequacy
        name: "Confirm ASME B31.8 Design Factor Adequacy"
        type: item-update
        options:
          collection: ncsp_hca_class_assessments
          key: "{{$trigger.key}}"
          data:
            status: design_factor_adequate
            requalification_method: none_class_stable
        position_x: 40
        position_y: 1

      - key: notify_class_adequate
        name: "Notify Engineering of Class Location Confirmation"
        type: notification
        options:
          recipient: "PIPELINE_INTEGRITY_SUPERINTENDENT"
          subject: "ASME B31.8 Class Location Confirmed: Segment {{read_hca_survey.segment_id}}"
          message: "Dwelling count {{read_hca_survey.dwelling_count_within_200m}} within 200m buffer confirms Class {{read_hca_survey.current_class_location}} stability for KP {{read_hca_survey.kp_start}} to {{read_hca_survey.kp_end}}. Design factor F={{read_hca_survey.design_factor_f}} is adequate."
        position_x: 60
        position_y: 1

      - key: create_maop_requalification_derating
        name: "Initiate ASME B31.8S MAOP Derating & Hydrotest Requalification"
        type: item-create
        options:
          collection: ncsp_maop_deratings
          data:
            segment_code: "{{read_hca_survey.segment_id}}"
            kilometer_post: 12.5
            design_maop_bar: 70.0
            current_operating_pressure_bar: 68.0
            calculated_safe_pressure_bar: 56.0
            derated_maop_bar: 56.0
            erf_ratio: 1.25
            status: derating_evaluation_requested
            scada_setpoint_updated: false
        position_x: 40
        position_y: 15

      - key: update_hca_assessment_derating_mandated
        name: "Update HCA Record to Derating & Hydrotest Mandated"
        type: item-update
        options:
          collection: ncsp_hca_class_assessments
          key: "{{$trigger.key}}"
          data:
            status: derating_and_hydrotest_mandated
            requalification_method: hydrotest_and_maop_derating
        position_x: 60
        position_y: 15

      - key: notify_hca_upgrade_action
        name: "Alert Chief Engineering Officer of Mandatory Class Upgrade Action"
        type: notification
        options:
          recipient: "CHIEF_ENGINEERING_OFFICER"
          subject: "ASME B31.8S MANDATORY UPGRADE: Segment {{read_hca_survey.segment_id}} Class Location Escalation"
          message: "Class location upgrade detected due to dwelling count {{read_hca_survey.dwelling_count_within_200m}} > 10 between KP {{read_hca_survey.kp_start}} and {{read_hca_survey.kp_end}}. Design factor derating or hydrotest requalification initiated in ncsp_maop_deratings."
        position_x: 80
        position_y: 15

    edges:
      - ["$trigger", "read_hca_survey", "resolve"]
      - ["read_hca_survey", "check_class_location_change", "resolve"]
      - ["check_class_location_change", "confirm_class_design_adequacy", "resolve"]
      - ["confirm_class_design_adequacy", "notify_class_adequate", "resolve"]
      - ["check_class_location_change", "create_maop_requalification_derating", "reject"]
      - ["create_maop_requalification_derating", "update_hca_assessment_derating_mandated", "resolve"]
      - ["update_hca_assessment_derating_mandated", "notify_hca_upgrade_action", "resolve"]

rules:
  - rule_id: NCSP-PIG-001
    name: "Pig Trap Equalization Pressure Rule"
    description: "Launcher barrel pressure must match mainline pressure within +/- 0.5 bar before kicker valve throttle."
    severity: critical
    condition: "abs(launcher_pressure_bar - mainline_pressure_bar) <= 0.5"
    enforcement: strict_rejection
    action: "Inhibit launcher trap interlock and alert pigging technician."

  - rule_id: NCSP-CP-002
    name: "Cathodic Protection Potential Safe Range"
    description: "Subsea and onshore pipeline CP potential must remain between -850 mV and -1200 mV CSE per NACE SP0169."
    severity: high
    condition: "cp_potential_mv <= -850.0 && cp_potential_mv >= -1200.0"
    enforcement: warning
    action: "Log corrosion mitigation work order and dispatch technician."

  - rule_id: NCSP-B31G-003
    name: "ASME B31G Estimated Repair Factor Limit"
    description: "Corrosion anomalies with Estimated Repair Factor (ERF = MAOP / Safe Operating Pressure) > 1.0 require immediate MAOP derating or repair sleeve installation."
    severity: critical
    condition: "erf_ratio <= 1.0"
    enforcement: strict_rejection
    action: "Trigger automatic MAOP derating and dispatch emergency repair sleeve."

  - rule_id: NCSP-ROW-004
    name: "Right-of-Way 50-Meter Safety Corridor Protection"
    description: "Excavation and heavy mechanical earthmoving within 50 meters of the 26-inch trunkline is strictly prohibited without specialized permit."
    severity: critical
    condition: "distance_to_pipeline_m > 50.0"
    enforcement: strict_rejection
    action: "Suspend nearby excavation permits and dispatch security intercept."

  - rule_id: NCSP-CP-004
    name: "ISO 15589-1 Polarized Instant-Off Potential Safe Range"
    description: "Cathodic protection polarized instant-off potential must remain between -850 mV and -1200 mV CSE per ISO 15589-1 to prevent under-protection corrosion or over-protection coating disbondment."
    severity: critical
    condition: "instant_off_potential_mv_cse <= -850.0 && instant_off_potential_mv_cse >= -1200.0"
    enforcement: strict_rejection
    action: "Block CP compliance certification and trigger urgent transformer-rectifier output adjustment."

  - rule_id: NCSP-AGA8-005
    name: "AGA Report No. 8 / ISO 6976 Fiscal Gas Quality Standard"
    description: "Fiscal custody transfer gas delivery must satisfy H2S content <= 4.0 ppm and hydrocarbon dew point <= 0.0 deg C per AGA Report No. 8 and ISO 6976."
    severity: critical
    condition: "h2s_content_ppm <= 4.0 && hydrocarbon_dew_point_c <= 0.0"
    enforcement: strict_rejection
    action: "Trigger off-spec gas diversion valve interlock and log corrective action in grc_actions."

