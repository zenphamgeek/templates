template_id: mining_minerals_tkv
version: 1.0.0
industry_vertical: mining_metals
archetype: "Vinacomin & Masan High-Tech Minerals Archetype"

metadata:
  name: "Vinacomin & Masan High-Tech Minerals Mining Resilience Template"
  description: "Operational resilience, underground shaft ventilation, methane (CH4) drainage interlocks, open-pit slope stability radar, and tailings storage facility (TSF) integrity monitoring for coal and polymetallic mining operations."
  status: VERIFIED
  author: "Industry Template Architect & Mining Specialist"
  approver: "Zen Phạm"
  created_at: "2026-10-04"
  tags:
    - mining
    - minerals
    - coal
    - underground_ventilation
    - methane_ch4
    - slope_stability
    - tailings_dam
    - blasting
  regulatory_frameworks:
    - "QCVN 01:2011/BCT National Technical Regulation on Safety in Underground Coal Mining"
    - "TCVN 5178:1990 Safety in Surface Mining and Quarrying"
    - "ICMM Global Industry Standard on Tailings Management (GISTM)"
    - "OSHA 30 CFR Federal Mine Safety and Health Standards"

taxonomy_and_fields:
  collections:
    - collection: tkv_underground_ventilation
      name: "Underground Shaft Atmospheric Telemetry"
      description: "Continuous telemetry measuring methane (CH4), air velocity, and carbon monoxide in underground mine shafts and longwall working faces."
      fields:
        - field: id
          type: uuid
        - field: sensor_tag
          type: string
        - field: shaft_code
          type: string
        - field: methane_ch4_percent
          type: float
        - field: air_velocity_m_s
          type: float
        - field: co_ppm
          type: float
        - field: ventilation_status
          type: string
        - field: timestamp
          type: timestamp

    - collection: tkv_slope_stability
      name: "Open-Pit Slope Stability Radar"
      description: "Interferometric radar monitoring millimeter-scale bench slope deformation and displacement velocity in surface pits."
      fields:
        - field: id
          type: uuid
        - field: radar_id
          type: string
        - field: bench_sector
          type: string
        - field: cumulative_displacement_mm
          type: float
        - field: displacement_velocity_mm_day
          type: float
        - field: stability_risk_index
          type: string
        - field: timestamp
          type: timestamp

    - collection: tkv_blasting_permits
      name: "Controlled Blasting & Evacuation Clearances"
      description: "Electronic blasting permits requiring radial perimeter evacuation verification and seismic vibration clearance."
      fields:
        - field: id
          type: uuid
        - field: permit_no
          type: string
        - field: bench_sector
          type: string
        - field: explosive_charge_kg
          type: float
        - field: perimeter_swept
          type: boolean
        - field: evacuation_completed
          type: boolean
        - field: status
          type: string
        - field: work_authorized
          type: boolean
        - field: rejection_reason
          type: text

    - collection: tkv_tailings_dam_sensors
      name: "Tailings Dam Piezometer & Phreatic Sensors"
      description: "Pore water pressure and phreatic surface levels in downstream embankment tailings storage facilities."
      fields:
        - field: id
          type: uuid
        - field: piezometer_tag
          type: string
        - field: dam_sector
          type: string
        - field: pore_pressure_kpa
          type: float
        - field: phreatic_level_m
          type: float
        - field: safety_status
          type: string
        - field: timestamp
          type: timestamp

    - collection: tkv_mine_kpis
      name: "Mine Production & Safety Aggregated KPIs"
      description: "Aggregated metrics for extracted mineral volume, methane drainage recovery, and open-pit safety."
      fields:
        - field: id
          type: uuid
        - field: recorded_date
          type: date
        - field: raw_coal_output_mt
          type: float
        - field: tungsten_concentrate_mt
          type: float
        - field: ch4_drainage_efficiency_pct
          type: float
        - field: active_slope_alarms
          type: integer

    - collection: tkv_fan_station_telemetry
      name: "Main Shaft Exhaust Ventilation Fan Telemetry"
      description: "Fan static depression, vibration velocity, airflow volume, and auto-switchover status."
      fields:
        - field: id
          type: uuid
        - field: station_code
          type: string
        - field: main_fan_status
          type: string
        - field: backup_fan_status
          type: string
        - field: main_fan_differential_pressure_pa
          type: float
        - field: vibration_mm_s
          type: float
        - field: airflow_m3_s
          type: float
        - field: auto_switchover_ready
          type: boolean
        - field: ventilation_status
          type: string
        - field: timestamp
          type: timestamp

    - collection: tkv_dewatering_sump_telemetry
      name: "Underground Dewatering Sump & Hydrogeological Telemetry"
      description: "Main mine drainage sump levels, water inflow rates, turbine pump status, and probe pressures."
      fields:
        - field: id
          type: uuid
        - field: sump_tag
          type: string
        - field: shaft_level
          type: string
        - field: sump_level_pct
          type: float
        - field: water_inflow_m3_hr
          type: float
        - field: lead_pump_status
          type: string
        - field: lag_pump_ready
          type: boolean
        - field: advance_probe_pressure_bar
          type: float
        - field: dewatering_status
          type: string
        - field: timestamp
          type: timestamp

    - collection: tkv_miner_shift_dispatches
      name: "Miner Shift Descent & Fit-for-Duty Verifications"
      description: "Turnstile descent permits verifying post-blast toxic gas clearance, dust levels, and breathalyzer."
      fields:
        - field: id
          type: uuid
        - field: dispatch_no
          type: string
        - field: miner_id
          type: uuid
        - field: shaft_code
          type: string
        - field: post_blast_clearance_minutes
          type: integer
        - field: respirable_dust_mg_m3
          type: float
        - field: gas_co_ppm
          type: float
        - field: gas_no2_ppm
          type: float
        - field: miner_fit_for_duty
          type: boolean
        - field: breathalyzer_zero
          type: boolean
        - field: status
          type: string
        - field: work_authorized
          type: boolean
        - field: rejection_reason
          type: text

    - collection: grc_actions
      name: "Enterprise Corrective & Preventive Actions (CAPA)"
      description: "Remediation workflows, root cause mitigation actions, and statutory mining safety directives."
      fields:
        - field: id
          type: uuid
        - field: status
          type: string
        - field: title
          type: string
        - field: priority
          type: string
        - field: source_module
          type: string
        - field: action_category
          type: string
        - field: description
          type: string
        - field: assigned_to
          type: string

    - collection: hse_tasks
      name: "Operational Safety Tasks"
      description: "Discrete actionable field instructions dispatched to underground and open-pit mining personnel."
      fields:
        - field: id
          type: uuid
        - field: status
          type: string
        - field: title
          type: string
        - field: task_title
          type: string
        - field: priority
          type: string
        - field: unit_tag
          type: string
        - field: assigned_to
          type: string
        - field: deadline_hours
          type: integer

  relations:
    - collection: tkv_blasting_permits
      field: bench_sector
      related_collection: tkv_slope_stability
      type: m2o

  equipment_taxonomy:
    plant_code: TKV_QUANGNINH_MINES
    areas:
      - code: "UG_MAOKHE"
        name: "Mao Khe Underground Coal Mine (-150m to -350m)"
        systems:
          - code: "LW1"
            name: "Mechanized Longwall Face 1"
          - code: "VENT_MAIN"
            name: "Main Exhaust Ventilation Fan Station"
          - code: "METH_DRAIN"
            name: "Surface Gas Drainage Vacuum Plant"
      - code: "OP_COCSAU"
        name: "Coc Sau Open-Pit Surface Coal Mine"
        systems:
          - code: "NORTH_WALL"
            name: "North Pit Wall Highwall Benches"
          - code: "HAUL_ROAD_A"
            name: "Primary Overburden Haulage Ramp"
      - code: "NUIDAO_TSF"
        name: "Nui Phao Polymetallic Tailings Storage Facility"
        systems:
          - code: "DAM_CREST"
            name: "Downstream Embankment Crest & Piezometer Array"
          - code: "SPILLWAY"
            name: "Emergency Decant Tower and Flood Spillway"

business_flows:
  - key: tkv-ch4-ventilation-safety-trip
    name: "Underground Methane (CH4) Safety Interlock Flow"
    description: "Evaluates underground return airway methane concentration. If CH4 exceeds 1.0%, automatically triggers power trip to longwall shearer and escalates ventilation airflow."
    status: active
    accountability: system
    trigger:
      type: event
      scope:
        - items.create
        - items.update
      collections:
        - tkv_underground_ventilation
    nodes:
      - key: read_ch4_telemetry
        name: "Read Shaft Methane & Airflow Telemetry"
        type: item-read
        options:
          collection: tkv_underground_ventilation
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - sensor_tag
              - shaft_code
              - methane_ch4_percent
              - air_velocity_m_s
              - ventilation_status
        position_x: 1
        position_y: 1

      - key: verify_ch4_safety_limit
        name: "Check if Methane Exceeds Safety Limit (>= 1.0%)"
        type: condition
        options:
          filter:
            read_ch4_telemetry:
              methane_ch4_percent:
                _gte: 1.0
        position_x: 25
        position_y: 1

      - key: execute_shearer_power_trip
        name: "Trip Power to Longwall Shearer & Alert Mine Safety"
        type: item-update
        options:
          collection: tkv_underground_ventilation
          key: "{{$trigger.key}}"
          data:
            ventilation_status: METHANE_INTERLOCK_TRIPPED
        position_x: 50
        position_y: 1

      - key: broadcast_underground_evacuation
        name: "Broadcast Shaft Evacuation Alert to Underground Shift"
        type: notification
        options:
          recipient: "{{$trigger.payload.shaft_shift_leader_id}}"
          subject: "EMERGENCY: Methane Gas Interlock Tripped in Shaft {{read_ch4_telemetry.shaft_code}}"
          message: "Critical CH4 level ({{read_ch4_telemetry.methane_ch4_percent}}%) detected at {{read_ch4_telemetry.sensor_tag}}. Power disconnected to face equipment. Evacuate intake airway immediately."
        position_x: 75
        position_y: 1

      - key: confirm_normal_ventilation
        name: "Confirm Safe Atmospheric Condition"
        type: transform
        options:
          format: json
          expression: "Methane level within QCVN 01:2011/BCT safe limits (< 1.0%)."
        position_x: 50
        position_y: 15

    edges:
      - ["$trigger", "read_ch4_telemetry", "resolve"]
      - ["read_ch4_telemetry", "verify_ch4_safety_limit", "resolve"]
      - ["verify_ch4_safety_limit", "execute_shearer_power_trip", "resolve"]
      - ["execute_shearer_power_trip", "broadcast_underground_evacuation", "resolve"]
      - ["verify_ch4_safety_limit", "confirm_normal_ventilation", "reject"]

  - key: tkv-blasting-evacuation-ptw
    name: "Open-Pit Blasting Clearance & Perimeter Verification Flow"
    description: "Enforces 100% perimeter guard sweep, explosive safety clearance, and slope stability check before firing pit blast rounds."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - tkv_blasting_permits
      filter:
        status:
          _eq: blast_submitted
    nodes:
      - key: read_blast_permit
        name: "Read Blasting Permit & Evacuation Record"
        type: item-read
        options:
          collection: tkv_blasting_permits
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - permit_no
              - bench_sector
              - explosive_charge_kg
              - perimeter_swept
              - evacuation_completed
        position_x: 1
        position_y: 1

      - key: verify_blast_clearance_safeguards
        name: "Verify Blast Perimeter Swept and Evacuated"
        type: condition
        options:
          filter:
            _and:
              - read_blast_permit:
                  perimeter_swept:
                    _eq: true
              - read_blast_permit:
                  evacuation_completed:
                    _eq: true
        position_x: 25
        position_y: 1

      - key: authorize_blast_initiation
        name: "Authorize Controlled Blasting Sequence"
        type: item-update
        options:
          collection: tkv_blasting_permits
          key: "{{$trigger.key}}"
          data:
            status: blast_authorized
            work_authorized: true
        position_x: 50
        position_y: 1

      - key: notify_blasting_controller
        name: "Notify Blasting Controller of Safe Clearance"
        type: notification
        options:
          recipient: "{{$trigger.payload.blasting_controller_id}}"
          subject: "Blasting Authorized: {{read_blast_permit.permit_no}} on Bench {{read_blast_permit.bench_sector}}"
          message: "All perimeter guards stationed and personnel accounted for. Authorized to initiate firing sequence."
        position_x: 75
        position_y: 1

      - key: reject_blast_clearance
        name: "Reject Blasting Clearance Due to Incomplete Evacuation"
        type: item-update
        options:
          collection: tkv_blasting_permits
          key: "{{$trigger.key}}"
          data:
            status: blast_rejected_incomplete_evacuation
            work_authorized: false
            rejection_reason: "Perimeter sweep incomplete or personnel remain inside designated blast exclusion radius."
        position_x: 50
        position_y: 15

      - key: alert_pit_superintendent
        name: "Alert Pit Superintendent of Aborted Blast"
        type: notification
        options:
          recipient: "{{$trigger.payload.pit_superintendent_id}}"
          subject: "BLAST ABORTED: Incomplete Evacuation on Bench {{read_blast_permit.bench_sector}}"
          message: "Blasting permit {{read_blast_permit.permit_no}} rejected. Firing sequence blocked."
        position_x: 75
        position_y: 15

    edges:
      - ["$trigger", "read_blast_permit", "resolve"]
      - ["read_blast_permit", "verify_blast_clearance_safeguards", "resolve"]
      - ["verify_blast_clearance_safeguards", "authorize_blast_initiation", "resolve"]
      - ["authorize_blast_initiation", "notify_blasting_controller", "resolve"]
      - ["verify_blast_clearance_safeguards", "reject_blast_clearance", "reject"]
      - ["reject_blast_clearance", "alert_pit_superintendent", "resolve"]

  - key: tkv-main-ventilation-fan-switchover
    name: "Main Ventilation Fan Redundancy Switchover & Depression Interlock"
    description: "Evaluates main shaft ventilation fan differential pressure (>= 1200 Pa), vibration (<= 4.5 mm/s), and airflow. Automatically engages standby backup fan if operating fan degrades."
    status: active
    accountability: system
    trigger:
      type: event
      scope:
        - items.create
        - items.update
      collections:
        - tkv_fan_station_telemetry
    nodes:
      - key: read_fan_telemetry
        name: "Read Main Ventilation Fan Telemetry"
        type: item-read
        options:
          collection: tkv_fan_station_telemetry
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - station_code
              - main_fan_status
              - backup_fan_status
              - main_fan_differential_pressure_pa
              - vibration_mm_s
              - airflow_m3_s
              - auto_switchover_ready
        position_x: 1
        position_y: 1

      - key: verify_fan_operating_envelope
        name: "Verify Pressure >= 1200 Pa, Vibration <= 4.5 mm/s, Airflow >= 80 m³/s"
        type: condition
        options:
          filter:
            _and:
              - read_fan_telemetry:
                  main_fan_differential_pressure_pa:
                    _gte: 1200.0
              - read_fan_telemetry:
                  vibration_mm_s:
                    _lte: 4.5
              - read_fan_telemetry:
                  airflow_m3_s:
                    _gte: 80.0
        position_x: 25
        position_y: 1

      - key: confirm_nominal_fan_operation
        name: "Confirm Nominal Shaft Exhaust Flow"
        type: transform
        options:
          format: json
          expression: "Main shaft ventilation fan operating within QCVN 01:2011/BCT nominal parameters."
        position_x: 50
        position_y: 1

      - key: execute_backup_fan_switchover
        name: "Execute Standby Fan Auto-Start & Reversal Damper Shift"
        type: item-update
        options:
          collection: tkv_fan_station_telemetry
          key: "{{$trigger.key}}"
          data:
            main_fan_status: FAULT_TRIPPED
            backup_fan_status: RUNNING_STANDBY_ENGAGED
            ventilation_status: FAN_ALARM_STANDBY_ENGAGED
        position_x: 50
        position_y: 15

      - key: alert_mine_dispatch_of_fan_trip
        name: "Alert Mine Chief Engineer & Underground Shift Dispatcher"
        type: notification
        options:
          recipient: "{{$trigger.payload.mine_dispatcher_id}}"
          subject: "FAN FAULT: Standby Switchover Engaged at Station {{read_fan_telemetry.station_code}}"
          message: "Main ventilation fan tripped (low pressure or excessive vibration). Standby fan engaged. Monitor face airflow."
        position_x: 75
        position_y: 15
    edges:
      - ["$trigger", "read_fan_telemetry", "resolve"]
      - ["read_fan_telemetry", "verify_fan_operating_envelope", "resolve"]
      - ["verify_fan_operating_envelope", "confirm_nominal_fan_operation", "resolve"]
      - ["verify_fan_operating_envelope", "execute_backup_fan_switchover", "reject"]
      - ["execute_backup_fan_switchover", "alert_mine_dispatch_of_fan_trip", "resolve"]

  - key: tkv-tsf-pore-pressure-spillway-gate
    name: "Tailings Storage Facility (TSF) Piezometer & Emergency Spillway Gate"
    description: "Evaluates downstream dam embankment pore water pressure (<= 150 kPa), phreatic surface, and slope velocity. Triggers emergency spillway siphons if geotechnical stability limits are breached."
    status: active
    accountability: system
    trigger:
      type: event
      scope:
        - items.create
        - items.update
      collections:
        - tkv_tailings_dam_sensors
    nodes:
      - key: read_tsf_telemetry
        name: "Read Piezometer & Dam Embankment Sensors"
        type: item-read
        options:
          collection: tkv_tailings_dam_sensors
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - piezometer_tag
              - dam_sector
              - pore_pressure_kpa
              - phreatic_level_m
              - safety_status
        position_x: 1
        position_y: 1

      - key: verify_tsf_stability_envelope
        name: "Verify Pore Pressure <= 150 kPa and Phreatic Level <= 18m"
        type: condition
        options:
          filter:
            _and:
              - read_tsf_telemetry:
                  pore_pressure_kpa:
                    _lte: 150.0
              - read_tsf_telemetry:
                  phreatic_level_m:
                    _lte: 18.0
        position_x: 25
        position_y: 1

      - key: log_nominal_dam_phreatic_line
        name: "Log Nominal Embankment Phreatic Line"
        type: transform
        options:
          format: json
          expression: "Tailings dam pore pressure and phreatic surface line compliant with GISTM criteria."
        position_x: 50
        position_y: 1

      - key: trigger_emergency_spillway_decant
        name: "Trigger Emergency Decant Siphons & Declare Geotechnical Alert"
        type: item-update
        options:
          collection: tkv_tailings_dam_sensors
          key: "{{$trigger.key}}"
          data:
            safety_status: DAM_PIEZOMETRIC_EXCEEDANCE_ALERT
        position_x: 50
        position_y: 15

      - key: broadcast_dam_geotechnical_alarm
        name: "Broadcast GISTM High Priority Alarm to Dam Safety Engineer"
        type: notification
        options:
          recipient: "{{$trigger.payload.dam_safety_engineer_id}}"
          subject: "TSF GEOTECHNICAL ALERT: High Pore Pressure in Sector {{read_tsf_telemetry.dam_sector}}"
          message: "Piezometer {{read_tsf_telemetry.piezometer_tag}} reached {{read_tsf_telemetry.pore_pressure_kpa}} kPa. Emergency spillway drawdown triggered."
        position_x: 75
        position_y: 15
    edges:
      - ["$trigger", "read_tsf_telemetry", "resolve"]
      - ["read_tsf_telemetry", "verify_tsf_stability_envelope", "resolve"]
      - ["verify_tsf_stability_envelope", "log_nominal_dam_phreatic_line", "resolve"]
      - ["verify_tsf_stability_envelope", "trigger_emergency_spillway_decant", "reject"]
      - ["trigger_emergency_spillway_decant", "broadcast_dam_geotechnical_alarm", "resolve"]

  - key: tkv-underground-dewatering-pump-gate
    name: "Underground Mine Main Dewatering Pump Redundancy & Inrush Gate"
    description: "Surveils main shaft drainage sumps. If water level exceeds 75% or advance probe detects high pressure fissure (> 15 bar), automatically starts lag turbine pumps."
    status: active
    accountability: system
    trigger:
      type: event
      scope:
        - items.create
        - items.update
      collections:
        - tkv_dewatering_sump_telemetry
    nodes:
      - key: read_sump_telemetry
        name: "Read Mine Sump Level & Advance Borehole Probe"
        type: item-read
        options:
          collection: tkv_dewatering_sump_telemetry
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - sump_tag
              - shaft_level
              - sump_level_pct
              - water_inflow_m3_hr
              - lead_pump_status
              - lag_pump_ready
              - advance_probe_pressure_bar
        position_x: 1
        position_y: 1

      - key: verify_dewatering_headroom
        name: "Verify Sump Level <= 75%, Inflow <= 250 m³/h, Probe Pressure <= 15 bar"
        type: condition
        options:
          filter:
            _and:
              - read_sump_telemetry:
                  sump_level_pct:
                    _lte: 75.0
              - read_sump_telemetry:
                  water_inflow_m3_hr:
                    _lte: 250.0
              - read_sump_telemetry:
                  advance_probe_pressure_bar:
                    _lte: 15.0
        position_x: 25
        position_y: 1

      - key: maintain_lead_pump_nominal
        name: "Maintain Lead Pump Nominal Dewatering"
        type: transform
        options:
          format: json
          expression: "Mine shaft water inflow is within lead pump capacity; normal dewatering status."
        position_x: 50
        position_y: 1

      - key: cascade_lag_pumps_emergency
        name: "Cascade Auxiliary High-Volume Pumps & Flag High Water Alarm"
        type: item-update
        options:
          collection: tkv_dewatering_sump_telemetry
          key: "{{$trigger.key}}"
          data:
            dewatering_status: SUMP_HIGH_WATER_ALARM
        position_x: 50
        position_y: 15

      - key: notify_drainage_superintendent
        name: "Alert Drainage Superintendent & Longwall Shift Lead"
        type: notification
        options:
          recipient: "{{$trigger.payload.drainage_superintendent_id}}"
          subject: "WATER INRUSH ALERT: Sump {{read_sump_telemetry.sump_tag}} on Level {{read_sump_telemetry.shaft_level}}"
          message: "Water inflow ({{read_sump_telemetry.water_inflow_m3_hr}} m³/h) or probe pressure ({{read_sump_telemetry.advance_probe_pressure_bar}} bar) exceeded limit. Lag pumps cascaded."
        position_x: 75
        position_y: 15
    edges:
      - ["$trigger", "read_sump_telemetry", "resolve"]
      - ["read_sump_telemetry", "verify_dewatering_headroom", "resolve"]
      - ["verify_dewatering_headroom", "maintain_lead_pump_nominal", "resolve"]
      - ["verify_dewatering_headroom", "cascade_lag_pumps_emergency", "reject"]
      - ["cascade_lag_pumps_emergency", "notify_drainage_superintendent", "resolve"]

  - key: tkv-respirable-dust-post-blast-health-gate
    name: "Respirable Silica Dust, Post-Blast Toxic Gas & Miner Fit-for-Duty Descent Gate"
    description: "Controls underground turnstile shaft descent. Verifies post-blast clearance time (>= 30 min), face dust (<= 4.0 mg/m³), CO <= 20 ppm, NO2 <= 5 ppm, and miner breathalyzer zero."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - tkv_miner_shift_dispatches
      filter:
        status:
          _eq: descent_requested
    nodes:
      - key: read_miner_dispatch
        name: "Read Shift Dispatch & Atmospheric Clearance Data"
        type: item-read
        options:
          collection: tkv_miner_shift_dispatches
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - dispatch_no
              - miner_id
              - shaft_code
              - post_blast_clearance_minutes
              - respirable_dust_mg_m3
              - gas_co_ppm
              - gas_no2_ppm
              - miner_fit_for_duty
              - breathalyzer_zero
        position_x: 1
        position_y: 1

      - key: verify_environmental_and_fitness_envelope
        name: "Verify Blast Clearance >= 30m, Dust <= 4.0 mg/m³, CO <= 20, NO2 <= 5, and Breathalyzer Zero"
        type: condition
        options:
          filter:
            _and:
              - read_miner_dispatch:
                  post_blast_clearance_minutes:
                    _gte: 30
              - read_miner_dispatch:
                  respirable_dust_mg_m3:
                    _lte: 4.0
              - read_miner_dispatch:
                  gas_co_ppm:
                    _lte: 20.0
              - read_miner_dispatch:
                  gas_no2_ppm:
                    _lte: 5.0
              - read_miner_dispatch:
                  miner_fit_for_duty:
                    _eq: true
              - read_miner_dispatch:
                  breathalyzer_zero:
                    _eq: true
        position_x: 25
        position_y: 1

      - key: authorize_shaft_turnstile_descent
        name: "Authorize Shaft Turnstile Descent"
        type: item-update
        options:
          collection: tkv_miner_shift_dispatches
          key: "{{$trigger.key}}"
          data:
            status: descent_authorized
            work_authorized: true
        position_x: 50
        position_y: 1

      - key: notify_lamp_room_controller
        name: "Notify Lamp Room Controller of Clearance"
        type: notification
        options:
          recipient: "{{$trigger.payload.lamp_room_controller_id}}"
          subject: "Descent Authorized: Dispatch {{read_miner_dispatch.dispatch_no}} for Shaft {{read_miner_dispatch.shaft_code}}"
          message: "Post-blast toxic gases cleared, dust within limits, and miner fit-for-duty verified. Turnstile unlocked."
        position_x: 75
        position_y: 1

      - key: block_turnstile_shaft_descent
        name: "Block Shaft Turnstile Due to Health Hazard Violation"
        type: item-update
        options:
          collection: tkv_miner_shift_dispatches
          key: "{{$trigger.key}}"
          data:
            status: descent_blocked_health_hazard
            work_authorized: false
            rejection_reason: "Post-blast fumes remaining (CO/NO2), respirable dust exceeded, or failed breathalyzer test."
        position_x: 50
        position_y: 15

      - key: alert_occupational_health_officer
        name: "Alert Occupational Health Officer of Descent Inhibit"
        type: notification
        options:
          recipient: "{{$trigger.payload.health_officer_id}}"
          subject: "DESCENT BLOCKED: Health Hazard Violation on Shaft {{read_miner_dispatch.shaft_code}}"
          message: "Turnstile access prohibited for dispatch {{read_miner_dispatch.dispatch_no}}: toxic gas or unfit status."
        position_x: 75
        position_y: 15
    edges:
      - ["$trigger", "read_miner_dispatch", "resolve"]
      - ["read_miner_dispatch", "verify_environmental_and_fitness_envelope", "resolve"]
      - ["verify_environmental_and_fitness_envelope", "authorize_shaft_turnstile_descent", "resolve"]
      - ["authorize_shaft_turnstile_descent", "notify_lamp_room_controller", "resolve"]
      - ["verify_environmental_and_fitness_envelope", "block_turnstile_shaft_descent", "reject"]
      - ["block_turnstile_shaft_descent", "alert_occupational_health_officer", "resolve"]

  - key: tkv-spontaneous-combustion-co-goaf-gate
    name: "Underground Coal Goaf Spontaneous Combustion CO & Inertization Gate"
    description: "Monitors underground return airway carbon monoxide (<= 24.0 ppm) and air velocity (>= 1.5 m/s) for early detection of coal seam spontaneous heating; triggers nitrogen inertization task on breach."
    status: active
    accountability: system
    trigger:
      type: event
      scope:
        - items.create
        - items.update
      collections:
        - tkv_underground_ventilation
    nodes:
      - key: read_goaf_co_telemetry
        name: "Read Underground Shaft CO & Air Velocity Telemetry"
        type: item-read
        options:
          collection: tkv_underground_ventilation
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - sensor_tag
              - shaft_code
              - co_ppm
              - air_velocity_m_s
              - ventilation_status
        position_x: 1
        position_y: 1

      - key: verify_goaf_co_and_airflow
        name: "Verify CO <= 24.0 ppm and Air Velocity >= 1.5 m/s"
        type: condition
        options:
          filter:
            _and:
              - read_goaf_co_telemetry:
                  co_ppm:
                    _lte: 24.0
              - read_goaf_co_telemetry:
                  air_velocity_m_s:
                    _gte: 1.5
        position_x: 25
        position_y: 1

      - key: confirm_goaf_thermal_stability
        name: "Confirm Goaf Oxidation & Ventilation Within Safe Limits"
        type: transform
        options:
          format: json
          expression: "Underground CO concentration and air velocity indicate zero spontaneous combustion activity."
        position_x: 50
        position_y: 1

      - key: escalate_goaf_co_inertization
        name: "Set Ventilation Status to GOAF_CO_INERTIZATION_REQUIRED"
        type: item-update
        options:
          collection: tkv_underground_ventilation
          key: "{{$trigger.key}}"
          data:
            ventilation_status: GOAF_CO_INERTIZATION_REQUIRED
        position_x: 50
        position_y: 15

      - key: create_goaf_inertization_task
        name: "Create Nitrogen Foam Inertization & Seal Inspection Task"
        type: item-create
        options:
          collection: hse_tasks
          data:
            title: "Inject N2 / Inhibitor Foam into Goaf Sector at Shaft {{read_goaf_co_telemetry.shaft_code}}"
            task_title: "Inject N2 / Inhibitor Foam into Goaf Sector"
            status: assigned
            priority: critical
            unit_tag: "GOAF-N2-SYSTEM"
            assigned_to: "Mine_Rescue_Ventilation_Team"
            deadline_hours: 1
        position_x: 75
        position_y: 15

      - key: notify_ventilation_chief
        name: "Alert Chief Ventilation Engineer of Spontaneous Heating Hazard"
        type: notification
        options:
          recipient: "{{$trigger.payload.ventilation_chief_id}}"
          subject: "GOAF CO ALERT: Inertization Required in Shaft {{read_goaf_co_telemetry.shaft_code}}"
          message: "Sensor {{read_goaf_co_telemetry.sensor_tag}} recorded CO={{read_goaf_co_telemetry.co_ppm}} ppm or low air velocity ({{read_goaf_co_telemetry.air_velocity_m_s}} m/s). N2 inertization task dispatched."
        position_x: 100
        position_y: 15
    edges:
      - ["$trigger", "read_goaf_co_telemetry", "resolve"]
      - ["read_goaf_co_telemetry", "verify_goaf_co_and_airflow", "resolve"]
      - ["verify_goaf_co_and_airflow", "confirm_goaf_thermal_stability", "resolve"]
      - ["verify_goaf_co_and_airflow", "escalate_goaf_co_inertization", "reject"]
      - ["escalate_goaf_co_inertization", "create_goaf_inertization_task", "resolve"]
      - ["create_goaf_inertization_task", "notify_ventilation_chief", "resolve"]

  - key: tkv-blast-seismic-ppv-vibration-gate
    name: "Open-Pit Blasting Peak Particle Velocity (PPV) Seismic Charge & Evacuation Gate"
    description: "Verifies maximum explosive charge per delay/round (<= 2500.0 kg), perimeter sweep, and evacuation completion to prevent highwall bench seismic destabilization."
    status: active
    accountability: activity
    trigger:
      type: action
      scope:
        - items.update
      collections:
        - tkv_blasting_permits
      filter:
        status:
          _eq: blast_submitted
    nodes:
      - key: read_seismic_blast_permit
        name: "Read Blasting Charge Weight & Perimeter Clearance"
        type: item-read
        options:
          collection: tkv_blasting_permits
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - permit_no
              - bench_sector
              - explosive_charge_kg
              - perimeter_swept
              - evacuation_completed
              - status
        position_x: 1
        position_y: 1

      - key: verify_charge_and_clearance_limits
        name: "Verify Charge <= 2500.0 kg, Perimeter Swept, and Evacuation Completed"
        type: condition
        options:
          filter:
            _and:
              - read_seismic_blast_permit:
                  explosive_charge_kg:
                    _lte: 2500.0
              - read_seismic_blast_permit:
                  perimeter_swept:
                    _eq: true
              - read_seismic_blast_permit:
                  evacuation_completed:
                    _eq: true
        position_x: 25
        position_y: 1

      - key: confirm_seismic_blast_compliance
        name: "Confirm Blast Seismic PPV & Clearance Envelope"
        type: transform
        options:
          format: json
          expression: "Explosive charge weight and evacuation clearance comply with highwall seismic PPV limits."
        position_x: 50
        position_y: 1

      - key: hold_blast_for_seismic_limit
        name: "Hold Blast Permit at blast_held_seismic_limit"
        type: item-update
        options:
          collection: tkv_blasting_permits
          key: "{{$trigger.key}}"
          data:
            status: blast_held_seismic_limit
            work_authorized: false
            rejection_reason: "Explosive charge exceeds 2500.0 kg seismic PPV limit or perimeter evacuation incomplete."
        position_x: 50
        position_y: 15

      - key: create_seismic_blast_capa
        name: "Create Blasting Charge Redesign & Geotechnical CAPA"
        type: item-create
        options:
          collection: grc_actions
          data:
            title: "Redesign Blast Charge Decking for Permit {{read_seismic_blast_permit.permit_no}} on Bench {{read_seismic_blast_permit.bench_sector}}"
            status: open
            priority: high
            source_module: blast_seismic_gate
            action_category: geotechnical_safety
            description: "Blasting permit {{read_seismic_blast_permit.permit_no}} held due to explosive charge ({{read_seismic_blast_permit.explosive_charge_kg}} kg > 2500 kg) or incomplete clearance. Recalculate electronic delay decking."
        position_x: 75
        position_y: 15

      - key: notify_geotech_blast_engineer
        name: "Alert Geotechnical & Drilling-Blasting Engineer"
        type: notification
        options:
          recipient: "{{$trigger.payload.geotech_engineer_id}}"
          subject: "BLAST HELD (SEISMIC LIMIT): Permit {{read_seismic_blast_permit.permit_no}} on {{read_seismic_blast_permit.bench_sector}}"
          message: "Blasting sequence held at blast_held_seismic_limit and CAPA created in grc_actions."
        position_x: 100
        position_y: 15
    edges:
      - ["$trigger", "read_seismic_blast_permit", "resolve"]
      - ["read_seismic_blast_permit", "verify_charge_and_clearance_limits", "resolve"]
      - ["verify_charge_and_clearance_limits", "confirm_seismic_blast_compliance", "resolve"]
      - ["verify_charge_and_clearance_limits", "hold_blast_for_seismic_limit", "reject"]
      - ["hold_blast_for_seismic_limit", "create_seismic_blast_capa", "resolve"]
      - ["create_seismic_blast_capa", "notify_geotech_blast_engineer", "resolve"]

  - key: tkv-methane-drainage-vacuum-recovery-gate
    name: "Degassing Vacuum Plant CH4 Drainage Efficiency & Slope Alarm Gate"
    description: "Monitors daily methane drainage efficiency (>= 65.0%) and active open-pit slope alarms (== 0). Generates a ventilation and geotechnical CAPA in grc_actions when degraded."
    status: active
    accountability: system
    trigger:
      type: event
      scope:
        - items.create
        - items.update
      collections:
        - tkv_mine_kpis
    nodes:
      - key: read_mine_drainage_kpis
        name: "Read CH4 Drainage Efficiency & Slope Alarm KPIs"
        type: item-read
        options:
          collection: tkv_mine_kpis
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - recorded_date
              - raw_coal_output_mt
              - ch4_drainage_efficiency_pct
              - active_slope_alarms
        position_x: 1
        position_y: 1

      - key: verify_ch4_drainage_and_slope_alarms
        name: "Verify CH4 Drainage >= 65.0% and Active Slope Alarms == 0"
        type: condition
        options:
          filter:
            _and:
              - read_mine_drainage_kpis:
                  ch4_drainage_efficiency_pct:
                    _gte: 65.0
              - read_mine_drainage_kpis:
                  active_slope_alarms:
                    _eq: 0
        position_x: 25
        position_y: 1

      - key: confirm_mine_safety_kpi_envelope
        name: "Confirm Degassing Efficiency & Slope Stability KPIs"
        type: transform
        options:
          format: json
          expression: "Methane vacuum drainage recovery >= 65% and zero active pit slope radar alarms."
        position_x: 50
        position_y: 1

      - key: create_ventilation_geotech_action
        name: "Create Ventilation & Geotechnical Remediation Action"
        type: item-create
        options:
          collection: grc_actions
          data:
            title: "Methane Vacuum Drainage & Slope Alarm Remediation ({{read_mine_drainage_kpis.recorded_date}})"
            status: open
            priority: critical
            source_module: methane_drainage_kpi_gate
            action_category: ventilation_geotech
            description: "CH4 drainage efficiency ({{read_mine_drainage_kpis.ch4_drainage_efficiency_pct}}%) dropped below 65.0% or active slope alarms ({{read_mine_drainage_kpis.active_slope_alarms}}) > 0. Inspect borehole vacuum seals and bench prisms."
        position_x: 50
        position_y: 15

      - key: notify_mine_technical_director
        name: "Alert Mine Technical Director of KPI Breach"
        type: notification
        options:
          recipient: "{{$trigger.payload.technical_director_id}}"
          subject: "MINE SAFETY KPI BREACH: CH4 Drainage / Slope Alarm Action Created ({{read_mine_drainage_kpis.recorded_date}})"
          message: "CH4 drainage recovery or slope radar alarm KPI breached safety threshold. Remediation CAPA created in grc_actions."
        position_x: 75
        position_y: 15
    edges:
      - ["$trigger", "read_mine_drainage_kpis", "resolve"]
      - ["read_mine_drainage_kpis", "verify_ch4_drainage_and_slope_alarms", "resolve"]
      - ["verify_ch4_drainage_and_slope_alarms", "confirm_mine_safety_kpi_envelope", "resolve"]
      - ["verify_ch4_drainage_and_slope_alarms", "create_ventilation_geotech_action", "reject"]
      - ["create_ventilation_geotech_action", "notify_mine_technical_director", "resolve"]

  - key: tkv-tailings-phreatic-spillway-drawdown-flow
    name: "Tailings Dam Phreatic Surface & Emergency Siphon Drawdown Flow"
    description: "Verifies tailings dam phreatic surface level (<= 18.0 m) and pore water pressure (<= 150.0 kPa). On exceedance, sets safety_status to EMERGENCY_SIPHON_DRAWDOWN and creates an urgent HSE task."
    status: active
    accountability: system
    trigger:
      type: event
      scope:
        - items.create
        - items.update
      collections:
        - tkv_tailings_dam_sensors
    nodes:
      - key: read_tailings_phreatic_telemetry
        name: "Read Tailings Dam Phreatic Level & Pore Pressure"
        type: item-read
        options:
          collection: tkv_tailings_dam_sensors
          key: "{{$trigger.key}}"
          query:
            fields:
              - id
              - piezometer_tag
              - dam_sector
              - phreatic_level_m
              - pore_pressure_kpa
              - safety_status
        position_x: 1
        position_y: 1

      - key: verify_phreatic_and_pore_pressure
        name: "Verify Phreatic Level <= 18.0 m and Pore Pressure <= 150.0 kPa"
        type: condition
        options:
          filter:
            _and:
              - read_tailings_phreatic_telemetry:
                  phreatic_level_m:
                    _lte: 18.0
              - read_tailings_phreatic_telemetry:
                  pore_pressure_kpa:
                    _lte: 150.0
        position_x: 25
        position_y: 1

      - key: confirm_phreatic_drawdown_nominal
        name: "Confirm Embankment Phreatic Surface Within Design Envelope"
        type: transform
        options:
          format: json
          expression: "Tailings dam phreatic level and pore pressure within GISTM structural safety limits."
        position_x: 50
        position_y: 1

      - key: activate_emergency_siphon_drawdown
        name: "Update Safety Status to EMERGENCY_SIPHON_DRAWDOWN"
        type: item-update
        options:
          collection: tkv_tailings_dam_sensors
          key: "{{$trigger.key}}"
          data:
            safety_status: EMERGENCY_SIPHON_DRAWDOWN
        position_x: 50
        position_y: 15

      - key: create_siphon_drawdown_hse_task
        name: "Create Urgent Decant Siphon & Spillway Drawdown HSE Task"
        type: item-create
        options:
          collection: hse_tasks
          data:
            title: "Open Emergency Decant Siphons & Inspect Toe Drain at Sector {{read_tailings_phreatic_telemetry.dam_sector}}"
            task_title: "Open Emergency Decant Siphons & Inspect Toe Drain"
            status: assigned
            priority: critical
            unit_tag: "TSF-SIPHON-SPILLWAY"
            assigned_to: "TSF_Hydro_Operations_Lead"
            deadline_hours: 1
        position_x: 75
        position_y: 15

      - key: notify_tsf_engineer_of_record
        name: "Alert TSF Engineer of Record (EoR) of Siphon Drawdown"
        type: notification
        options:
          recipient: "{{$trigger.payload.tsf_eor_id}}"
          subject: "EMERGENCY SIPHON DRAWDOWN: TSF Sector {{read_tailings_phreatic_telemetry.dam_sector}}"
          message: "Piezometer {{read_tailings_phreatic_telemetry.piezometer_tag}} phreatic level ({{read_tailings_phreatic_telemetry.phreatic_level_m}} m) or pore pressure ({{read_tailings_phreatic_telemetry.pore_pressure_kpa}} kPa) breached limit. Urgent drawdown task dispatched."
        position_x: 100
        position_y: 15
    edges:
      - ["$trigger", "read_tailings_phreatic_telemetry", "resolve"]
      - ["read_tailings_phreatic_telemetry", "verify_phreatic_and_pore_pressure", "resolve"]
      - ["verify_phreatic_and_pore_pressure", "confirm_phreatic_drawdown_nominal", "resolve"]
      - ["verify_phreatic_and_pore_pressure", "activate_emergency_siphon_drawdown", "reject"]
      - ["activate_emergency_siphon_drawdown", "create_siphon_drawdown_hse_task", "resolve"]
      - ["create_siphon_drawdown_hse_task", "notify_tsf_engineer_of_record", "resolve"]

rules:
  - rule_id: TKV-CH4-VENT-001
    name: "Underground Shaft CH4 Concentration Safety Ceiling"
    description: "Methane gas concentration in working faces must not exceed 0.75% for routine work, with mandatory power isolation at 1.0%."
    severity: critical
    condition: "methane_ch4_percent <= 0.75"
    enforcement: strict_rejection
    action: "Automatically isolate electric motors, switch to high-volume secondary ventilation, and evacuate miners."

  - rule_id: TKV-TSF-PORE-002
    name: "Tailings Embankment Pore Water Pressure Limit"
    description: "Piezometer water pore pressure must not exceed 150 kPa to prevent foundation liquefaction and embankment breaching."
    severity: high
    condition: "pore_pressure_kpa <= 150.0"
    enforcement: escalation
    action: "Trigger decant pump drawdown, notify dam safety engineer, and perform geotechnical inspection."

  - rule_id: TKV-SLOPE-003
    name: "Open-Pit Highwall Slope Radar Displacement Velocity Limit"
    description: "Open-pit bench interferometric radar displacement velocity must not exceed 5.0 mm/day and cumulative deformation must stay below 50.0 mm."
    severity: critical
    condition: "displacement_velocity_mm_day <= 5.0 && cumulative_displacement_mm <= 50.0"
    enforcement: escalation
    action: "Halt haulage ramp traffic beneath affected bench, evacuate shovel crews, and conduct geotechnical slope stability audit."

  - rule_id: TKV-FAN-004
    name: "Main Shaft Exhaust Ventilation Fan Pressure & Vibration Envelope"
    description: "Main surface exhaust fan differential static pressure must remain at least 1200 Pa with bearing vibration velocity <= 4.5 mm/s and airflow >= 80 m³/s."
    severity: critical
    condition: "main_fan_differential_pressure_pa >= 1200.0 && vibration_mm_s <= 4.5 && airflow_m3_s >= 80.0"
    enforcement: strict_rejection
    action: "Execute automatic damper switchover to standby ventilation fan and alert mine dispatch."

  - rule_id: TKV-SUMP-005
    name: "Underground Main Dewatering Sump & Hydrogeological Inrush Gate"
    description: "Underground main drainage sump water level must remain <= 75% capacity with inflow <= 250 m³/h and advance probe water pressure <= 15 bar."
    severity: critical
    condition: "sump_level_pct <= 75.0 && water_inflow_m3_hr <= 250.0 && advance_probe_pressure_bar <= 15.0"
    enforcement: escalation
    action: "Cascade standby high-head turbine pumps, close watertight bulkhead doors, and alert drainage superintendent."

  - rule_id: TKV-DESCENT-006
    name: "Underground Miner Shift Turnstile Fit-for-Duty & Post-Blast Clearance"
    description: "Shaft cage descent requires >= 30 minutes post-blast clearance, respirable dust <= 4.0 mg/m³, CO <= 20 ppm, NO2 <= 5 ppm, and zero blood alcohol."
    severity: high
    condition: "post_blast_clearance_minutes >= 30 && respirable_dust_mg_m3 <= 4.0 && gas_co_ppm <= 20.0 && breathalyzer_zero == true"
    enforcement: strict_rejection
    action: "Lock shaft entry turnstile, deny underground shift descent, and notify occupational health officer."

